<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Okul Panosu</title>
<style>
  :root{
    --ink: #211c17; --ink-soft: #4a4238; --muted: #7d7365;
    --paper: #f6f3ec; --surface: #ffffff; --surface-2: #efe9dd;
    --line: #e2dac9;
    --accent: #1f6b65; --accent-ink: #ffffff;
    --gold: #b8862e; --gold-ink: #1a1509;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink: #ede7db; --ink-soft: #cdc4b3; --muted: #948a78;
      --paper: #16140f; --surface: #201c16; --surface-2: #2a2519;
      --line: #3a3323;
      --accent: #57bdb2; --accent-ink: #0d1512;
      --gold: #d9a64e; --gold-ink: #241c0a;
    }
  }
  *{ box-sizing: border-box; }
  html, body{ margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--paper); }
  body{ font-family: "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, sans-serif; color: var(--ink); }

  #stage{ position: relative; width: 100vw; height: 100vh; }
  .slide{ position: absolute; inset: 0; display: flex; flex-direction: column; opacity: 0; transition: opacity .6s ease; pointer-events: none; }
  .slide.active{ opacity: 1; pointer-events: auto; }

  .topbar{ display: flex; align-items: center; justify-content: space-between; padding: 28px 56px 0; }
  .school-name{ font-size: 22px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
  .clock{ font-size: 22px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }

  .slide-body{ flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 80px; text-align: center; }

  /* Duyuru */
  .duyuru-title{ font-size: 64px; font-weight: 800; line-height: 1.1; margin: 0 0 24px; text-wrap: balance; }
  .duyuru-text{ font-size: 32px; color: var(--ink-soft); line-height: 1.5; max-width: 1100px; white-space: pre-wrap; }

  /* Medya */
  .media-slide .slide-body{ padding: 0; }
  .media-slide img, .media-slide video{ width: 100%; height: 100%; object-fit: contain; background: #000; }
  .media-slide iframe{ width: 100%; height: 100%; border: none; }
  .media-caption{ position: absolute; left: 0; right: 0; bottom: 0; padding: 20px 56px 28px; background: linear-gradient(to top, rgba(0,0,0,.72), transparent); color: #fff; text-align: left; }
  .media-caption .t{ font-size: 28px; font-weight: 700; }
  .media-caption .c{ font-size: 19px; opacity: .85; margin-top: 4px; }

  /* Pekiştireç — öne çıkan görünüm */
  .pekistirec-slide{ background: linear-gradient(135deg, var(--gold), #8a6420); color: var(--gold-ink); }
  .pekistirec-slide .topbar .school-name, .pekistirec-slide .topbar .clock{ color: rgba(0,0,0,.55); }
  .pek-badge{ font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; background: rgba(0,0,0,.14); padding: 10px 28px; border-radius: 999px; margin-bottom: 28px; }
  .pek-photo{ width: 260px; height: 260px; border-radius: 50%; object-fit: cover; border: 8px solid rgba(255,255,255,.55); box-shadow: 0 20px 50px rgba(0,0,0,.25); margin-bottom: 28px; }
  .pek-name{ font-size: 76px; font-weight: 900; line-height: 1.05; margin: 0 0 8px; text-wrap: balance; }
  .pek-period{ font-size: 26px; opacity: .8; margin-bottom: 20px; font-weight: 600; }
  .pek-desc{ font-size: 28px; max-width: 1000px; line-height: 1.5; }

  .empty{ display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; text-align:center; }
  .empty h1{ font-size: 42px; margin: 0 0 12px; }
  .empty p{ font-size: 22px; color: var(--muted); }

  .progress{ position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(0,0,0,.08); }
  .progress-bar{ height: 100%; background: var(--accent); width: 0%; }
  .pekistirec-slide .progress-bar{ background: rgba(0,0,0,.35); }

  #fullscreen-btn{
    position: fixed; bottom: 18px; right: 18px; z-index: 20;
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(0,0,0,.4); color: #fff; border: none;
    font-size: 20px; line-height: 1; cursor: pointer;
    opacity: .35; transition: opacity .2s ease;
  }
  #fullscreen-btn:hover, #fullscreen-btn:focus{ opacity: .95; }

  /* PIN ekranı (kişisel veri koruması) */
  .pin-wrap{ display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; text-align:center; padding: 40px; }
  .pin-wrap h1{ font-size: 40px; margin: 0 0 8px; }
  .pin-wrap p{ font-size: 20px; color: var(--muted); margin: 0 0 28px; max-width: 720px; }
  .pin-wrap input{ font-size: 44px; letter-spacing: .5em; text-align: center; width: 340px; padding: 14px 18px; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); font-variant-numeric: tabular-nums; }
  .pin-wrap button{ margin-top: 20px; font-size: 22px; padding: 14px 40px; border-radius: 12px; border: none; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  .pin-err{ color: #b3261e; font-size: 18px; margin-top: 16px; min-height: 24px; }
  #lock-btn{ position: fixed; bottom: 18px; left: 18px; z-index: 20; width: 46px; height: 46px; border-radius: 50%; background: rgba(0,0,0,.4); color: #fff; border: none; font-size: 20px; line-height: 1; cursor: pointer; opacity: .25; transition: opacity .2s ease; display: none; }
  #lock-btn:hover, #lock-btn:focus{ opacity: .95; }
</style>
</head>
<body>

<div id="stage"><div class="empty"><h1>Yükleniyor…</h1></div></div>
<button id="fullscreen-btn" title="Tam ekran">⛶</button>
<button id="lock-btn" title="Ekranı kilitle (PIN'i bu cihazdan sil)">🔒</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
<script src="pano.js"></script>
</body>
</html>
