<tr><td colspan="4"><b>TOPLAM</b></td><td><b>${sum("lesson_hours")}</b></td>${EKDERS_COLS.map(c => `<td><b>${sum(c.k) || ""}</b></td>`).join("")}<td></td><td><b>${totals.reduce((a, t) => a + t.hours, 0)}</b></td>${k ? `<td><b>${ekdersFmtTL(totals.reduce((a, t) => a + t.amount, 0))}</b></td>` : ""}<td></td></tr></tbody></table>
<p class="note">Dayanak: 2006/11350 sayılı Bakanlar Kurulu Kararı (md. 5, 6, 10, 11, 12, 17, 25), 2026 ve 2027 Yıllarını Kapsayan 8. Dönem Toplu Sözleşme (md. 8, 19, 27) ve 657 sayılı Kanun md. 176. Ek ders ücreti yalnızca fiilen yapılan görevler için ödenir (md.25).${k ? ` Tahmini tutar: haftalık saat × gösterge (gündüz 140; gece/hafta sonu/tatil 150; DYK 280/300; lisansüstü artırımı yalnızca ek ders ve yönetim görevinde) × ${k.toLocaleString("tr-TR", { maximumFractionDigits: 6 })} katsayısı. Kesin hesap MEBBİS Ek Ders Modülünde fiilen yapılan gün/saat üzerinden yapılır.` : ""}</p>
<table class="sig"><tr><td>${officialSignatureName(school.mudur_adi)}<br>Okul Müdürü</td><td>OLUR<br>…/…/……<br><br>…………………<br>${esc(sheet.olur_makam || "İlçe Millî Eğitim Müdürü")}</td></tr></table>
</body></html>`;
}
function ekdersOnayHtml(school, sheet, rows) {
  const k = sheet.katsayi ? +sheet.katsayi : null;
  const kTxt = k ? k.toLocaleString("tr-TR", { maximumFractionDigits: 6 }) : null;
  const tl = g => k ? ` (${g.toLocaleString("tr-TR")} × ${kTxt} = ${ekdersFmtTL(g * k)} TL)` : "";
  const makam = sheet.olur_makam || "İlçe Millî Eğitim Müdürü";
  const hitap = /kaymakam/i.test(makam) ? "KAYMAKAMLIK MAKAMINA" : /^il\b|il millî|il milli/i.test(makam) && !/ilçe/i.test(makam) ? "İL MİLLÎ EĞİTİM MÜDÜRLÜĞÜNE" : "İLÇE MİLLÎ EĞİTİM MÜDÜRLÜĞÜNE";
  const period = sheet.period_start && sheet.period_end ? `${fmtDate(sheet.period_start)} – ${fmtDate(sheet.period_end)} tarihleri arasında` : "ekli çizelgede belirtilen dönemde";
  const yonetici = rows.filter(r => ["mudur", "mudur_bas", "mudur_yrd"].includes(r.gorev)).length, ogretmen = rows.length - yonetici;
  return docWrapper(school, `
    <p style="margin-top:20px"><strong>${hitap}</strong></p>
    <p style="font-size:10.5pt"><strong>İlgi:</strong> a) 16/12/2006 tarihli ve 26378 sayılı Resmî Gazete'de yayımlanan 2006/11350 sayılı Bakanlar Kurulu Kararı (Millî Eğitim Bakanlığı Yönetici ve Öğretmenlerinin Ders ve Ek Ders Saatlerine İlişkin Karar),<br>b) 2026 ve 2027 Yıllarını Kapsayan 8. Dönem Toplu Sözleşme (Eğitim, Öğretim ve Bilim Hizmet Kolu),<br>c) 657 sayılı Devlet Memurları Kanunu'nun 176 ncı maddesi.</p>
    <p style="text-align:justify;text-indent:1.25cm">Okulumuzda görev yapan ve ekli çizelgede durumları belirtilen ${yonetici} yönetici ve ${ogretmen} öğretmene, ilgi (a) Karar ile ilgi (b) Toplu Sözleşme hükümleri gereğince ${period} isimleri karşısında belirtilen aylık karşılığı ders, ek ders ve ek ders görevinden sayılan (ders niteliğinde yönetim, hazırlık ve planlama, nöbet, öğrenci sosyal ve kişilik hizmetleri, ders dışı eğitim çalışmaları, sınav ve mesleki çalışma) görevlerinin verilmesi; kendilerine ders görevi verilenlere ilgi (c) madde gereğince ders saati başına gündüz öğretimi için 140${tl(140)}, yarıyıl ve yaz tatilleri, cumartesi ve pazar günleri ile saat 18.00'den sonra başlayan öğretim faaliyetleri için 150${tl(150)} gösterge rakamının memur aylık katsayısı ile çarpımı üzerinden; Destekleme ve Yetiştirme Kursları kapsamındaki görevler için %100 fazlasıyla${k ? ` (gündüz ${ekdersFmtTL(280 * k)} TL, gece ${ekdersFmtTL(300 * k)} TL)` : ""}, özel eğitim kapsamındaki görevler için %25 fazlasıyla${tl(175)}; yüksek lisans yapmış olanlara fiilen girdikleri dersler ve ders niteliğinde yönetim görevi için %7${tl(149.8)}, doktora yapmış olanlara %20${tl(168)} artırımlı olmak üzere, görevlerin fiilen yapılması kaydıyla ek ders ücreti ödenmesi hususunu olurlarınıza arz ederim.</p>
    <table style="width:100%;margin-top:30px"><tr><td style="text-align:center"><strong>${officialSignatureName(school.mudur_adi)}</strong><br>Okul Müdürü</td></tr></table>
    <p style="margin-top:34px;text-align:right"><strong>OLUR</strong><br>…/…/……<br><br>…………………<br>${esc(makam)}</p>
    <p style="margin-top:20px"><strong>Ek:</strong> Ek Ders Ücret Onay Çizelgesi (${rows.length} kişi)</p>
  `, { konu: "Ek Ders Ücret Onayı", tarih: toLocalISO(new Date()) });
}

async function renderEkdersModule(profile, school, sheetId = null) {
  app.innerHTML = `
    <div class="wrap wide">
      <button class="navlink" id="back-dash">← Panele dön</button>
      <div class="eyebrow">Ek Ders Ücret Onay Çizelgesi</div>
      <h1>${esc(school.name)}</h1>
      <div class="subtitle">Yönetici ve öğretmenlerin haftalık aylık karşılığı ders, ek ders ve ek ders görevinden sayılan saatleri; 2006/11350 sayılı Karar, 8. Dönem Toplu Sözleşme ve 657/176'ya göre otomatik sınır denetimi, yatay çizelge ve olur yazısı. Katsayıyı her dönem Hazine ve Maliye Bakanlığı genelgesinden gir — panel varsayılan katsayı vermez.</div>
      <div id="ekd-content"></div>
    </div>`;
  document.getElementById("back-dash").onclick = () => renderDashboard(profile, school);
  const content = document.getElementById("ekd-content");
  content.innerHTML = `<div class="card">Yükleniyor…</div>`;
  if (sheetId) await renderEkdersSheet(profile, school, content, sheetId);
  else await renderEkdersList(profile, school, content);
}

async function renderEkdersList(profile, school, content) {
  const { data: sheets } = await sb.from("ekders_sheets").select("*, ekders_rows(count)").eq("school_id", school.id).order("created_at", { ascending: false });
  const now = new Date(), y = now.getFullYear(), eoy = now.getMonth() + 1 >= 9 ? `${y}-${y + 1}` : `${y - 1}-${y}`;
  const defKat = ekdersDefaultKategori(school);
  content.innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">Yeni Çizelge</h3>
      <label>Başlık</label><input id="es-title" value="${esc(eoy)} Eğitim-Öğretim Yılı Ek Ders Ücret Onay Çizelgesi">
      <div style="display:grid;grid-template-columns:auto auto 1fr;gap:12px;align-items:end">
        <div><label>Dönem başlangıcı</label>${dateInputHtml("es-start", "")}</div>
        <div><label>Dönem bitişi</label>${dateInputHtml("es-end", "")}</div>
        <div><label>Memur aylık katsayısı <span style="color:var(--muted);font-weight:400">(dönem genelgesinden; boş bırakılabilir)</span></label><input id="es-katsayi" inputmode="decimal" placeholder="örn. 1,234567"></div>
      </div>
      <label>Kurum kategorisi <span style="color:var(--muted);font-weight:400">(Karar md.10/1-c yönetim görevi saatleri)</span></label>
      <select id="es-kategori">
        <option value="diger" ${defKat === "diger" ? "selected" : ""}>Diğer örgün eğitim kurumları (ilkokul, ortaokul, genel lise…) — müdür 20 / müdür yrd. 18 saat</option>
        <option value="anadolu_ozel" ${defKat === "anadolu_ozel" ? "selected" : ""}>Anadolu/fen/sosyal bilimler/spor lisesi, mesleki-teknik, özel eğitim, okul öncesi — müdür 25 / müdür yrd. 20 saat</option>
      </select>
      <label>Olur makamı (imza bloğu)</label><input id="es-olur" value="İlçe Millî Eğitim Müdürü">
      <button class="primary" id="es-save">Çizelgeyi Oluştur</button>
      <div id="es-msg"></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Çizelgeler</h3>
      ${(sheets || []).length ? sheets.map(s => `<div class="list-item"><span><strong>${esc(s.title)}</strong><div style="font-size:11.5px;color:var(--muted)">${s.period_start ? fmtDate(s.period_start) : "…"} – ${s.period_end ? fmtDate(s.period_end) : "…"} · ${s.ekders_rows?.[0]?.count ?? 0} kişi · katsayı ${s.katsayi ? (+s.katsayi).toLocaleString("tr-TR", { maximumFractionDigits: 6 }) : "girilmedi"}</div></span><div class="row-actions"><button data-open-sheet="${s.id}">Aç</button><button data-del-sheet="${s.id}">Sil</button></div></div>`).join("") : `<p style="color:var(--muted)">Henüz çizelge yok.</p>`}
    </div>`;
  wireDate3("es-start"); wireDate3("es-end");
  content.querySelectorAll("[data-open-sheet]").forEach(b => b.onclick = () => renderEkdersModule(profile, school, b.dataset.openSheet));
  content.querySelectorAll("[data-del-sheet]").forEach(b => b.onclick = async () => {
    const s = sheets.find(x => x.id === b.dataset.delSheet);
    if (!confirm(`"${s.title}" çizelgesini tüm satırlarıyla silmek istediğine emin misin?`)) return;
    await sb.from("ekders_sheets").delete().eq("id", s.id);
    await renderEkdersList(profile, school, content);
  });
  document.getElementById("es-save").onclick = async () => {
    const msg = document.getElementById("es-msg");
    const title = document.getElementById("es-title").value.trim();
    if (!title) { msg.innerHTML = `<div class="msg err">Başlık gerekli.</div>`; return; }
    const kRaw = document.getElementById("es-katsayi").value.trim();
    if (kRaw && !ekdersParseK(kRaw)) { msg.innerHTML = `<div class="msg err">Katsayı sayı olmalı (örn. 1,234567).</div>`; return; }
    const { data, error } = await sb.from("ekders_sheets").insert({
      school_id: school.id, title, period_start: document.getElementById("es-start").value || null, period_end: document.getElementById("es-end").value || null,
      katsayi: ekdersParseK(kRaw), kurum_kategori: document.getElementById("es-kategori").value, olur_makam: document.getElementById("es-olur").value.trim() || null, created_by: profile.id,
    }).select().single();
    if (error) { msg.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
    await renderEkdersModule(profile, school, data.id);
  };
}

async function renderEkdersSheet(profile, school, content, sheetId) {
  const [{ data: sheet }, { data: dbRows }] = await Promise.all([
    sb.from("ekders_sheets").select("*").eq("id", sheetId).single(),
    sb.from("ekders_rows").select("*").eq("sheet_id", sheetId).order("sort_order").order("created_at"),
  ]);
  if (!sheet) { content.innerHTML = `<div class="card">Çizelge bulunamadı.</div>`; return; }
  let rows = (dbRows || []).map(r => ({ ...r }));
  const removed = [];
  let dirty = false;
  const k = sheet.katsayi ? +sheet.katsayi : null, kat = sheet.kurum_kategori, okulTuru = school.okul_turu;
  const inp = 'style="margin:0;padding:4px;font-size:12.5px"';
  const numInput = (i, key, val, ro = false) => `<input type="number" min="0" step="1" data-r="${i}" data-k="${key}" value="${+val || 0}" ${ro ? "readonly" : ""} style="width:52px;margin:0;padding:4px;text-align:center;font-size:12.5px${ro ? ";background:var(--surface-2);color:var(--muted)" : ""}">`;
  const rowHtml = (r, i) => {
    const t = ekdersRowTotals(r, k), w = ekdersWarnings(r, kat, okulTuru);
    return `<tr data-row="${i}">
      <td>${i + 1}</td>
      <td><input data-r="${i}" data-k="full_name" value="${esc(r.full_name)}" style="width:150px;margin:0;padding:4px;font-size:12.5px"></td>
      <td><select data-r="${i}" data-k="gorev" style="width:170px;margin:0;padding:4px;font-size:12px">${Object.entries(EKDERS_GOREV).map(([id, g]) => `<option value="${id}" ${r.gorev === id ? "selected" : ""}>${g.label}</option>`).join("")}</select></td>
      <td><input data-r="${i}" data-k="brans" value="${esc(r.brans || "")}" style="width:110px;margin:0;padding:4px;font-size:12.5px"></td>
      <td>${numInput(i, "lesson_hours", r.lesson_hours)}</td>
      ${EKDERS_COLS.map(c => `<td>${numInput(i, c.k, r[c.k], !!c.auto)}</td>`).join("")}
      <td><select data-r="${i}" data-k="lisansustu" style="width:78px;margin:0;padding:4px;font-size:12px">${Object.entries(EKDERS_LU_LABEL).map(([id, l]) => `<option value="${id}" ${r.lisansustu === id ? "selected" : ""}>${l}${id === "yl" ? " %7" : id === "doktora" ? " %20" : ""}</option>`).join("")}</select></td>
      <td class="ekd-hours" style="text-align:center"><strong>${t.hours}</strong></td>
      <td class="ekd-amount" style="text-align:right;white-space:nowrap">${k ? ekdersFmtTL(t.amount) : "—"}</td>
      <td><input data-r="${i}" data-k="aciklama" value="${esc(r.aciklama || "")}" style="width:120px;margin:0;padding:4px;font-size:12px"></td>
      <td class="ekd-warn" style="min-width:180px;font-size:11px;color:var(--crit)">${w.map(esc).join("<br>")}</td>
      <td><button data-del-row="${i}" style="margin:0;padding:4px 8px;font-size:12px">Sil</button></td>
    </tr>`;
  };
  const footHtml = () => {
    const tot = rows.map(r => ekdersRowTotals(r, k));
    const sum = key => rows.reduce((a, r) => a + (+r[key] || 0), 0);
    return `<tr style="font-weight:600"><td colspan="4">Toplam (${rows.length} kişi)</td><td style="text-align:center">${sum("lesson_hours")}</td>${EKDERS_COLS.map(c => `<td style="text-align:center">${sum(c.k)}</td>`).join("")}<td></td><td style="text-align:center">${tot.reduce((a, t) => a + t.hours, 0)}</td><td style="text-align:right;white-space:nowrap">${k ? ekdersFmtTL(tot.reduce((a, t) => a + t.amount, 0)) : "—"}</td><td colspan="3"></td></tr>`;
  };

  content.innerHTML = `
    <button class="navlink" id="ekd-back-list">← Çizelge listesi</button>
    <div class="card" style="margin-bottom:14px">
      <h3 style="margin-top:0">${esc(sheet.title)}</h3>
      <div style="display:grid;grid-template-columns:auto auto 1fr 1fr;gap:12px;align-items:end">

      </select>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
        <button class="secondary" id="ek-save-settings" style="width:auto;margin:0;padding:8px 14px">Ayarları kaydet</button>
      </div>
      <div id="ek-smsg"></div>
      <p style="font-size:12px;color:var(--muted);margin:10px 0 0">Katsayı girilmezse tutar sütunu boş kalır; saat sınırları yine denetlenir. Katsayı Ocak ve Temmuz'da Hazine ve Maliye Bakanlığı genelgesiyle değişir; panel değer önermez.</p>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <h3 style="margin:0">Satırlar <span id="ek-dirty" style="font-size:12px;color:var(--warn);font-weight:400"></span></h3>

      <div class="table-wrap" id="ek-table-wrap"></div>
      <div id="ek-rmsg"></div>
    </div>
    <div class="card">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <h3 style="margin:0;flex:1">Belgeler</h3>
        <button class="secondary" id="ek-doc-cizelge" style="width:auto;margin:0;padding:7px 12px;font-size:12.5px">Çizelge (yatay A4)</button>
        <button class="secondary" id="ek-doc-onay" style="width:auto;margin:0;padding:7px 12px;font-size:12.5px">Olur yazısı</button>
      </div>
      <p style="font-size:12px;color:var(--muted);margin:8px 0 0">Belgeler ekrandaki güncel satırlarla üretilir (kaydedilmemiş değişiklikler dâhil).</p>
      <div id="ekd-preview" style="margin-top:12px"></div>
    </div>`;
  wireDate3("ek-start"); wireDate3("ek-end");

  const drawTable = () => {
    document.getElementById("ek-table-wrap").innerHTML = rows.length ? `<table class="data" style="font-size:12.5px"><thead><tr><th>#</th><th>Adı Soyadı</th><th>Görevi</th><th>Branşı</th><th title="Ders Dağıtım'dan; elle düzeltilebilir">Haftalık ders</th>${EKDERS_COLS.map(c => `<th title="${esc(c.label)}">${esc(c.label.split(" (")[0].replace("Öğrenci Sosyal ve Kişilik Hizmetleri", "Sos. Kişilik").replace("Ders Niteliğinde Yönetim Görevi", "Yönetim").replace("Hazırlık ve Planlama Görevi", "Haz.-Plan.").replace("Aylık Karşılığı Ders Görevi", "Aylık karş.").replace("Ders Dışı Eğitim Çalışması", "Egzersiz").replace("Ek Ders Görevi", "Ek ders").replace("Mesleki Çalışma", "Mesleki").replace("Nöbet Görevi", "Nöbet").replace("Sınav Görevi", "Sınav"))}${c.label.includes("(Gece") ? " gece" : c.label.includes("(Gündüz)") ? " gündüz" : ""}</th>`).join("")}<th>Lisansüstü</th><th>Ücretli saat</th><th>Tahmini ₺/hafta</th><th>Açıklama</th><th>Uyarı</th><th></th></tr></thead><tbody>${rows.map(rowHtml).join("")}${footHtml()}</tbody></table>` : `<p style="color:var(--muted)">Satır yok — "Personelden doldur" ile başla.</p>`;
    wireRows();
  };
  const setDirty = (v) => { dirty = v; document.getElementById("ek-dirty").textContent = v ? "(kaydedilmemiş değişiklik var)" : ""; };
  const refreshRow = (i) => {
    const tr = content.querySelector(`tr[data-row="${i}"]`); if (!tr) return;
    const t = ekdersRowTotals(rows[i], k), w = ekdersWarnings(rows[i], kat, okulTuru);
    tr.querySelector(".ekd-hours").innerHTML = `<strong>${t.hours}</strong>`;
    tr.querySelector(".ekd-amount").textContent = k ? ekdersFmtTL(t.amount) : "—";
    tr.querySelector(".ekd-warn").innerHTML = w.map(esc).join("<br>");
    const foot = content.querySelector("tbody tr:last-child"); if (foot) foot.outerHTML = footHtml();
  };
  const wireRows = () => {
    content.querySelectorAll("[data-r]").forEach(el => {
      el.oninput = el.onchange = () => {
        const i = +el.dataset.r, key = el.dataset.k, r = rows[i];
        r[key] = el.type === "number" ? Math.max(0, parseInt(el.value, 10) || 0) : el.value;
        if (key === "lesson_hours" || key === "gorev") {
          Object.assign(r, ekdersDerive(r, kat));
          ["aylik_karsiligi", "ek_ders", "hazirlik_planlama", "yonetim_gorevi"].forEach(dk => { const t = content.querySelector(`[data-r="${i}"][data-k="${dk}"]`); if (t) t.value = r[dk]; });
        }
        setDirty(true); refreshRow(i);
      };
    });
    content.querySelectorAll("[data-del-row]").forEach(b => b.onclick = () => {
      const i = +b.dataset.delRow; if (rows[i].id) removed.push(rows[i].id); rows.splice(i, 1); setDirty(true); drawTable();
    });
  };
  drawTable();

  document.getElementById("ekd-back-list").onclick = () => { if (dirty && !confirm("Kaydedilmemiş değişiklikler var. Yine de çıkılsın mı?")) return; renderEkdersModule(profile, school); };
  document.getElementById("ek-add").onclick = () => {
    const r = { id: null, teacher_id: null, full_name: "", gorev: "ogretmen", brans: null, lesson_hours: 0, lisansustu: "yok", aciklama: null };
    EKDERS_COLS.forEach(c => r[c.k] = 0); Object.assign(r, ekdersDerive(r, kat)); rows.push(r); setDirty(true); drawTable();
    const first = content.querySelector(`[data-r="${rows.length - 1}"][data-k="full_name"]`); if (first) first.focus();
  };
  document.getElementById("ek-fill").onclick = async () => {
    const msg = document.getElementById("ek-rmsg");
    const [{ data: teachers }, { data: profs }, { data: csh }, { data: duties }] = await Promise.all([
      sb.from("teachers").select("id, full_name, branch, is_idareci").eq("school_id", school.id).in("staff_type", ["ogretmen", "yonetici"]).order("full_name"),
      sb.from("profiles").select("id, full_name, role").eq("school_id", school.id).neq("role", "ogretmen"),
      sb.from("class_subject_hours").select("teacher_id, weekly_hours").eq("school_id", school.id),
      sb.from("duty_assignments").select("teacher_id").gte("duty_date", toLocalISO(new Date(Date.now() - 45 * 86400000))),
    ]);
    const hoursBy = {}; (csh || []).forEach(x => { if (x.teacher_id) hoursBy[x.teacher_id] = (hoursBy[x.teacher_id] || 0) + (+x.weekly_hours || 0); });
    const dutySet = new Set((duties || []).map(d => d.teacher_id));
    const norm = s => (s || "").trim().toLocaleLowerCase("tr-TR");
    const ids = new Set(rows.map(r => r.teacher_id).filter(Boolean)), names = new Set(rows.map(r => norm(r.full_name)));
    const guess = t => t.is_idareci ? "mudur_yrd" : /rehber|pdr|psikolojik/i.test(t.branch || "") ? "rehber" : /sınıf öğretmen|sinif ogretmen/i.test(t.branch || "") ? "sinif" : /okul öncesi|anaokul|ana sınıfı/i.test(t.branch || "") ? "okul_oncesi" : "ogretmen";
    const mk = b => { const r = { id: null, teacher_id: b.teacher_id || null, full_name: b.full_name, gorev: b.gorev, brans: b.brans || null, lesson_hours: b.lesson_hours || 0, lisansustu: "yok", aciklama: null }; EKDERS_COLS.forEach(c => r[c.k] = 0); Object.assign(r, ekdersDerive(r, kat)); r.nobet = b.nobet ? 3 : 0; return r; };
    let added = 0;
    (profs || []).forEach(p => {
      if (names.has(norm(p.full_name)) || (teachers || []).some(t => norm(t.full_name) === norm(p.full_name))) return;
      rows.push(mk({ full_name: p.full_name, gorev: p.role === "mudur" ? "mudur" : "mudur_yrd" })); names.add(norm(p.full_name)); added++;
    });
    (teachers || []).forEach(t => {
      if (ids.has(t.id) || names.has(norm(t.full_name))) return;
      const g = guess(t);
      rows.push(mk({ teacher_id: t.id, full_name: t.full_name, gorev: g, brans: t.branch, lesson_hours: hoursBy[t.id] || 0, nobet: dutySet.has(t.id) && EKDERS_GOREV[g].nobet }));
      ids.add(t.id); names.add(norm(t.full_name)); added++;
    });
    drawTable(); if (added) setDirty(true);
    msg.innerHTML = `<div class="msg ${added ? "ok" : ""}">${added ? `${added} kişi eklendi — ders yükü Ders Dağıtım'dan, nöbet Nöbet Programı'ndan (son 45 gün) dolduruldu. Kontrol edip kaydet.` : "Eklenecek yeni personel yok (hepsi listede)."}</div>`;
  };
  const payloadOf = (r, i) => {
    const p = { school_id: school.id, sheet_id: sheetId, teacher_id: r.teacher_id || null, full_name: (r.full_name || "").trim() || "—", gorev: r.gorev || "ogretmen", brans: (r.brans || "").trim() || null, lesson_hours: +r.lesson_hours || 0, lisansustu: r.lisansustu || "yok", aciklama: (r.aciklama || "").trim() || null, sort_order: i };
    EKDERS_COLS.forEach(c => p[c.k] = +r[c.k] || 0);
    return p;
  };
  document.getElementById("ek-save-rows").onclick = async () => {
    const msg = document.getElementById("ek-rmsg");
    const results = await Promise.all([
      ...rows.filter(r => r.id).map(r => sb.from("ekders_rows").update(payloadOf(r, rows.indexOf(r))).eq("id", r.id)),
      rows.some(r => !r.id) ? sb.from("ekders_rows").insert(rows.filter(r => !r.id).map(r => payloadOf(r, rows.indexOf(r)))) : Promise.resolve({}),
      removed.length ? sb.from("ekders_rows").delete().in("id", removed) : Promise.resolve({}),
    ]);
    const err = results.find(x => x && x.error);
    if (err) { msg.innerHTML = `<div class="msg err">${esc(err.error.message)}</div>`; return; }
    await sb.from("ekders_sheets").update({ updated_at: new Date().toISOString() }).eq("id", sheetId);
    await renderEkdersSheet(profile, school, content, sheetId);
  };
  document.getElementById("ek-save-settings").onclick = async () => {
    const msg = document.getElementById("ek-smsg");
    const kRaw = document.getElementById("ek-katsayi").value.trim();
    if (kRaw && !ekdersParseK(kRaw)) { msg.innerHTML = `<div class="msg err">Katsayı sayı olmalı (örn. 1,234567).</div>`; return; }
    const newKat = document.getElementById("ek-kategori").value;
    const patch = { period_start: document.getElementById("ek-start").value || null, period_end: document.getElementById("ek-end").value || null, katsayi: ekdersParseK(kRaw), kurum_kategori: newKat, olur_makam: document.getElementById("ek-olur").value.trim() || null, updated_at: new Date().toISOString() };
    const { error } = await sb.from("ekders_sheets").update(patch).eq("id", sheetId);
    if (error) { msg.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
    if (newKat !== kat && rows.length) {
      rows.forEach(r => { r.yonetim_gorevi = (EKDERS_GOREV[r.gorev] || EKDERS_GOREV.ogretmen).yonetim[newKat] ?? 0; });
      await Promise.all(rows.filter(r => r.id).map(r => sb.from("ekders_rows").update({ yonetim_gorevi: r.yonetim_gorevi }).eq("id", r.id)));
    }
    if (dirty && !confirm("Satırlarda kaydedilmemiş değişiklik var; ayarlar kaydedildi. Sayfa yenilenirse satır değişiklikleri kaybolur. Devam edilsin mi?")) return;
    await renderEkdersSheet(profile, school, content, sheetId);
  };
  const liveSheet = () => ({ ...sheet, katsayi: ekdersParseK(document.getElementById("ek-katsayi").value) ?? null, period_start: document.getElementById("ek-start").value || null, period_end: document.getElementById("ek-end").value || null, olur_makam: document.getElementById("ek-olur").value.trim() || null, kurum_kategori: document.getElementById("ek-kategori").value });
  const fname = (suffix) => `${sheet.title.slice(0, 60)} ${suffix}`;
  document.getElementById("ek-doc-cizelge").onclick = () => disShowPreview(document.getElementById("ekd-preview"), ekdersCizelgeHtml(school, liveSheet(), rows), fname("Çizelge"));
  document.getElementById("ek-doc-onay").onclick = () => disShowPreview(document.getElementById("ekd-preview"), ekdersOnayHtml(school, liveSheet(), rows), fname("Olur Yazısı"));
}

function disRegime(school) { return school && school.okul_turu === "lise" ? DIS_LISE : DIS_ORTA; }
const DIS_STAGE_IDX = Object.fromEntries(DIS_STAGE_IDS.map((s, i) => [s, i]));

/* İş günü: Cumartesi/Pazar hariç (resmî tatiller modellenmedi — ekranda belirtilir). */
function addBusinessDays(iso, n) {
  const d = new Date(iso + "T00:00:00");
  let left = n;
  while (left > 0) { d.setDate(d.getDate() + 1); const w = d.getDay(); const iso = toLocalISO(d); if (w !== 0 && w !== 6 && !isResmiTatil(iso)) left--; }
  return toLocalISO(d);
}
function disCaseNo(c) { return `${c.case_year}/${String(c.case_seq).padStart(3, "0")}`; }
function disSanctionLabel(R, s) { return R.sanctions[s] || DIS_ORTA.sanctions[s] || DIS_LISE.sanctions[s] || s; }
function disUstKurul(R, key) { return R.ustKurulAdi[key] || R.ustKurulAdi.ilce; }
function disApprovalTarget(R, sanction) { const t = R.approvalBy(sanction); return t === "mudur" ? "okul müdürlüğü" : disUstKurul(R, t); }

/* Yönetmelikteki süreli adımlar → her biri için son tarih ve durum. */
function disDeadlines(c, docs, R) {
  R = R || DIS_ORTA;
  const today = toLocalISO(new Date());
  const out = [];
  const state = (due, done) => done ? "tamam" : (due < today ? "gecti" : (addBusinessDays(today, 2) >= due ? "yaklasiyor" : "uygun"));
  const sevk = (docs || []).find(d => d.doc_type === "kurula_sevk");
  const karar = (docs || []).find(d => d.doc_type === "kurul_karari");
  const decided = !!karar || !!c.decision_date;
  if (R.key === "lise" && c.tedbir_start) {
    const due = addBusinessDays(c.tedbir_start, R.tedbirBaslama);
    out.push({ key: "tedbir", label: `Tedbir kararını izleyen ${R.tedbirBaslama} iş günü içinde disiplin işlemine başlanması (md.175/2)`, due, state: state(due, !!sevk || decided) });
    const tEnd = addBusinessDays(c.tedbir_start, R.tedbirMax);
    if (!c.tedbir_end || c.tedbir_end > tEnd) out.push({ key: "tedbir_max", label: `Tedbir süresi en çok ${R.tedbirMax} iş günü (md.175/1); MEM onayıyla iki kez uzatılabilir`, due: tEnd, state: state(tEnd, !!c.tedbir_end && c.tedbir_end <= tEnd) });
  }
  if (sevk) {
    const due = addBusinessDays(sevk.doc_date || sevk.created_at.slice(0, 10), R.kurulSure);
    out.push({ key: "kurul", label: R.key === "lise" ? `Kurulun karar süresi (md.192/3: kurula gelişten itibaren ${R.kurulSure} iş günü)` : `Kurulun inceleme süresi (Madde 59/3: ${R.kurulSure} iş günü)`, due, state: state(due, decided) });
  }
  const appr = R.approvalBy(c.sanction);
  if (appr !== "mudur" && c.decision_date && R.key === "ortaokul") {
    const due = addBusinessDays(c.decision_date, R.ilceSure);
    out.push({ key: "ilce", label: `Dosyanın ilçe kuruluna gönderilmesi (Madde 61/1: ${R.ilceSure} iş günü)`, due, state: state(due, !!c.ilce_sent_on) });
  }
  if (c.notified_on) {
    const due = addBusinessDays(c.notified_on, R.itirazSure);
    out.push({ key: "itiraz", label: `Velinin itiraz süresi (${R.refs.itiraz}: tebliğden itibaren ${R.itirazSure} iş günü)`, due, state: c.appeal_on ? "itiraz" : (due < today ? "kapandi" : "acik") });
    if (R.key === "lise" && c.appeal_on) {
      const due2 = addBusinessDays(c.appeal_on, R.itirazSevkSure);
      out.push({ key: "itiraz_sevk", label: `İtirazın görüşlerle birlikte ${disUstKurul(R, R.appealTo(c.sanction))}'na gönderilmesi (md.169/3: ${R.itirazSevkSure} iş günü)`, due: due2, state: state(due2, !!c.appeal_sent_on) });
    }
    if (!c.appeal_on && due < today && c.sanction !== "yok" && c.sanction !== "yaptirimsiz" && !c.eokul_entered && c.stage !== "tamam") {
      out.push({ key: "eokul", label: `İtiraz süresi doldu — yaptırımın e-Okul'a işlenmesi (${R.refs.eokul})`, due, state: "gecti" });
    }
  }
  return out;
}

const DIS_DOCS_CACHE = {};
function disDocs(R) { return DIS_DOCS_CACHE[R.key] || (DIS_DOCS_CACHE[R.key] = disDocsFor(R)); }
function disDocTpl(R, key) { return disDocs(R).find(d => d.key === key) || disDocs(R === DIS_LISE ? DIS_ORTA : DIS_LISE).find(d => d.key === key); }

function disDocHtml(school, kase, docType, data) {
  const R = disRegime(school);
  const tpl = disDocTpl(R, docType);
  if (!tpl) return docWrapper(school, `<p>Bilinmeyen belge türü.</p>`);
  return docWrapper(school, tpl.render(data, kase, school), tpl.meta ? tpl.meta(data, kase) : {});
}

function disShowPreview(container, fullHtml, filename) {
  container.innerHTML = `
    <div style="border:1px solid var(--line);border-radius:8px;overflow:hidden"><iframe class="dis-frame" style="width:100%;height:520px;border:none;background:#fff"></iframe></div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="secondary dis-print" style="flex:1">Yazdır</button>
      <button class="secondary dis-download" style="flex:1">Word olarak indir</button>
      <button class="secondary dis-close" style="flex:0 0 auto">Kapat</button>
    </div>`;
  const frame = container.querySelector(".dis-frame");
  frame.srcdoc = fullHtml;
  container.querySelector(".dis-print").onclick = () => { frame.contentWindow.focus(); frame.contentWindow.print(); };
  container.querySelector(".dis-download").onclick = () => {
    const blob = new Blob(["﻿", fullHtml], { type: "application/msword" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = `${filename}.doc`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  };
  container.querySelector(".dis-close").onclick = () => { container.innerHTML = ""; };
  container.scrollIntoView({ behavior: "smooth", block: "start" });
}

async function renderDisiplinCase(profile, school, content, caseId, ui = {}) {
  const R = disRegime(school), L = R.key === "lise";
  const [{ data: kase }, { data: docs }, { data: committees }, { data: teachers }] = await Promise.all([
    sb.from("discipline_cases").select("*").eq("id", caseId).single(),
    sb.from("discipline_docs").select("*").eq("case_id", caseId).order("created_at"),
    sb.from("committees").select("id, name").eq("school_id", school.id).or("name.ilike.%davranış%,name.ilike.%disiplin%"),
    sb.from("teachers").select("full_name, branch").eq("school_id", school.id),
  ]);
  if (!kase) { content.innerHTML = `<div class="card">Dosya bulunamadı.</div>`; return; }
  let kurulUyeleri = "";
  if (committees && committees.length) {
    const { data: members } = await sb.from("committee_members").select("member_name, role").eq("committee_id", committees[0].id);
    kurulUyeleri = (members || []).map(m => `${m.member_name}${m.role ? ` — ${m.role}` : ""}`).join("\n");
  }
  const rehber = (teachers || []).find(t => /rehber|pdr/i.test(t.branch || ""))?.full_name || "";
  const deadlines = disDeadlines(kase, docs || [], R);
  const stageIdx = DIS_STAGE_IDX[kase.stage];
  const has = (k) => (docs || []).some(d => d.doc_type === k);
  const today = toLocalISO(new Date());
  const rerender = (patch = {}) => renderDisiplinCase(profile, school, content, caseId, { ...ui, ...patch });
  const approvalTarget = R.approvalBy(kase.sanction);
  const checklist = L ? [
    ["Olay tutanağı / yazılı şikâyet dosyada (md.167)", has("olay_tutanagi")],
    ["Rehberlik servisi raporu alındı (md.192/1)", has("rehberlik_gorusu")],
    ["Kurula sevk yazısı", has("kurula_sevk")],
    ["Öğrenci ve tanık ifadeleri yazılı alındı (md.193)", has("ogrenci_ifade") || has("tanik_ifade") || has("ifade_vermeme")],
    ["Savunma alındı ya da vermeme tutanağı düzenlendi (md.194–195)", has("savunma_tutanagi") || has("ifade_vermeme")],

    if (docTpl.key === "kurul_karari") { if (data.karar_no) patch.decision_no = data.karar_no; if (data.tarih) patch.decision_date = data.tarih; if (data.gerekce) patch.decision_rationale = data.gerekce; }

    if (docTpl.key === "tedbir_karari") { if (data.baslangic) patch.tedbir_start = data.baslangic; if (data.bitis) patch.tedbir_end = data.bitis; }
    await sb.from("discipline_cases").update(patch).eq("id", caseId);
    await rerender({ newDoc: null, openDocId: saved.id });

  content.querySelectorAll("[data-open-doc]").forEach(b => b.onclick = () => openDoc((docs || []).find(d => d.id === b.dataset.openDoc)));

  if (ui.openDocId) { const d = (docs || []).find(x => x.id === ui.openDocId); if (d) openDoc(d); }
}

/* EDATE mantığı: ay ekle, gün ayın son gününü aşarsa kırp (31 Oca + 1 ay = 28/29 Şub). */
function addMonthsISO(iso, months) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1 + months, 1);
  const lastDay = new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate();
  dt.setDate(Math.min(d, lastDay));
  return toLocalISO(dt);
}

/* "Yaklaşıyor" eşiği: 30 gün, ama periyodun yarısını aşmaz — aylık bir kalem bugün yapıldığında
   anında "yaklaşıyor" görünmesin (1 ay → 15 gün, 2 ay ve üzeri → 30 gün). */
function bakimWarnThreshold(periodMonths) {
  return Math.min(30, Math.max(7, Math.round(periodMonths * 30.4 / 2)));
}

function bakimStatusOf(item, todayISO) {
  if (!item.last_done_on) return { status: "kayit_yok", next: null, daysLeft: null };
  const next = addMonthsISO(item.last_done_on, item.period_months);
  const daysLeft = Math.round((new Date(next + "T00:00:00") - new Date(todayISO + "T00:00:00")) / 86400000);
  const status = daysLeft < 0 ? "gecikti" : daysLeft <= bakimWarnThreshold(item.period_months) ? "yaklasiyor" : "uygun";
  return { status, next, daysLeft };
}

function bakimPeriodLabel(months) {
  if (months % 12 === 0) return months === 12 ? "Yılda 1" : `${months / 12} yılda 1`;
  if (months === 1) return "Her ay";
  return `${months} ayda 1`;
}

    sb.from("maintenance_items").select("*").eq("school_id", school.id).eq("is_active", true).order("name"),
    sb.from("maintenance_logs").select("*").eq("school_id", school.id).order("done_on", { ascending: false }),
  ]);
  const todayISO = toLocalISO(new Date());
  const rows = (items || []).map(i => ({ ...i, ...bakimStatusOf(i, todayISO) }));
  const counts = { gecikti: 0, yaklasiyor: 0, uygun: 0, kayit_yok: 0 };
  rows.forEach(r => counts[r.status]++);
  const rerender = (patch) => renderBakim(profile, school, content, { ...state, ...patch });

      <p style="color:var(--muted);font-size:12.5px">Sık rastlanan ${missingSeed.length} bakım/kontrol kalemini örnek periyotlarıyla tek tıkla ekleyebilirsin; sonra düzenler, silersin. <strong>Periyotlar öneridir</strong> — mevzuat/yetkili kuruluş süresi farklıysa onu esas al.</p>

    </div>` : ""}

      </div>
      ${filtered.length ? `
      <div class="table-wrap" style="margin-top:12px">
      <table class="data">
        <thead><tr><th>Bakım</th><th>Kategori</th><th>Periyot</th><th>Son</th><th>Sonraki</th><th>Kalan</th><th>Durum</th><th></th></tr></thead>
        <tbody>
          ${filtered.map(r => `
            <tr>
              <td><strong>${esc(r.name)}</strong>${r.responsible ? `<div style="font-size:11.5px;color:var(--muted)">${esc(r.responsible)}${r.contact ? ` · ${esc(r.contact)}` : ""}</div>` : ""}${r.notes ? `<div style="font-size:11.5px;color:var(--muted)">💡 ${esc(r.notes)}</div>` : ""}</td>

              <td style="white-space:nowrap">${r.daysLeft === null ? "—" : r.daysLeft < 0 ? `<span style="color:var(--crit);font-weight:700">${-r.daysLeft} gün geçti</span>` : `${r.daysLeft} gün`}</td>
              <td><span class="pill ${BAKIM_STATUS_PILL[r.status]}">${BAKIM_STATUS_LABELS[r.status]}</span></td>
              <td class="row-actions" style="white-space:nowrap">
                <button data-log-for="${r.id}">✓ Yapıldı</button>
                <button data-history-for="${r.id}">Geçmiş${logsByItem[r.id]?.length ? ` (${logsByItem[r.id].length})` : ""}</button>
                <button data-edit-bakim="${r.id}">Düzenle</button>

            </tr>
            ${logItemId === r.id ? `
            <tr><td colspan="8" style="background:var(--surface-2)">
              <div style="padding:6px 0"><strong>${esc(r.name)}</strong> — bakım yapıldı olarak kaydet</div>
              <div style="display:grid;grid-template-columns:auto 1fr 1fr;gap:12px;align-items:end">
                <div><label>Tarih</label>${dateInputHtml("bl-date", todayISO)}</div>
                <div><label>Yapan firma / kişi</label><input id="bl-by" value="${esc(r.responsible || "")}" placeholder="opsiyonel"></div>
                <div><label>Maliyet (₺) <span style="color:var(--muted);font-weight:400">(opsiyonel)</span></label><input id="bl-cost" type="number" min="0" step="0.01" placeholder="0"></div>
              </div>
              <label>Açıklama / not <span style="color:var(--muted);font-weight:400">(opsiyonel)</span></label>
              <input id="bl-note" placeholder="örn. kontrol tamamlandı, rapor arşivlendi">
              <div style="display:flex;gap:8px;margin-top:10px">
                <button class="primary" id="bl-save" style="margin:0;width:auto;padding:9px 16px">Kaydet</button>
                <button class="secondary" id="bl-cancel" style="margin:0;width:auto;padding:9px 16px">İptal</button>

            </td></tr>` : ""}

            <tr><td colspan="8" style="background:var(--surface-2)">

              ${(logsByItem[r.id] || []).length ? (logsByItem[r.id]).map(l => `
                <div class="list-item">
                  <span>${fmtDate(l.done_on)}${l.performed_by ? ` · ${esc(l.performed_by)}` : ""}${l.note ? ` — <span style="color:var(--muted)">${esc(l.note)}</span>` : ""}${l.cost != null ? ` · <span style="color:var(--muted)">${Number(l.cost).toLocaleString("tr-TR", { minimumFractionDigits: 2 })} ₺</span>` : ""}</span>

    const { error } = await sb.from("maintenance_items").insert(missingSeed.map((s, i) => ({ school_id: school.id, ...s, sort_order: base + i })));
    if (error) { alert(error.message); seedBtn.disabled = false; return; }

    const last_done_on = document.getElementById("b-last").value || null;
    const notes = document.getElementById("b-notes").value.trim() || null;

    if (!period_months || period_months < 1) { msg.innerHTML = `<div class="msg err">Periyot en az 1 ay olmalı.</div>`; return; }
    if (last_done_on && last_done_on > todayISO) { msg.innerHTML = `<div class="msg err">Son yapılma tarihi bugünden ileri olamaz.</div>`; return; }
    const payload = { school_id: school.id, name, category, period_months, responsible, contact, last_done_on, notes };
    const { error } = editItem
      ? await sb.from("maintenance_items").update(payload).eq("id", editItem.id)

  const cancelBtn = document.getElementById("b-cancel");
  if (cancelBtn) cancelBtn.onclick = () => rerender({ editingId: null });

  const printBtn = document.getElementById("b-print");
  if (printBtn) printBtn.onclick = () => window.print();

  content.querySelectorAll("[data-edit-bakim]").forEach(b => b.onclick = () => { rerender({ editingId: b.dataset.editBakim, logItemId: null, historyItemId: null }); window.scrollTo({ top: 0, behavior: "smooth" }); });

    const r = rows.find(x => x.id === b.dataset.delBakim);

    await sb.from("maintenance_items").update({ last_done_on: newLast }).eq("id", logItemId);
    await rerender({ logItemId: null, historyItemId: logItemId });
  };
  const blCancel = document.getElementById("bl-cancel");
  if (blCancel) blCancel.onclick = () => rerender({ logItemId: null });

    await sb.from("maintenance_logs").delete().eq("id", b.dataset.delLog);
    await rerender({});
  });

/* Sonraki 12 ay: hangi bakım hangi ayda bekleniyor (rolling — takvim yılına bağlı değil). */
function renderBakimPlan(rows, content, rerender) {
  const now = new Date();
  const months = Array.from({ length: 12 }, (_, i) => new Date(now.getFullYear(), now.getMonth() + i, 1));
  const key = (d) => `${d.getFullYear()}-${d.getMonth()}`;
  const colKeys = months.map(key);
  const sorted = rows.slice().sort((a, b) => (a.next || "9999").localeCompare(b.next || "9999") || a.name.localeCompare(b.name, "tr"));
  const perCol = colKeys.map(k => sorted.filter(r => r.next && key(new Date(r.next + "T00:00:00")) === k).length);
  content.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0">Sonraki 12 Ay</h3>
      <p style="color:var(--muted);font-size:12.5px">Her kalemin sonraki bakım tarihinin düştüğü ay. Gecikmiş kalemler ilk sütunda kırmızı, kayıt girilmemiş kalemler listede "—" ile görünür.</p>
      ${rows.length ? `
      <div class="table-wrap">
      <table class="data">
        <thead><tr><th>Bakım</th>${months.map((d, i) => `<th style="text-align:center">${AY_KISA[d.getMonth()]}<div style="font-weight:400;font-size:10px">${String(d.getFullYear()).slice(2)}${perCol[i] ? ` · ${perCol[i]}` : ""}</div></th>`).join("")}</tr></thead>
        <tbody>
          ${sorted.map(r => {
            const nextKey = r.next ? key(new Date(r.next + "T00:00:00")) : null;
            const overdue = r.status === "gecikti";
            return `<tr>
              <td style="white-space:nowrap"><strong>${esc(r.name)}</strong><div style="font-size:11px;color:var(--muted)">${bakimPeriodLabel(r.period_months)}${r.next ? ` · ${fmtDate(r.next)}` : " · kayıt yok"}</div></td>
              ${colKeys.map((k, i) => {
                if (overdue && i === 0) return `<td style="text-align:center;color:var(--crit);font-weight:700" title="${r.next ? fmtDate(r.next) : ""}">!</td>`;
                return `<td style="text-align:center">${nextKey === k ? `<span class="pill ${BAKIM_STATUS_PILL[r.status]}" title="${fmtDate(r.next)}">●</span>` : ""}</td>`;
              }).join("")}
            </tr>`;
          }).join("")}
        </tbody>
      </table>
      </div>` : `<p style="color:var(--muted)">Henüz bakım kalemi yok.</p>`}
    </div>
  `;
}

/* Kalıcı denetim izi: tüm tamamlanan bakımlar, kronolojik. Teftişte "ne zaman yapıldı" sorusunun cevabı. */

      ${logs.length ? `
      <div class="table-wrap">
      <table class="data">
        <thead><tr><th>Tarih</th><th>Bakım</th><th>Yapan</th><th>Açıklama</th><th>Maliyet</th><th></th></tr></thead>
        <tbody>
          ${logs.map(l => `<tr>
            <td style="white-space:nowrap">${fmtDate(l.done_on)}</td>
            <td>${esc(nameById[l.item_id] || "(silinmiş kalem)")}</td>
            <td>${esc(l.performed_by || "—")}</td>
            <td>${esc(l.note || "")}</td>
            <td style="white-space:nowrap">${l.cost != null ? Number(l.cost).toLocaleString("tr-TR", { minimumFractionDigits: 2 }) + " ₺" : "—"}</td>
            <td class="row-actions"><button data-del-log="${l.id}">Sil</button></td>
          </tr>`).join("")}
        </tbody>
      </table>
      </div>` : `<p style="color:var(--muted)">Henüz tamamlanmış bakım kaydı yok.</p>`}
    </div>
  `;
  const printBtn = document.getElementById("bg-print");
  if (printBtn) printBtn.onclick = () => window.print();
  content.querySelectorAll("[data-del-log]").forEach(b => b.onclick = async () => {
    if (!confirm("Bu bakım geçmişi kaydını silmek istediğine emin misin?")) return;
    await sb.from("maintenance_logs").delete().eq("id", b.dataset.delLog);
    await rerender({});
  });
}

/* ============ LGS KOÇLUK & TAKİP ============ */

function lgsHeader(profile, school, activeTab) {
  const tabs = [
    { id: "ogrenciler", label: "Öğrenciler" },
    { id: "dersler", label: "Dersler" },
    { id: "denemeler", label: "Denemeler" },
    { id: "analiz", label: "Zayıflık Analizi" },
    { id: "gorevler", label: "Haftalık Görevler" },
    { id: "veli", label: "Veli Bilgilendirme" },
    { id: "kayitlar", label: "Kayıt Geçmişi" },
    ...(profile.role !== "ogretmen" ? [{ id: "ozet", label: "Müdür Özeti" }] : []),
  ];
  return `
    <div class="wrap wide">
      <button class="navlink" id="back-dash">← Panele dön</button>
      <div class="eyebrow">LGS Koçluk</div>
      <h1>${esc(school.name)}</h1>
      <div class="subtabs">
        ${tabs.map(t => `<div class="subtab ${t.id === activeTab ? "active" : ""}" data-tab="${t.id}">${t.label}</div>`).join("")}
      </div>
      <div id="lgs-content"></div>
    </div>
  `;
}

async function renderLgsModule(profile, school, tab) {
  app.innerHTML = lgsHeader(profile, school, tab);
  document.getElementById("back-dash").onclick = () => renderDashboard(profile, school);
  document.querySelectorAll("[data-tab]").forEach(el => {
    el.onclick = () => renderLgsModule(profile, school, el.dataset.tab);
  });
  const content = document.getElementById("lgs-content");
  content.innerHTML = `<div class="card">Yükleniyor…</div>`;
  if (tab === "dersler") await renderLgsDersler(profile, school, content);
  else if (tab === "denemeler") await renderLgsDenemeler(profile, school, content);
  else if (tab === "analiz") await renderLgsAnaliz(profile, school, content);
  else if (tab === "gorevler") await renderLgsGorevler(profile, school, content);
  else if (tab === "veli") await renderLgsVeli(profile, school, content);
  else if (tab === "ozet") await renderLgsOzet(profile, school, content);
  else if (tab === "kayitlar") await renderLgsKayitlar(profile, school, content);
  else await renderLgsOgrenciler(profile, school, content);
}

async function renderLgsOgrenciler(profile, school, content, editingId = null) {
  const isIdareci = profile.role !== "ogretmen";
  const [{ data: students }, { data: classes }, { data: teachers }] = await Promise.all([
    sb.from("lgs_students").select("*").eq("school_id", school.id).order("full_name"),
    sb.from("classes").select("*").eq("school_id", school.id).order("sort_order"),
    sb.from("teachers").select("*").eq("school_id", school.id).in("staff_type", ["ogretmen", "yonetici"]).order("full_name"),
  ]);
  const classById = Object.fromEntries((classes || []).map(c => [c.id, c.name]));
  const teacherById = Object.fromEntries((teachers || []).map(t => [t.id, t.full_name]));
  const editStudent = editingId ? (students || []).find(s => s.id === editingId) : null;

  content.innerHTML = `
    ${(isIdareci || editStudent) ? `
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">${editStudent ? "Öğrenciyi Düzenle" : "Yeni Öğrenci Ekle"}</h3>
      <label>Ad Soyad</label>
      <input id="s-name" value="${esc(editStudent?.full_name || "")}" placeholder="Ad Soyad" ${isIdareci ? "" : "disabled"}>
      <label>Öğrenci No <span style="color:var(--muted);font-weight:400">(opsiyonel)</span></label>
      <input id="s-no" value="${esc(editStudent?.ogrenci_no || "")}" placeholder="örn. 245" ${isIdareci ? "" : "disabled"}>
      <label>Şube</label>
      <select id="s-class">
        <option value="">Seçilmedi</option>
        ${(classes || []).map(c => `<option value="${c.id}" ${editStudent?.class_id === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}
      </select>
      ${!classes?.length ? `<p style="color:var(--muted);font-size:12px;margin-top:-6px">Şube listesi boş — Ders Dağıtım Programı → Ayarlar'dan şube ekleyebilirsin, ya da boş bırak.</p>` : ""}
      ${isIdareci ? `
      <label>Koç öğretmen <span style="color:var(--muted);font-weight:400">(opsiyonel)</span></label>
      <select id="s-coach">
        <option value="">Atanmadı</option>
        ${(teachers || []).map(t => `<option value="${t.id}" ${editStudent?.coach_teacher_id === t.id ? "selected" : ""}>${esc(t.full_name)}</option>`).join("")}
      </select>
      ` : ""}
      <label>Veli adı <span style="color:var(--muted);font-weight:400">(opsiyonel)</span></label>
      <input id="s-veli-adi" value="${esc(editStudent?.veli_adi || "")}" placeholder="Ad Soyad">
      <label>Veli telefonu <span style="color:var(--muted);font-weight:400">(WhatsApp bildirimi için, opsiyonel)</span></label>
      <input id="s-veli-tel" value="${esc(editStudent?.veli_telefon || "")}" placeholder="0532 000 00 00">
      <label>Hedef puan <span style="color:var(--muted);font-weight:400">(opsiyonel — koçun kendi tahmini, sistem hesaplamıyor)</span></label>
      <input id="s-hedef-puan" type="number" step="0.01" value="${editStudent?.hedef_puan ?? ""}" placeholder="örn. 450">
      <p style="color:var(--muted);font-size:11px;margin:-6px 0 12px">Not: LGS puanı, o yılki tüm Türkiye'nin performansına göre hesaplanan göreli bir puandır (ÖSYM/MEB resmi bir "net → puan" formülü yayımlamaz) — bu yüzden sistem net'ten puan üretmiyor, sadece ham net'i takip ediyor. Hedef puanı kendi tecrübenle/yayın kaynaklarınla gir.</p>
      <label>Hedef okul <span style="color:var(--muted);font-weight:400">(opsiyonel)</span></label>
      <input id="s-hedef-okul" value="${esc(editStudent?.hedef_okul || "")}" placeholder="örn. Fen Lisesi">
      <button class="primary" id="s-save">${editStudent ? "Güncelle" : "Ekle"}</button>
      ${editStudent ? `<button class="secondary" id="s-cancel" style="margin-top:8px;width:100%">İptal</button>` : ""}
      <div id="s-msg"></div>
    </div>
    ` : ""}
    <div class="card">
      <h3 style="margin-top:0">${isIdareci ? "8. Sınıf Öğrenci Havuzu" : "Koçluk Ettiğin Öğrenciler"} (${(students || []).length})</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Ad Soyad</th><th>Şube</th>${isIdareci ? "<th>Koç</th>" : ""}<th>Hedef Puan</th><th></th></tr></thead>
          <tbody>
            ${(students || []).map(s => `
              <tr>
                <td>${esc(s.full_name)}${s.ogrenci_no ? ` <span style="color:var(--muted);font-size:11.5px">#${esc(s.ogrenci_no)}</span>` : ""}</td>
                <td>${s.class_id && classById[s.class_id] ? esc(classById[s.class_id]) : "—"}</td>
                ${isIdareci ? `<td>${s.coach_teacher_id && teacherById[s.coach_teacher_id] ? esc(teacherById[s.coach_teacher_id]) : "—"}</td>` : ""}
                <td>${s.hedef_puan ? esc(String(s.hedef_puan)) : "—"}</td>
                <td class="row-actions"><button data-edit="${s.id}">Düzenle</button>${isIdareci ? `<button data-del="${s.id}">Sil</button>` : ""}</td>
              </tr>
            `).join("") || `<tr><td colspan="${isIdareci ? 5 : 4}" style="color:var(--muted)">${isIdareci ? "Henüz öğrenci eklenmedi." : "Sana atanmış öğrenci yok — okul idaresiyle konuş."}</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
  const saveBtn = document.getElementById("s-save");
  if (saveBtn) saveBtn.onclick = async () => {
    const msg = document.getElementById("s-msg");
    const payload = {
      class_id: document.getElementById("s-class").value || null,
      veli_adi: document.getElementById("s-veli-adi").value.trim() || null,
      veli_telefon: document.getElementById("s-veli-tel").value.trim() || null,
      hedef_puan: document.getElementById("s-hedef-puan").value ? Number(document.getElementById("s-hedef-puan").value) : null,
      hedef_okul: document.getElementById("s-hedef-okul").value.trim() || null,
    };
    if (isIdareci) {
      const full_name = document.getElementById("s-name").value.trim();
      if (!full_name) { msg.innerHTML = `<div class="msg err">Ad Soyad zorunlu.</div>`; return; }
      payload.school_id = school.id;
      payload.full_name = full_name;
      payload.ogrenci_no = document.getElementById("s-no").value.trim() || null;
      payload.coach_teacher_id = document.getElementById("s-coach").value || null;
    }
    const { error } = editStudent
      ? await sb.from("lgs_students").update(payload).eq("id", editStudent.id)
      : await sb.from("lgs_students").insert({ ...payload, sort_order: (students || []).length });
    if (error) { msg.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
    await renderLgsOgrenciler(profile, school, content);
  };
  const cancelBtn = document.getElementById("s-cancel");
  if (cancelBtn) cancelBtn.onclick = () => renderLgsOgrenciler(profile, school, content);
  content.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => renderLgsOgrenciler(profile, school, content, b.dataset.edit));
  content.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    await sb.from("lgs_students").delete().eq("id", b.dataset.del);
    await renderLgsOgrenciler(profile, school, content);
  });
}

async function renderLgsDersler(profile, school, content, activeSubjectId = null) {
  const { data: subjects } = await sb.from("lgs_subjects").select("*").eq("school_id", school.id).order("sort_order");
  const STANDARD_LGS_SUBJECTS = [
    { name: "Türkçe", question_count: 20 },
    { name: "Matematik", question_count: 20 },
    { name: "Fen Bilimleri", question_count: 20 },
    { name: "T.C. İnkılap Tarihi ve Atatürkçülük", question_count: 10 },
    { name: "Din Kültürü ve Ahlak Bilgisi", question_count: 10 },
    { name: "İngilizce", question_count: 10 },
  ];
  const isIdareci = profile.role !== "ogretmen";
  content.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0">LGS Dersleri</h3>
      <p style="color:var(--muted);font-size:12.5px;margin-bottom:12px">Deneme sonuçları bu derslere göre girilir. Soru sayısı, zayıflık analizinde dersin ağırlığını belirler — MEB'in güncel LGS formatı değişirse buradan elle düzeltilebilir.</p>
      ${isIdareci && !subjects?.length ? `<button class="secondary" id="seed-subjects" style="width:100%;margin-bottom:12px">Standart LGS derslerini ekle (Türkçe 20 · Matematik 20 · Fen 20 · İnkılap 10 · Din Kültürü 10 · İngilizce 10)</button>` : ""}
      <div id="subj-list">
        ${(subjects || []).map(s => `<div class="list-item"><span>${esc(s.name)} <span style="color:var(--muted)">(${s.question_count} soru)</span></span>${isIdareci ? `<div class="row-actions"><button data-del-subj="${s.id}">Sil</button></div>` : ""}</div>`).join("") || `<p style="color:var(--muted);font-size:13px">Henüz ders eklenmedi.</p>`}
      </div>
      ${isIdareci ? `
      <label>Yeni ders</label>
      <input id="new-subj-name" placeholder="örn. Sosyal Bilgiler">
      <label>Soru sayısı</label>
      <input id="new-subj-count" type="number" min="1" value="10">
      <button class="secondary" id="add-subj" style="margin-top:10px;width:100%">Ekle</button>
      <div id="subj-msg"></div>
      ` : ""}
    </div>
    ${subjects?.length ? `
    <div class="card" style="margin-top:16px">
      <h3 style="margin-top:0">Konular</h3>
      <p style="color:var(--muted);font-size:12.5px;margin-bottom:12px">Deneme sonucunda yanlış çıkan soruları belirli bir konuya bağlamak istersen, önce o dersin konularını burada tanımla — opsiyoneldir, tanımlamazsan sistem ders bazlı çalışmaya devam eder.</p>
      <label>Ders</label>
      <select id="topic-subj-select">
        ${subjects.map(s => `<option value="${s.id}" ${activeSubjectId === s.id || (!activeSubjectId && s === subjects[0]) ? "selected" : ""}>${esc(s.name)}</option>`).join("")}
      </select>
      <div id="topic-list-wrap"></div>
    </div>
    ` : ""}
  `;
  const topicSelect = document.getElementById("topic-subj-select");
  if (topicSelect) {
    const selectedSubject = subjects.find(s => s.id === topicSelect.value);
    topicSelect.onchange = () => renderLgsDersler(profile, school, content, topicSelect.value);
    await renderLgsTopicList(profile, school, document.getElementById("topic-list-wrap"), topicSelect.value, selectedSubject?.name, () => renderLgsDersler(profile, school, content, topicSelect.value));
  }
  if (!isIdareci) return;
  const seedBtn = document.getElementById("seed-subjects");
  if (seedBtn) seedBtn.onclick = async () => {
    await sb.from("lgs_subjects").insert(STANDARD_LGS_SUBJECTS.map((s, i) => ({ school_id: school.id, name: s.name, question_count: s.question_count, sort_order: i })));
    await renderLgsDersler(profile, school, content);
  };
  document.getElementById("add-subj").onclick = async () => {
    const name = document.getElementById("new-subj-name").value.trim();
    const count = Number(document.getElementById("new-subj-count").value);
    const msg = document.getElementById("subj-msg");
    if (!name || !count || count < 1) { msg.innerHTML = `<div class="msg err">Ders adı ve geçerli soru sayısı gerekli.</div>`; return; }
    await sb.from("lgs_subjects").insert({ school_id: school.id, name, question_count: count, sort_order: (subjects || []).length });
    await renderLgsDersler(profile, school, content);
  };
  content.querySelectorAll("[data-del-subj]").forEach(b => b.onclick = async () => {
    await sb.from("lgs_subjects").delete().eq("id", b.dataset.delSubj);
    await renderLgsDersler(profile, school, content);
  });
}

async function renderLgsTopicList(profile, school, el, subjectId, subjectName, onChange) {
  const isIdareci = profile.role !== "ogretmen";
  const { data: topics } = await sb.from("lgs_topics").select("*").eq("lgs_subject_id", subjectId).order("sort_order");
  const standardTopics = LGS_STANDARD_TOPICS[subjectName];
  el.innerHTML = `
    <div style="margin-top:10px">
      ${isIdareci && !topics?.length && standardTopics ? `<button class="secondary" id="seed-topics" style="width:100%;margin-bottom:12px">MEB müfredatındaki ${esc(subjectName)} konularını ekle (${standardTopics.length} konu)</button>` : ""}
      ${(topics || []).map(t => `<div class="list-item"><span>${esc(t.name)}</span>${isIdareci ? `<div class="row-actions"><button data-del-topic="${t.id}">Sil</button></div>` : ""}</div>`).join("") || `<p style="color:var(--muted);font-size:13px">Bu ders için henüz konu eklenmedi.</p>`}
      ${isIdareci ? `
      <label>Yeni konu</label>
      <input id="new-topic-name" placeholder="örn. Kesirler">
      <button class="secondary" id="add-topic" style="margin-top:10px;width:100%">Ekle</button>
      <div id="topic-msg"></div>
      ` : ""}
    </div>
  `;
  if (!isIdareci) return;
  const seedTopicsBtn = document.getElementById("seed-topics");
  if (seedTopicsBtn) seedTopicsBtn.onclick = async () => {
    await sb.from("lgs_topics").insert(standardTopics.map((name, i) => ({ school_id: school.id, lgs_subject_id: subjectId, name, sort_order: i })));
    await onChange();
  };
  document.getElementById("add-topic").onclick = async () => {
    const name = document.getElementById("new-topic-name").value.trim();
    const msg = document.getElementById("topic-msg");
    if (!name) { msg.innerHTML = `<div class="msg err">Konu adı gerekli.</div>`; return; }
    await sb.from("lgs_topics").insert({ school_id: school.id, lgs_subject_id: subjectId, name, sort_order: (topics || []).length });
    await onChange();
  };
  el.querySelectorAll("[data-del-topic]").forEach(b => b.onclick = async () => {
    await sb.from("lgs_topics").delete().eq("id", b.dataset.delTopic);
    await onChange();
  });

  const { data: exams } = await sb.from("lgs_mock_exams").select("*").eq("school_id", school.id).order("exam_date", { ascending: false });
  const activeExam = activeExamId ? (exams || []).find(e => e.id === activeExamId) : null;
  const isIdareci = profile.role !== "ogretmen";
  content.innerHTML = `
    ${isIdareci ? `
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">Yeni Deneme</h3>
      <label>Başlık</label>
      <input id="e-title" placeholder="örn. 3. Deneme - Ekim">
      <label>Tarih</label>
      ${dateInputHtml("e-date", "")}
      <label>Kaynak <span style="color:var(--muted);font-weight:400">(opsiyonel, sadece etiket — içerik entegrasyonu değil)</span></label>
      <input id="e-kaynak" placeholder="örn. Okul içi">
      <button class="secondary" id="e-save" style="width:100%">Ekle</button>
      <div id="e-msg"></div>
    </div>
    ` : ""}
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">Denemeler (${(exams || []).length})</h3>
      <div id="exam-list">
        ${(exams || []).map(e => `
          <div class="list-item" style="cursor:pointer" data-open-exam="${e.id}">
            <span>${esc(e.title)}${e.exam_date ? ` <span style="color:var(--muted)">· ${esc(e.exam_date)}</span>` : ""}</span>
            ${isIdareci ? `<div class="row-actions"><button data-del-exam="${e.id}">Sil</button></div>` : ""}
          </div>
        `).join("") || `<p style="color:var(--muted);font-size:13px">Henüz deneme eklenmedi.</p>`}
      </div>
    </div>
    <div id="exam-detail"></div>
  `;
  wireDate3("e-date");
  const eSaveBtn = document.getElementById("e-save");
  if (eSaveBtn) eSaveBtn.onclick = async () => {
    const title = document.getElementById("e-title").value.trim();
    const msg = document.getElementById("e-msg");
    if (!title) { msg.innerHTML = `<div class="msg err">Başlık zorunlu.</div>`; return; }
    const { data: newExam, error } = await sb.from("lgs_mock_exams").insert({
      school_id: school.id, title,
      exam_date: document.getElementById("e-date").value || null,
      kaynak: document.getElementById("e-kaynak").value.trim() || null,
      sort_order: (exams || []).length,
    }).select().single();
    if (error) { msg.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
    await renderLgsDenemeler(profile, school, content, newExam.id);
  };
  content.querySelectorAll("[data-open-exam]").forEach(el => el.onclick = () => renderLgsDenemeler(profile, school, content, el.dataset.openExam));
  content.querySelectorAll("[data-del-exam]").forEach(b => b.onclick = async (ev) => {
    ev.stopPropagation();
    await sb.from("lgs_mock_exams").delete().eq("id", b.dataset.delExam);
    await renderLgsDenemeler(profile, school, content);
  });
  if (activeExam) {
    const detailEl = document.getElementById("exam-detail");
    await renderLgsDenemeDetay(profile, school, detailEl, activeExam);
  }
}

async function renderLgsDenemeDetay(profile, school, el, exam, editStudentId = null) {
  const [{ data: students }, { data: subjects }, { data: results }, { data: topics }, { data: topicErrors }] = await Promise.all([
    sb.from("lgs_students").select("*").eq("school_id", school.id).order("full_name"),
    sb.from("lgs_subjects").select("*").eq("school_id", school.id).order("sort_order"),
    sb.from("lgs_mock_exam_results").select("*").eq("mock_exam_id", exam.id),
    sb.from("lgs_topics").select("*").eq("school_id", school.id).order("sort_order"),
    sb.from("lgs_topic_errors").select("*").eq("mock_exam_id", exam.id),
  ]);

    const rows = [];

function computeLgsWeakness(subjects, examsById, resultsForStudent) {
  const totalQ = subjects.reduce((a, s) => a + s.question_count, 0);
  const bySubject = {};
  subjects.forEach(s => bySubject[s.id] = []);
  resultsForStudent.forEach(r => {
    const exam = examsById[r.mock_exam_id];
    const subject = subjects.find(s => s.id === r.lgs_subject_id);
    if (!exam || !subject) return;
    bySubject[subject.id].push({
      date: exam.exam_date || exam.created_at,
      net: r.correct_count - r.wrong_count / 4,
      q: subject.question_count,
    });
  });
  return subjects.map(s => {
    const arr = (bySubject[s.id] || []).slice().sort((a, b) => new Date(b.date) - new Date(a.date));
    if (!arr.length) return { subject: s, hasData: false };
    const weights = arr.map((_, i) => 1 / (i + 1));
    const wsum = weights.reduce((a, b) => a + b, 0);
    const perf = arr.reduce((acc, r, i) => acc + (weights[i] / wsum) * Math.max(0, r.net / r.q), 0);
    const importance = s.question_count / totalQ;
    return { subject: s, hasData: true, perf, weaknessScore: importance * (1 - perf), examCount: arr.length, lastNet: arr[0].net };
  }).filter(r => r.hasData).sort((a, b) => b.weaknessScore - a.weaknessScore);
}

const LGS_CHART_PALETTE = ["#1f6b65", "#a5690a", "#b3402c", "#4a7fc4", "#8b5fbf", "#c4574a", "#3f9142", "#c48a2f"];

function lgsChartColor(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#888";
}

function lgsChart(canvasId, config) {
  if (!window.__lgsCharts) window.__lgsCharts = {};
  if (window.__lgsCharts[canvasId]) window.__lgsCharts[canvasId].destroy();
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  window.__lgsCharts[canvasId] = new Chart(ctx, config);
}

function computeLgsTopicWeakness(topics, examsById, topicErrorsForStudent) {
  const byTopic = {};
  topics.forEach(t => byTopic[t.id] = []);
  topicErrorsForStudent.forEach(te => {
    const exam = examsById[te.mock_exam_id];
    if (!exam || !byTopic[te.lgs_topic_id]) return;
    byTopic[te.lgs_topic_id].push({ date: exam.exam_date || exam.created_at, count: te.error_count });
  });
  return topics.map(t => {
    const arr = (byTopic[t.id] || []).slice().sort((a, b) => new Date(b.date) - new Date(a.date));
    if (!arr.length) return { topic: t, hasData: false };
    const weights = arr.map((_, i) => 1 / (i + 1));
    const wsum = weights.reduce((a, b) => a + b, 0);
    const score = arr.reduce((acc, r, i) => acc + (weights[i] / wsum) * r.count, 0);
    return { topic: t, hasData: true, score, totalErrors: arr.reduce((a, b) => a + b.count, 0) };
  }).filter(r => r.hasData).sort((a, b) => b.score - a.score);
}

function lgsStudentTrendData(subjects, examsById, resultsForStudent) {
  const examIds = [...new Set(resultsForStudent.map(r => r.mock_exam_id))];
  const examsSorted = examIds.map(id => examsById[id]).filter(Boolean)
    .sort((a, b) => new Date(a.exam_date || a.created_at) - new Date(b.exam_date || b.created_at));
  const byExamSubject = {};
  resultsForStudent.forEach(r => { (byExamSubject[r.mock_exam_id] ??= {})[r.lgs_subject_id] = r; });
  return {
    labels: examsSorted.map(e => e.title),
    datasets: subjects.map((s, i) => ({
      label: s.name,
      data: examsSorted.map(e => {
        const r = byExamSubject[e.id]?.[s.id];
        return r ? +(r.correct_count - r.wrong_count / 4).toFixed(2) : null;
      }),
      borderColor: LGS_CHART_PALETTE[i % LGS_CHART_PALETTE.length],
      backgroundColor: LGS_CHART_PALETTE[i % LGS_CHART_PALETTE.length],
      spanGaps: true,
      tension: 0.25,
    })),
  };
}

async function renderLgsAnaliz(profile, school, content, chartStudentId = null) {

    sb.from("lgs_students").select("*").eq("school_id", school.id).order("full_name"),

    sb.from("lgs_mock_exam_results").select("*").eq("school_id", school.id),
    sb.from("lgs_topics").select("*").eq("school_id", school.id).order("sort_order"),

    .map(s => ({ student: s, rows: computeLgsWeakness(subjects, examsById, resultsByStudent[s.id] || []) }))
    .filter(x => x.rows.length);

  const perStudentTopics = students
    .map(s => ({ student: s, rows: computeLgsTopicWeakness(topics || [], examsById, topicErrorsByStudent[s.id] || []) }))

    .sort((a, b) => b.avg - a.avg);

      <div style="height:220px;margin-bottom:14px"><canvas id="lgs-school-chart"></canvas></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Ders</th><th>Veri olan öğrenci</th><th>Öncelik skoru</th></tr></thead>
          <tbody>
            ${schoolRows.map(r => `<tr><td>${esc(r.subject.name)}</td><td>${r.n}/${students.length}</td><td>${(r.avg * 100).toFixed(0)}</td></tr>`).join("") || `<tr><td colspan="3" style="color:var(--muted)">Henüz veri yok.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">Öğrenci Bazlı Öncelikler</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Öğrenci</th><th>Öncelikli çalışması gereken dersler</th></tr></thead>
          <tbody>
            ${perStudent.map(({ student, rows }) => `
              <tr>
                <td>${esc(student.full_name)}</td>
                <td>${rows.slice(0, 3).map(r => `${esc(r.subject.name)} <span style="color:var(--muted);font-size:11px">(son net ${r.lastNet.toFixed(1)})</span>`).join(", ")}</td>
              </tr>
            `).join("") || `<tr><td colspan="2" style="color:var(--muted)">Henüz veri yok.</td></tr>`}
          </tbody>
        </table>
      </div>

      <div class="table-wrap">

    </div>
  `;

  lgsChart("lgs-school-chart", {
    type: "bar",
    data: {
      labels: schoolRows.map(r => r.subject.name),
      datasets: [{ label: "Öncelik skoru", data: schoolRows.map(r => +(r.avg * 100).toFixed(1)), backgroundColor: lgsChartColor("--accent") }],

        interaction: { mode: "index", intersect: false },
        plugins: { legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 11 } } } },

function mondayOfWeek(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  date.setDate(date.getDate() + diff);
  return date.toISOString().slice(0, 10);
}

function lgsVeliMessage(school, student, subjects, examsById, resultsForStudent, tasksForStudent) {
  const netOf = r => r.correct_count - r.wrong_count / 4;
  let latestNetLabel = "Henüz deneme sonucu yok";
  let latestExamLine = "";
  if (resultsForStudent.length) {
    const examIds = [...new Set(resultsForStudent.map(r => r.mock_exam_id))];
    const sortedExams = examIds.map(id => examsById[id]).filter(Boolean)
      .sort((a, b) => new Date(b.exam_date || b.created_at) - new Date(a.exam_date || a.created_at));
    const latestExam = sortedExams[0];
    if (latestExam) {
      const totalNet = resultsForStudent.filter(r => r.mock_exam_id === latestExam.id).reduce((sum, r) => sum + netOf(r), 0);
      latestNetLabel = `${latestExam.title}: ${totalNet.toFixed(2)} net`;
      latestExamLine = `📊 Son deneme (${latestExam.title}): ${totalNet.toFixed(2)} net`;
    }
  }

  const weakness = subjects.length ? computeLgsWeakness(subjects, examsById, resultsForStudent) : [];
  const weaknessLine = weakness.length
    ? `🎯 Öncelikli çalışması gereken dersler: ${weakness.slice(0, 2).map(w => w.subject.name).join(", ")}`
    : "";

  const counts = { bekliyor: 0, yapildi: 0, onaylandi: 0 };
  tasksForStudent.forEach(t => { if (counts[t.status] !== undefined) counts[t.status]++; });
  const totalTasks = tasksForStudent.length;
  const taskLabel = totalTasks ? `${counts.onaylandi}/${totalTasks} onaylandı` : "Görev yok";
  const taskLine = totalTasks
    ? `📝 Bu dönemki görevler: ${counts.onaylandi} onaylandı, ${counts.yapildi} kontrol bekliyor, ${counts.bekliyor} henüz başlanmadı`
    : "";

  const lines = [
    `Merhaba${student.veli_adi ? " " + student.veli_adi : ""}, ${student.full_name} için LGS koçluk güncellemesi:`,
    "",
    latestExamLine,
    weaknessLine,
    taskLine,
  ].filter(Boolean);
  lines.push("", "İyi çalışmalar dileriz.", school.name);

  return { text: lines.join("\n"), latestNetLabel, taskLabel };
}

async function renderLgsOzet(profile, school, content) {
  if (profile.role === "ogretmen") {
    content.innerHTML = `<div class="card"><p style="color:var(--muted)">Bu özet sadece okul idaresi içindir.</p></div>`;
    return;
  }
  const [{ data: students }, { data: teachers }, { data: results }, { data: tasks }, { data: exams }] = await Promise.all([
    sb.from("lgs_students").select("*").eq("school_id", school.id),
    sb.from("teachers").select("*").eq("school_id", school.id).in("staff_type", ["ogretmen", "yonetici"]),
    sb.from("lgs_mock_exam_results").select("*").eq("school_id", school.id),
    sb.from("lgs_study_tasks").select("*").eq("school_id", school.id),
    sb.from("lgs_mock_exams").select("*").eq("school_id", school.id),
  ]);
  if (!students?.length) {
    content.innerHTML = `<div class="card"><p style="color:var(--muted)">Önce <strong>Öğrenciler</strong> sekmesinden öğrenci ekle.</p></div>`;
    return;
  }
  const teacherById = Object.fromEntries((teachers || []).map(t => [t.id, t]));
  const examsById = Object.fromEntries((exams || []).map(e => [e.id, e]));
  const resultsByStudent = {};
  (results || []).forEach(r => (resultsByStudent[r.student_id] ??= []).push(r));
  const tasksByStudent = {};
  (tasks || []).forEach(t => (tasksByStudent[t.student_id] ??= []).push(t));

  const flagged = students.map(s => {
    const flags = [];
    if (!s.coach_teacher_id) flags.push("Koç atanmamış");
    const myResults = resultsByStudent[s.id] || [];
    if (!myResults.length) flags.push("Hiç deneme sonucu yok");
    if (!s.veli_telefon) flags.push("Veli telefonu yok");
    if (myResults.length) {
      const examIds = [...new Set(myResults.map(r => r.mock_exam_id))];
      const dates = examIds.map(id => examsById[id]?.exam_date || examsById[id]?.created_at).filter(Boolean).map(d => new Date(d));
      if (dates.length) {
        const latest = new Date(Math.max(...dates));
        const daysSince = Math.floor((Date.now() - latest) / 86400000);
        if (daysSince > 21) flags.push(`Son deneme ${daysSince} gün önce`);
      }
    }
    return { student: s, flags };
  }).filter(x => x.flags.length);

  const noCoachCount = students.filter(s => !s.coach_teacher_id).length;
  const noResultCount = students.filter(s => !(resultsByStudent[s.id] || []).length).length;
  const noPhoneCount = students.filter(s => !s.veli_telefon).length;
  const totalBekliyor = (tasks || []).filter(t => t.status === "bekliyor").length;
  const totalYapildi = (tasks || []).filter(t => t.status === "yapildi").length;

  const coachIds = [...new Set(students.map(s => s.coach_teacher_id).filter(Boolean))];
  const coachRows = coachIds.map(tid => {
    const t = teacherById[tid];
    const myStudents = students.filter(s => s.coach_teacher_id === tid);
    const myStudentIds = new Set(myStudents.map(s => s.id));
    const myTasks = (tasks || []).filter(tk => myStudentIds.has(tk.student_id));
    return {
      name: t?.full_name || "Bilinmeyen",
      hasAccount: !!t?.user_id,
      studentCount: myStudents.length,
      bekliyor: myTasks.filter(tk => tk.status === "bekliyor").length,
    };
  }).sort((a, b) => b.studentCount - a.studentCount);

  content.innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">Okul Özeti</h3>
      <div class="list-item"><span>Toplam öğrenci</span><strong>${students.length}</strong></div>
      <div class="list-item"><span>Koçsuz öğrenci</span><strong>${noCoachCount}</strong></div>
      <div class="list-item"><span>Hiç deneme sonucu olmayan öğrenci</span><strong>${noResultCount}</strong></div>
      <div class="list-item"><span>Veli telefonu eksik öğrenci</span><strong>${noPhoneCount}</strong></div>
      <div class="list-item"><span>Bekleyen görev (okul geneli)</span><strong>${totalBekliyor}</strong></div>
      <div class="list-item"><span>Koç onayı bekleyen görev</span><strong>${totalYapildi}</strong></div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">Dikkat Gerektiren Öğrenciler (${flagged.length})</h3>
      ${flagged.length ? `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Öğrenci</th><th>Uyarılar</th></tr></thead>
          <tbody>
            ${flagged.map(f => `<tr><td>${esc(f.student.full_name)}</td><td>${f.flags.map(fl => `<span class="pill warn">${esc(fl)}</span>`).join(" ")}</td></tr>`).join("")}
          </tbody>
        </table>
      </div>
      ` : `<p style="color:var(--muted);font-size:13px">Tüm öğrenciler kapsam altında — dikkat gerektiren bir durum yok.</p>`}
    </div>
    <div class="card">
      <h3 style="margin-top:0">Koç Yükü</h3>
      ${coachRows.length ? `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Koç</th><th>Öğrenci</th><th>Panel Hesabı</th><th>Bekleyen Görev</th></tr></thead>
          <tbody>
            ${coachRows.map(c => `<tr><td>${esc(c.name)}</td><td>${c.studentCount}</td><td>${c.hasAccount ? "✅ Bağlı" : "— bağlanmadı"}</td><td>${c.bekliyor}</td></tr>`).join("")}
          </tbody>
        </table>
      </div>
      ` : `<p style="color:var(--muted);font-size:13px">Henüz kimseye öğrenci koç olarak atanmadı.</p>`}
    </div>
  `;
}

function fmtDateTime(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleString("tr-TR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
}

function describeLgsAuditEntry(entry, lookups) {
  const actor = esc(entry.actor_name || "Bilinmeyen kullanıcı");
  const d = entry.new_data || entry.old_data || {};

  if (entry.table_name === "lgs_students") {
    const sName = esc(d.full_name || "silinmiş öğrenci");
    if (entry.action === "insert") return `${actor} — ${sName} öğrencisini ekledi`;
    if (entry.action === "delete") return `${actor} — ${sName} öğrencisini sildi`;
    const fields = { full_name: "ad", class_id: "şube", coach_teacher_id: "koç", veli_telefon: "veli telefonu", veli_adi: "veli adı", hedef_puan: "hedef puan", hedef_okul: "hedef okul" };
    const changed = Object.entries(fields)
      .filter(([k]) => JSON.stringify(entry.old_data?.[k]) !== JSON.stringify(entry.new_data?.[k]))
      .map(([, label]) => label);
    return `${actor} — ${sName} kaydını güncelledi${changed.length ? ` (${esc(changed.join(", "))})` : ""}`;
  }

  const sName = esc(lookups.studentName(d.student_id) || "silinmiş öğrenci");

  if (entry.table_name === "lgs_mock_exam_results") {
    const subj = esc(lookups.subjectName(d.lgs_subject_id) || "ders");
    if (entry.action === "insert") return `${actor} — ${sName} için ${subj} sonucu girdi (${d.correct_count} doğru, ${d.wrong_count} yanlış, ${d.blank_count} boş)`;
    if (entry.action === "delete") return `${actor} — ${sName} için ${subj} sonucunu sildi`;
    const o = entry.old_data || {}, n = entry.new_data || {};
    const diffs = [];
    if (o.correct_count !== n.correct_count) diffs.push(`doğru ${o.correct_count}→${n.correct_count}`);
    if (o.wrong_count !== n.wrong_count) diffs.push(`yanlış ${o.wrong_count}→${n.wrong_count}`);
    if (o.blank_count !== n.blank_count) diffs.push(`boş ${o.blank_count}→${n.blank_count}`);
    return `${actor} — ${sName} · ${subj} sonucunu güncelledi${diffs.length ? ` (${esc(diffs.join(", "))})` : ""}`;
  }

  if (entry.table_name === "lgs_topic_errors") {
    const subj = esc(lookups.subjectName(d.lgs_subject_id) || "ders");
    const topic = esc(lookups.topicName(d.lgs_topic_id) || "konu");
    if (entry.action === "delete") return `${actor} — ${sName} için ${subj} / ${topic} hata kaydını sildi`;
    return `${actor} — ${sName} için ${subj} / ${topic} hata sayısını ${d.error_count} olarak ${entry.action === "insert" ? "kaydetti" : "güncelledi"}`;
  }

  return `${actor} — bir kayıt ${entry.action === "insert" ? "eklendi" : entry.action === "delete" ? "silindi" : "güncellendi"}`;
}

function sendPanoCommand(token, cmd) {
  const ch = sb.channel(`pano-control-${token}`);
  ch.subscribe((status) => {
    if (status === "SUBSCRIBED") {
      ch.send({ type: "broadcast", event: "command", payload: cmd });
      setTimeout(() => sb.removeChannel(ch), 1500);
    }
  });
}

  const wrap = document.getElementById("pano-preview-wrap");

  if (!path) return null;
  return sb.storage.from("pano-media").getPublicUrl(path).data.publicUrl;
}

async function panoUploadFile(school, file, kindHint) {
  const maxBytes = (kindHint === "upload_video" ? 100 : 10) * 1024 * 1024;
  if (file.size > maxBytes) {
    throw new Error(`Dosya çok büyük (en fazla ${kindHint === "upload_video" ? "100MB" : "10MB"}).`);
  }
  const ext = (file.name.split(".").pop() || "bin").toLowerCase();
  const path = `${school.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error } = await sb.storage.from("pano-media").upload(path, file);
  if (error) throw error;
  return path;
}
