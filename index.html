  for (let r = 0; r < exam.rows; r++) {
    grid.push(exam.seating.filter(s => s.row === r).sort((a, b) => a.col - b.col));
  }
  return `
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">${esc(exam.name)}</h3>
      <p style="color:var(--muted);font-size:12.5px;margin-top:-6px">${exam.seating.length} öğrenci yerleşti${exam.date ? ` · ${fmtDate(exam.date)}` : ""}${exam.rows * exam.cols > exam.seating.length ? ` · ${exam.rows * exam.cols - exam.seating.length} sıra boş` : ""}</p>
      ${exam.oversizedGroups?.length ? `<div class="msg err">⚠️ Matematiksel olarak imkansız: ${exam.oversizedGroups.map(g => `"${esc(g.label)}" (${g.count} öğrenci)`).join(", ")} bu sıra/sütun boyutunda (çapraz komşuluk dahil) en fazla ${exam.maxIsolatedGroupSize} öğrenciye kadar hiç bitişiksiz ayrılabilir. Sıra/sütun sayısını artır ya da bu grubu ayrı bir oturuma böl.</div>` : ""}
      ${exam.remainingViolations > 0 ? `<div class="msg err">⚠️ ${exam.remainingViolations} yerde aynı gruptan öğrenciler bitişik kalmak zorunda kaldı${exam.oversizedGroups?.length ? "" : " — grup boyutları arasındaki dengesizlik nedeniyle tam kelebek düzeni mümkün olmadı. Sıra/sütun sayısını artırmak yardımcı olabilir."}</div>` : `<div class="msg ok">Hiçbir aynı-grup öğrenci bitişik değil (yatay/dikey/çapraz).</div>`}
      <div class="table-wrap" style="margin-top:14px">
        <table class="data">
          <tbody>
            ${grid.map(row => `
              <tr>
                ${row.map(s => `<td style="text-align:center">${esc(s.name)}<div style="font-size:10.5px;color:var(--muted)">${esc(s.label)}</div></td>`).join("")}
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="secondary" id="k-print" style="flex:1">Yazdır</button>
        <button class="secondary" id="k-download" style="flex:1">Word olarak indir</button>
      </div>
      <iframe id="k-frame" style="display:none"></iframe>
    </div>
  `;
}

async function renderKelebek(school, content, draftGroups = null, lastExam = null) {
  const data = loadKelebek(school);
  if (!draftGroups) draftGroups = [{ label: "", text: "" }, { label: "", text: "" }];

  function readDraftFromDom() {
    const labels = [...content.querySelectorAll(".k-group-label")];
    const texts = [...content.querySelectorAll(".k-group-text")];
    return labels.map((el, i) => ({ label: el.value, text: texts[i].value }));
  }

  content.innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">Yeni Sınav Oturma Planı</h3>
      <label>Sınav adı</label>
      <input id="k-name" placeholder="örn. 1. Dönem Ortak Sınavı">
      <label>Tarih <span style="color:var(--muted);font-weight:400">(opsiyonel)</span></label>
      ${dateInputHtml("k-date", "")}
      <div style="display:flex;gap:12px">
        <div style="flex:1"><label>Sıra sayısı</label><input id="k-rows" type="number" min="1" value="6"></div>
        <div style="flex:1"><label>Sütun sayısı</label><input id="k-cols" type="number" min="1" value="6"></div>
      </div>
      <label style="margin-top:14px;display:block">Sınıf grupları <span style="color:var(--muted);font-weight:400">(her grup ayrı bir sınıf/şube — aynı gruptakiler yan yana/art arda oturmaz)</span></label>
      <div id="k-groups">
        ${draftGroups.map((g, i) => `
          <div class="card" style="margin:10px 0;background:var(--surface-2)">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <label style="margin:0">Grup ${i + 1}</label>
              ${draftGroups.length > 1 ? `<button class="secondary" data-remove-group="${i}" style="width:auto;padding:4px 10px;font-size:12px;margin:0">Kaldır</button>` : ""}
            </div>
            <input class="k-group-label" data-idx="${i}" value="${esc(g.label)}" placeholder="örn. 8-A">
            <label style="font-size:12px">Öğrenci listesi <span style="color:var(--muted);font-weight:400">(her satıra bir isim)</span></label>
            <textarea class="k-group-text" data-idx="${i}" rows="4" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-family:inherit;font-size:14px">${esc(g.text)}</textarea>
          </div>
        `).join("")}
      </div>
      <button class="secondary" id="k-add-group" style="margin-top:8px;width:100%">+ Grup Ekle</button>
      <button class="primary" id="k-generate" style="margin-top:14px">Oturma Planını Oluştur</button>
      <div id="k-msg"></div>
    </div>
    ${lastExam ? renderSeatingResult(school, lastExam) : ""}
    ${data.exams.length ? `
      <div class="card">
        <h3 style="margin-top:0">Kayıtlı Sınavlar</h3>
        ${data.exams.slice().sort((a, b) => (b.date || "").localeCompare(a.date || "")).map(e => `
          <div class="list-item">
            <span>${esc(e.name)}${e.date ? ` · ${fmtDate(e.date)}` : ""}</span>
            <div class="row-actions">
              <button data-view-exam="${e.id}">Görüntüle</button>
              <button data-del-exam="${e.id}">Sil</button>
            </div>
          </div>
        `).join("")}
      </div>
    ` : ""}
  `;

  document.getElementById("k-add-group").onclick = () => {
    const current = readDraftFromDom();
    current.push({ label: "", text: "" });
    renderKelebek(school, content, current, lastExam);
  };
  content.querySelectorAll("[data-remove-group]").forEach(b => b.onclick = () => {
    const current = readDraftFromDom();
    current.splice(parseInt(b.dataset.removeGroup), 1);
    renderKelebek(school, content, current.length ? current : [{ label: "", text: "" }], lastExam);
  });

  wireDate3("k-date");
  document.getElementById("k-generate").onclick = () => {
    const name = document.getElementById("k-name").value.trim();
    const date = document.getElementById("k-date").value;
    const rows = parseInt(document.getElementById("k-rows").value) || 0;
    const cols = parseInt(document.getElementById("k-cols").value) || 0;
    const msg = document.getElementById("k-msg");
    const rawGroups = readDraftFromDom()
      .map(g => ({ label: g.label.trim(), students: splitLines(g.text) }))
      .filter(g => g.label && g.students.length);
    if (!name) { msg.innerHTML = `<div class="msg err">Sınav adı gerekli.</div>`; return; }
    if (!rows || !cols) { msg.innerHTML = `<div class="msg err">Sıra ve sütun sayısı gerekli.</div>`; return; }
    if (rawGroups.length < 2) { msg.innerHTML = `<div class="msg err">En az 2 sınıf grubu ve öğrenci listesi gerekli (kelebek düzeni için).</div>`; return; }
    let result;
    try {
      result = generateKelebekSeating(rawGroups, rows, cols);
    } catch (e) {
      msg.innerHTML = `<div class="msg err">${esc(e.message)}</div>`;
      return;
    }
    const exam = {
      id: uid(), name, date, rows, cols, seating: result.seating,
      remainingViolations: result.violations.length,
      oversizedGroups: result.oversizedGroups.map(g => ({ label: g.label, count: g.students.length })),
      maxIsolatedGroupSize: result.maxIsolatedGroupSize,
      createdAt: new Date().toISOString(),
    };
    data.exams.push(exam);
    if (!saveKelebek(school, data)) { msg.innerHTML = localStorageSaveErrHtml(); return; }
    renderKelebek(school, content, null, exam);
  };

  content.querySelectorAll("[data-view-exam]").forEach(b => b.onclick = () => {
    const exam = data.exams.find(e => e.id === b.dataset.viewExam);
    renderKelebek(school, content, null, exam);
  });
  content.querySelectorAll("[data-del-exam]").forEach(b => b.onclick = () => {
    if (!confirm("Bu sınav oturma planını silmek istediğine emin misin?")) return;
    data.exams = data.exams.filter(e => e.id !== b.dataset.delExam);
    saveKelebek(school, data);
    renderKelebek(school, content, draftGroups, null);
  });

  if (lastExam) {
    const fullHtml = kelebekDocHtml(school, lastExam);
    const frame = document.getElementById("k-frame");
    document.getElementById("k-print").onclick = () => {
      frame.srcdoc = fullHtml;
      frame.onload = () => { frame.contentWindow.focus(); frame.contentWindow.print(); };
    };
    document.getElementById("k-download").onclick = () => {
      const blob = new Blob(["﻿", fullHtml], { type: "application/msword" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${lastExam.name}.doc`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    };
  }
}

/* ============ TALEP TAKİBİ ============ */

const TALEP_STATUS_LABELS = { bekliyor: "Bekliyor", islemde: "İşlemde", tamamlandi: "Tamamlandı", reddedildi: "Reddedildi" };
const TALEP_STATUS_ORDER = ["bekliyor", "islemde", "tamamlandi", "reddedildi"];

async function renderTalepModule(profile, school) {
  app.innerHTML = `
    <div class="wrap wide">
      <button class="navlink" id="back-dash">← Panele dön</button>
      <div class="eyebrow">Talep Takibi</div>
      <h1>${esc(school.name)}</h1>
      <div class="subtitle">Öğretmenlerden (ya da diğer personelden) gelen talep/bildirimleri kaydet, durumunu takip et.</div>
      <div id="talep-content"></div>
    </div>
  `;
  document.getElementById("back-dash").onclick = () => renderDashboard(profile, school);
  await renderTalep(school, document.getElementById("talep-content"));
}

async function renderTalep(school, content, filterStatus = "hepsi") {
  const [{ data: requests }, { data: teachers }] = await Promise.all([
    sb.from("requests").select("*").eq("school_id", school.id).order("created_at", { ascending: false }),
    sb.from("teachers").select("id, full_name").eq("school_id", school.id).order("full_name"),
  ]);

  const counts = { bekliyor: 0, islemde: 0, tamamlandi: 0, reddedildi: 0 };
  (requests || []).forEach(r => { counts[r.status] = (counts[r.status] || 0) + 1; });

  const filtered = filterStatus === "hepsi" ? (requests || []) : (requests || []).filter(r => r.status === filterStatus);

  content.innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">Yeni Talep</h3>
      <label>Talep eden</label>
      <select id="r-select">
        <option value="">Öğretmen listesinden seç…</option>
        ${(teachers || []).map(t => `<option value="${t.id}">${esc(t.full_name)}</option>`).join("")}
        <option value="__custom__">Listede yok (elle yaz)</option>
      </select>
      <div id="r-custom-wrap" class="hidden">
        <label>Ad Soyad</label>
        <input id="r-name" placeholder="örn. Ayşe Öğretmen, 5-A Sınıfı">
      </div>
      <label>Kategori</label>
      <select id="r-category">
        <option value="Malzeme">Malzeme</option>
        <option value="Bakım / Tamirat">Bakım / Tamirat</option>
        <option value="İzin">İzin</option>
        <option value="Diğer">Diğer</option>
      </select>
      <label>Açıklama</label>
      <textarea id="r-desc" rows="3" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-family:inherit;font-size:14px" placeholder="Talebin ayrıntısı"></textarea>
      <button class="primary" id="r-save">Ekle</button>
      <div id="r-msg"></div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div class="subtabs" style="flex-wrap:wrap">
        <div class="subtab ${filterStatus === "hepsi" ? "active" : ""}" data-filter="hepsi">Tümü (${(requests || []).length})</div>
        ${TALEP_STATUS_ORDER.map(s => `<div class="subtab ${filterStatus === s ? "active" : ""}" data-filter="${s}">${TALEP_STATUS_LABELS[s]} (${counts[s]})</div>`).join("")}
      </div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Talepler</h3>
      ${filtered.length ? filtered.map(r => `
        <div class="card" style="margin-bottom:10px;background:var(--surface-2)">
          <div style="display:flex;justify-content:space-between;align-items:start;gap:10px;flex-wrap:wrap">
            <div>
              <strong>${esc(r.requester_name)}</strong> ${r.category ? `<span class="pill">${esc(r.category)}</span>` : ""}
              <div style="font-size:13px;margin-top:4px">${esc(r.description)}</div>
              <div style="font-size:11px;color:var(--muted);margin-top:4px">${fmtDate(r.created_at.slice(0, 10))}</div>
            </div>
            <select data-status-for="${r.id}" style="width:auto">
              ${TALEP_STATUS_ORDER.map(s => `<option value="${s}" ${r.status === s ? "selected" : ""}>${TALEP_STATUS_LABELS[s]}</option>`).join("")}
            </select>
          </div>
          <label style="font-size:12px;margin-top:8px">Not <span style="color:var(--muted);font-weight:400">(opsiyonel)</span></label>
          <input data-note-for="${r.id}" value="${esc(r.note || "")}" placeholder="örn. sipariş verildi, 2 hafta sürecek">
          <div class="row-actions" style="margin-top:6px"><button data-del-request="${r.id}">Sil</button></div>
        </div>
      `).join("") : `<p style="color:var(--muted)">Bu filtrede talep yok.</p>`}
    </div>
  `;

  content.querySelectorAll("[data-filter]").forEach(el => el.onclick = () => renderTalep(school, content, el.dataset.filter));

  const talepTeacherNameById = Object.fromEntries((teachers || []).map(t => [t.id, t.full_name]));
  document.getElementById("r-select").onchange = (ev) => {
    document.getElementById("r-custom-wrap").classList.toggle("hidden", ev.target.value !== "__custom__");
  };
  document.getElementById("r-save").onclick = async () => {
    const selectVal = document.getElementById("r-select").value;
    let requester_name = null, requester_teacher_id = null;
    if (selectVal === "__custom__") {
      requester_name = document.getElementById("r-name").value.trim();
    } else if (selectVal) {
      requester_teacher_id = selectVal;
      requester_name = talepTeacherNameById[selectVal];
    }
    const category = document.getElementById("r-category").value;
    const description = document.getElementById("r-desc").value.trim();
    const msg = document.getElementById("r-msg");
    if (!requester_name || !description) { msg.innerHTML = `<div class="msg err">Talep eden ve açıklama gerekli.</div>`; return; }
    const { error } = await sb.from("requests").insert({ school_id: school.id, requester_name, requester_teacher_id, category, description });
    if (error) { msg.innerHTML = `<div class="msg err">${error.message}</div>`; return; }
    await renderTalep(school, content, filterStatus);
  };

  content.querySelectorAll("[data-status-for]").forEach(sel => sel.onchange = async () => {
    const id = sel.dataset.statusFor;
    const status = sel.value;
    const resolved_at = (status === "tamamlandi" || status === "reddedildi") ? new Date().toISOString() : null;
    await sb.from("requests").update({ status, resolved_at }).eq("id", id);
    await renderTalep(school, content, filterStatus);
  });
  content.querySelectorAll("[data-note-for]").forEach(input => input.onchange = async () => {
    await sb.from("requests").update({ note: input.value.trim() || null }).eq("id", input.dataset.noteFor);
  });
  content.querySelectorAll("[data-del-request]").forEach(b => b.onclick = async () => {
    if (!confirm("Bu talebi silmek istediğine emin misin?")) return;
    await sb.from("requests").delete().eq("id", b.dataset.delRequest);
    await renderTalep(school, content, filterStatus);
  });
}

async function renderPlanlama(school, content, activeId = null) {

  const active = activeId ? (committees || []).find(c => c.id === activeId) : null;

  content.innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">Yeni Kurul / Komisyon / Kulüp</h3>
      <label>Ad</label>
      <input id="c-name" placeholder="örn. Okul Aile Birliği, Satın Alma Komisyonu, Satranç Kulübü">
      <label>Tür <span style="color:var(--muted);font-weight:400">(opsiyonel)</span></label>
      <select id="c-type">
        <option value="">Belirtilmedi</option>
        <option value="Kurul">Kurul</option>
        <option value="Komisyon">Komisyon</option>
        <option value="Kulüp">Kulüp</option>

      <label>Kuruluş tarihi <span style="color:var(--muted);font-weight:400">(opsiyonel)</span></label>
      ${dateInputHtml("c-date", "")}

    </div>

      <h3 style="margin-top:0">Kurullar (${(committees || []).length})</h3>
      ${(committees || []).length ? (committees || []).map(c => `
        <div class="list-item ${activeId === c.id ? "active" : ""}" style="cursor:pointer" data-select-committee="${c.id}">
          <span>${esc(c.name)} ${c.committee_type ? `<span class="pill">${esc(c.committee_type)}</span>` : ""}</span>
          <div class="row-actions"><button data-del-committee="${c.id}">Sil</button></div>
        </div>
      `).join("") : `<p style="color:var(--muted);font-size:13px">Henüz eklenmedi.</p>`}
    </div>
    <div id="committee-detail"></div>
  `;

  wireDate3("c-date");
  document.getElementById("c-save").onclick = async () => {
    const name = document.getElementById("c-name").value.trim();
    const committee_type = document.getElementById("c-type").value || null;
    const established_on = document.getElementById("c-date").value || null;
    const msg = document.getElementById("c-msg");
    if (!name) { msg.innerHTML = `<div class="msg err">Ad gerekli.</div>`; return; }
    const { error } = await sb.from("committees").insert({ school_id: school.id, name, committee_type, established_on });
    if (error) { msg.innerHTML = `<div class="msg err">${error.message}</div>`; return; }
    await renderPlanlama(school, content, activeId);
  };

  content.querySelectorAll("[data-select-committee]").forEach(el => el.onclick = async (e) => {
    if (e.target.closest("[data-del-committee]")) return;
    await renderPlanlama(school, content, el.dataset.selectCommittee);
  });
  content.querySelectorAll("[data-del-committee]").forEach(b => b.onclick = async (e) => {
    e.stopPropagation();
    if (!confirm("Bu kurulu (ve tüm üye/toplantı kayıtlarını) silmek istediğine emin misin?")) return;
    await sb.from("committees").delete().eq("id", b.dataset.delCommittee);
    await renderPlanlama(school, content, activeId === b.dataset.delCommittee ? null : activeId);
  });

  if (active) {
    await renderCommitteeDetail(school, active, document.getElementById("committee-detail"));
  }
}

    { id: "gorevler", label: "Haftalık Görevler" },
    { id: "veli", label: "Veli Bilgilendirme" },
    { id: "kayitlar", label: "Kayıt Geçmişi" },
    ...(profile.role !== "ogretmen" ? [{ id: "ozet", label: "Müdür Özeti" }] : []),
  ];
  return `
    <div class="wrap wide">
      <button class="navlink" id="back-dash">← Panele dön</button>

  `;
}

async function renderLgsModule(profile, school, tab) {
  app.innerHTML = lgsHeader(profile, school, tab);
  document.getElementById("back-dash").onclick = () => renderDashboard(profile, school);
  document.querySelectorAll("[data-tab]").forEach(el => {
    el.onclick = () => renderLgsModule(profile, school, el.dataset.tab);
  });
  const content = document.getElementById("lgs-content");
  content.innerHTML = `<div class="card">Yükleniyor…</div>`;
  if (tab === "dersler") await renderLgsDersler(profile, school, content);
  else if (tab === "denemeler") await renderLgsDenemeler(profile, school, content);
  else if (tab === "analiz") await renderLgsAnaliz(profile, school, content);
  else if (tab === "gorevler") await renderLgsGorevler(profile, school, content);
  else if (tab === "veli") await renderLgsVeli(profile, school, content);
  else if (tab === "ozet") await renderLgsOzet(profile, school, content);
  else if (tab === "kayitlar") await renderLgsKayitlar(profile, school, content);
  else await renderLgsOgrenciler(profile, school, content);
}

}

      <div id="subj-list">

      </div>
      ${isIdareci ? `
      <label>Yeni ders</label>
      <input id="new-subj-name" placeholder="örn. Sosyal Bilgiler">

      <input id="new-subj-count" type="number" min="1" value="10">
      <button class="secondary" id="add-subj" style="margin-top:10px;width:100%">Ekle</button>
      <div id="subj-msg"></div>
      ` : ""}
    </div>
    ${subjects?.length ? `
    <div class="card" style="margin-top:16px">
      <h3 style="margin-top:0">Konular</h3>
      <p style="color:var(--muted);font-size:12.5px;margin-bottom:12px">Deneme sonucunda yanlış çıkan soruları belirli bir konuya bağlamak istersen, önce o dersin konularını burada tanımla — opsiyoneldir, tanımlamazsan sistem ders bazlı çalışmaya devam eder.</p>
      <label>Ders</label>
      <select id="topic-subj-select">
        ${subjects.map(s => `<option value="${s.id}" ${activeSubjectId === s.id || (!activeSubjectId && s === subjects[0]) ? "selected" : ""}>${esc(s.name)}</option>`).join("")}
      </select>
      <div id="topic-list-wrap"></div>
    </div>
    ` : ""}
  `;
  const topicSelect = document.getElementById("topic-subj-select");
  if (topicSelect) {
    const selectedSubject = subjects.find(s => s.id === topicSelect.value);
    topicSelect.onchange = () => renderLgsDersler(profile, school, content, topicSelect.value);
    await renderLgsTopicList(profile, school, document.getElementById("topic-list-wrap"), topicSelect.value, selectedSubject?.name, () => renderLgsDersler(profile, school, content, topicSelect.value));
  }
  if (!isIdareci) return;
  const seedBtn = document.getElementById("seed-subjects");
  if (seedBtn) seedBtn.onclick = async () => {
    await sb.from("lgs_subjects").insert(STANDARD_LGS_SUBJECTS.map((s, i) => ({ school_id: school.id, name: s.name, question_count: s.question_count, sort_order: i })));
    await renderLgsDersler(profile, school, content);
  };
  document.getElementById("add-subj").onclick = async () => {
    const name = document.getElementById("new-subj-name").value.trim();
    const count = Number(document.getElementById("new-subj-count").value);
    const msg = document.getElementById("subj-msg");
    if (!name || !count || count < 1) { msg.innerHTML = `<div class="msg err">Ders adı ve geçerli soru sayısı gerekli.</div>`; return; }
    await sb.from("lgs_subjects").insert({ school_id: school.id, name, question_count: count, sort_order: (subjects || []).length });
    await renderLgsDersler(profile, school, content);
  };
  content.querySelectorAll("[data-del-subj]").forEach(b => b.onclick = async () => {
    await sb.from("lgs_subjects").delete().eq("id", b.dataset.delSubj);
    await renderLgsDersler(profile, school, content);
  });
}

async function renderLgsDenemeDetay(profile, school, el, exam, editStudentId = null) {
  const [{ data: students }, { data: subjects }, { data: results }, { data: topics }, { data: topicErrors }] = await Promise.all([
    sb.from("lgs_students").select("*").eq("school_id", school.id).order("full_name"),
    sb.from("lgs_subjects").select("*").eq("school_id", school.id).order("sort_order"),
    sb.from("lgs_mock_exam_results").select("*").eq("mock_exam_id", exam.id),
    sb.from("lgs_topics").select("*").eq("school_id", school.id).order("sort_order"),
    sb.from("lgs_topic_errors").select("*").eq("mock_exam_id", exam.id),
  ]);
  if (!subjects?.length) {
    el.innerHTML = `<div class="card"><p style="color:var(--muted)">Önce <strong>Dersler</strong> sekmesinden LGS derslerini tanımla.</p></div>`;
    return;
  }
  if (!students?.length) {
    el.innerHTML = `<div class="card"><p style="color:var(--muted)">Önce <strong>Öğrenciler</strong> sekmesinden öğrenci ekle.</p></div>`;
    return;
  }
  const resultsByStudent = {};
  (results || []).forEach(r => { (resultsByStudent[r.student_id] ??= {})[r.lgs_subject_id] = r; });
  const netOf = r => r ? (r.correct_count - r.wrong_count / 4) : null;
  const totalNet = sid => subjects.reduce((sum, s) => sum + (netOf(resultsByStudent[sid]?.[s.id]) || 0), 0);
  const topicsBySubject = {};
  (topics || []).forEach(t => (topicsBySubject[t.lgs_subject_id] ??= []).push(t));

  const editStudent = editStudentId ? students.find(s => s.id === editStudentId) : null;
  const editResults = editStudent ? (resultsByStudent[editStudent.id] || {}) : {};
  const editTopicErrors = {};
  if (editStudent) {
    (topicErrors || []).filter(te => te.student_id === editStudent.id).forEach(te => editTopicErrors[te.lgs_topic_id] = te.error_count);
  }

  el.innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">${esc(exam.title)} — Sonuç Gir</h3>
      <label>Öğrenci</label>
      <select id="r-student">
        <option value="">Seç…</option>
        ${students.map(s => `<option value="${s.id}" ${editStudent?.id === s.id ? "selected" : ""}>${esc(s.full_name)}${resultsByStudent[s.id] ? " ✓" : ""}</option>`).join("")}
      </select>
      <div id="r-subject-fields">
        ${subjects.map(s => `
          <div style="display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:8px;align-items:end;margin-bottom:8px">
            <div style="font-size:13px;padding-bottom:8px">${esc(s.name)} <span style="color:var(--muted);font-size:11px">(${s.question_count})</span></div>
            <div><label style="font-size:11px">Doğru</label><input type="number" min="0" max="${s.question_count}" data-subj="${s.id}" data-field="correct" value="${editResults[s.id]?.correct_count ?? ""}"></div>
            <div><label style="font-size:11px">Yanlış</label><input type="number" min="0" max="${s.question_count}" data-subj="${s.id}" data-field="wrong" value="${editResults[s.id]?.wrong_count ?? ""}"></div>
            <div><label style="font-size:11px">Boş</label><input type="number" min="0" max="${s.question_count}" data-subj="${s.id}" data-field="blank" value="${editResults[s.id]?.blank_count ?? ""}"></div>
          </div>
          ${editStudent && topicsBySubject[s.id]?.length ? `
            <div style="margin:-4px 0 14px;padding:10px;background:var(--surface-2);border-radius:8px">
              <div style="font-size:11px;color:var(--muted);margin-bottom:6px">${esc(s.name)} — hangi konulardan hata? <span style="font-weight:400">(opsiyonel)</span></div>
              <div style="display:flex;flex-wrap:wrap;gap:10px">
                ${topicsBySubject[s.id].map(t => `
                  <div style="display:flex;align-items:center;gap:5px">
                    <span style="font-size:11.5px">${esc(t.name)}</span>
                    <input type="number" min="0" data-topic="${t.id}" data-topic-subj="${s.id}" value="${editTopicErrors[t.id] ?? ""}" style="width:52px;padding:4px">
                  </div>
                `).join("")}
              </div>
            </div>
          ` : ""}
        `).join("")}
      </div>
      <button class="primary" id="r-save" style="width:100%">Kaydet</button>
      <div id="r-msg"></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Sınıf Özeti</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Öğrenci</th>${subjects.map(s => `<th>${esc(s.name)}</th>`).join("")}<th>Toplam Net</th></tr></thead>
          <tbody>
            ${students.map(s => `
              <tr>
                <td style="cursor:pointer;text-decoration:underline" data-edit-student="${s.id}">${esc(s.full_name)}</td>
                ${subjects.map(sub => {
                  const n = netOf(resultsByStudent[s.id]?.[sub.id]);
                  return `<td>${n === null ? "—" : n.toFixed(2)}</td>`;
                }).join("")}
                <td style="font-weight:600">${resultsByStudent[s.id] ? totalNet(s.id).toFixed(2) : "—"}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;
  document.getElementById("r-student").onchange = (ev) => {
    renderLgsDenemeDetay(profile, school, el, exam, ev.target.value || null);
  };
  document.getElementById("r-save").onclick = async () => {
    const studentId = document.getElementById("r-student").value;
    const msg = document.getElementById("r-msg");
    if (!studentId) { msg.innerHTML = `<div class="msg err">Önce öğrenci seç.</div>`; return; }
    const rows = [];
    for (const s of subjects) {
      const c = Number(document.querySelector(`[data-subj="${s.id}"][data-field="correct"]`).value) || 0;
      const w = Number(document.querySelector(`[data-subj="${s.id}"][data-field="wrong"]`).value) || 0;
      const b = Number(document.querySelector(`[data-subj="${s.id}"][data-field="blank"]`).value) || 0;
      if (c + w + b > s.question_count) {
        msg.innerHTML = `<div class="msg err">${esc(s.name)}: doğru + yanlış + boş toplamı ${s.question_count}'i geçemez.</div>`;
        return;
      }
      rows.push({ school_id: school.id, mock_exam_id: exam.id, student_id: studentId, lgs_subject_id: s.id, correct_count: c, wrong_count: w, blank_count: b });
    }
    const { error } = await sb.from("lgs_mock_exam_results").upsert(rows, { onConflict: "mock_exam_id,student_id,lgs_subject_id" });
    if (error) { msg.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }

    const topicUpserts = [];
    const topicDeleteIds = [];
    document.querySelectorAll("[data-topic]").forEach(inp => {
      const val = Number(inp.value) || 0;
      const topicId = inp.dataset.topic;
      if (val > 0) {
        topicUpserts.push({ school_id: school.id, mock_exam_id: exam.id, student_id: studentId, lgs_subject_id: inp.dataset.topicSubj, lgs_topic_id: topicId, error_count: val });
      } else if (editTopicErrors[topicId] !== undefined) {
        topicDeleteIds.push(topicId);
      }
    });
    if (topicUpserts.length) await sb.from("lgs_topic_errors").upsert(topicUpserts, { onConflict: "mock_exam_id,student_id,lgs_topic_id" });
    if (topicDeleteIds.length) await sb.from("lgs_topic_errors").delete().eq("mock_exam_id", exam.id).eq("student_id", studentId).in("lgs_topic_id", topicDeleteIds);

    await renderLgsDenemeDetay(profile, school, el, exam, studentId);
  };
  el.querySelectorAll("[data-edit-student]").forEach(td => td.onclick = () => renderLgsDenemeDetay(profile, school, el, exam, td.dataset.editStudent));
}

function computeLgsWeakness(subjects, examsById, resultsForStudent) {
  const totalQ = subjects.reduce((a, s) => a + s.question_count, 0);
  const bySubject = {};
  subjects.forEach(s => bySubject[s.id] = []);
  resultsForStudent.forEach(r => {
    const exam = examsById[r.mock_exam_id];
    const subject = subjects.find(s => s.id === r.lgs_subject_id);
    if (!exam || !subject) return;
    bySubject[subject.id].push({
      date: exam.exam_date || exam.created_at,
      net: r.correct_count - r.wrong_count / 4,
      q: subject.question_count,
    });
  });
  return subjects.map(s => {
    const arr = (bySubject[s.id] || []).slice().sort((a, b) => new Date(b.date) - new Date(a.date));
    if (!arr.length) return { subject: s, hasData: false };
    const weights = arr.map((_, i) => 1 / (i + 1));
    const wsum = weights.reduce((a, b) => a + b, 0);
    const perf = arr.reduce((acc, r, i) => acc + (weights[i] / wsum) * Math.max(0, r.net / r.q), 0);
    const importance = s.question_count / totalQ;
    return { subject: s, hasData: true, perf, weaknessScore: importance * (1 - perf), examCount: arr.length, lastNet: arr[0].net };
  }).filter(r => r.hasData).sort((a, b) => b.weaknessScore - a.weaknessScore);
}

const LGS_CHART_PALETTE = ["#1f6b65", "#a5690a", "#b3402c", "#4a7fc4", "#8b5fbf", "#c4574a", "#3f9142", "#c48a2f"];

function lgsChartColor(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#888";
}

function lgsChart(canvasId, config) {
  if (!window.__lgsCharts) window.__lgsCharts = {};
  if (window.__lgsCharts[canvasId]) window.__lgsCharts[canvasId].destroy();
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  window.__lgsCharts[canvasId] = new Chart(ctx, config);
}

function computeLgsTopicWeakness(topics, examsById, topicErrorsForStudent) {
  const byTopic = {};
  topics.forEach(t => byTopic[t.id] = []);
  topicErrorsForStudent.forEach(te => {
    const exam = examsById[te.mock_exam_id];
    if (!exam || !byTopic[te.lgs_topic_id]) return;
    byTopic[te.lgs_topic_id].push({ date: exam.exam_date || exam.created_at, count: te.error_count });
  });
  return topics.map(t => {
    const arr = (byTopic[t.id] || []).slice().sort((a, b) => new Date(b.date) - new Date(a.date));
    if (!arr.length) return { topic: t, hasData: false };
    const weights = arr.map((_, i) => 1 / (i + 1));
    const wsum = weights.reduce((a, b) => a + b, 0);
    const score = arr.reduce((acc, r, i) => acc + (weights[i] / wsum) * r.count, 0);
    return { topic: t, hasData: true, score, totalErrors: arr.reduce((a, b) => a + b.count, 0) };
  }).filter(r => r.hasData).sort((a, b) => b.score - a.score);
}

function lgsStudentTrendData(subjects, examsById, resultsForStudent) {
  const examIds = [...new Set(resultsForStudent.map(r => r.mock_exam_id))];
  const examsSorted = examIds.map(id => examsById[id]).filter(Boolean)
    .sort((a, b) => new Date(a.exam_date || a.created_at) - new Date(b.exam_date || b.created_at));
  const byExamSubject = {};
  resultsForStudent.forEach(r => { (byExamSubject[r.mock_exam_id] ??= {})[r.lgs_subject_id] = r; });
  return {
    labels: examsSorted.map(e => e.title),
    datasets: subjects.map((s, i) => ({
      label: s.name,
      data: examsSorted.map(e => {
        const r = byExamSubject[e.id]?.[s.id];
        return r ? +(r.correct_count - r.wrong_count / 4).toFixed(2) : null;
      }),
      borderColor: LGS_CHART_PALETTE[i % LGS_CHART_PALETTE.length],
      backgroundColor: LGS_CHART_PALETTE[i % LGS_CHART_PALETTE.length],
      spanGaps: true,
      tension: 0.25,
    })),
  };
}

function mondayOfWeek(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  date.setDate(date.getDate() + diff);
  return date.toISOString().slice(0, 10);
}

function lgsVeliMessage(school, student, subjects, examsById, resultsForStudent, tasksForStudent) {
  const netOf = r => r.correct_count - r.wrong_count / 4;
  let latestNetLabel = "Henüz deneme sonucu yok";
  let latestExamLine = "";
  if (resultsForStudent.length) {
    const examIds = [...new Set(resultsForStudent.map(r => r.mock_exam_id))];
    const sortedExams = examIds.map(id => examsById[id]).filter(Boolean)
      .sort((a, b) => new Date(b.exam_date || b.created_at) - new Date(a.exam_date || a.created_at));
    const latestExam = sortedExams[0];
    if (latestExam) {
      const totalNet = resultsForStudent.filter(r => r.mock_exam_id === latestExam.id).reduce((sum, r) => sum + netOf(r), 0);
      latestNetLabel = `${latestExam.title}: ${totalNet.toFixed(2)} net`;
      latestExamLine = `📊 Son deneme (${latestExam.title}): ${totalNet.toFixed(2)} net`;
    }
  }

  const weakness = subjects.length ? computeLgsWeakness(subjects, examsById, resultsForStudent) : [];
  const weaknessLine = weakness.length
    ? `🎯 Öncelikli çalışması gereken dersler: ${weakness.slice(0, 2).map(w => w.subject.name).join(", ")}`
    : "";

  const counts = { bekliyor: 0, yapildi: 0, onaylandi: 0 };
  tasksForStudent.forEach(t => { if (counts[t.status] !== undefined) counts[t.status]++; });
  const totalTasks = tasksForStudent.length;
  const taskLabel = totalTasks ? `${counts.onaylandi}/${totalTasks} onaylandı` : "Görev yok";
  const taskLine = totalTasks
    ? `📝 Bu dönemki görevler: ${counts.onaylandi} onaylandı, ${counts.yapildi} kontrol bekliyor, ${counts.bekliyor} henüz başlanmadı`
    : "";

  const lines = [
    `Merhaba${student.veli_adi ? " " + student.veli_adi : ""}, ${student.full_name} için LGS koçluk güncellemesi:`,
    "",
    latestExamLine,
    weaknessLine,
    taskLine,
  ].filter(Boolean);
  lines.push("", "İyi çalışmalar dileriz.", school.name);

  return { text: lines.join("\n"), latestNetLabel, taskLabel };
}

async function renderLgsVeli(profile, school, content) {
  const [{ data: students }, { data: subjects }, { data: exams }, { data: results }, { data: tasks }] = await Promise.all([
    sb.from("lgs_students").select("*").eq("school_id", school.id).order("full_name"),
    sb.from("lgs_subjects").select("*").eq("school_id", school.id).order("sort_order"),
    sb.from("lgs_mock_exams").select("*").eq("school_id", school.id),
    sb.from("lgs_mock_exam_results").select("*").eq("school_id", school.id),
    sb.from("lgs_study_tasks").select("*").eq("school_id", school.id),
  ]);
  if (!students?.length) {
    content.innerHTML = `<div class="card"><p style="color:var(--muted)">Önce <strong>Öğrenciler</strong> sekmesinden öğrenci ekle.</p></div>`;
    return;
  }
  const examsById = Object.fromEntries((exams || []).map(e => [e.id, e]));
  const resultsByStudent = {};
  (results || []).forEach(r => (resultsByStudent[r.student_id] ??= []).push(r));
  const tasksByStudent = {};
  (tasks || []).forEach(t => (tasksByStudent[t.student_id] ??= []).push(t));

  content.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0">Veli Bilgilendirme</h3>
      <p style="color:var(--muted);font-size:12.5px;margin-bottom:12px">Her öğrenci için son deneme sonucu, öncelikli dersler ve görev durumunu özetleyen bir WhatsApp mesajı hazırlar — göndermeden önce metni düzenleyebilirsin.</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Öğrenci</th><th>Veli</th><th>Son Deneme</th><th>Görevler</th><th></th></tr></thead>
          <tbody>
            ${students.map(s => {
              const m = lgsVeliMessage(school, s, subjects || [], examsById, resultsByStudent[s.id] || [], tasksByStudent[s.id] || []);
              const link = s.veli_telefon ? waLink(s.veli_telefon, m.text) : null;
              return `
                <tr>
                  <td>${esc(s.full_name)}</td>
                  <td>${s.veli_adi ? esc(s.veli_adi) : "—"}</td>
                  <td>${esc(m.latestNetLabel)}</td>
                  <td>${esc(m.taskLabel)}</td>
                  <td>${link
                    ? `<a href="${link}" target="_blank" rel="noopener" class="pill" style="text-decoration:none">📲 Veliye Gönder</a>`
                    : `<span style="font-size:10.5px;color:var(--muted)">tel. yok</span>`}</td>
                </tr>
              `;
            }).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

async function renderLgsOzet(profile, school, content) {
  if (profile.role === "ogretmen") {
    content.innerHTML = `<div class="card"><p style="color:var(--muted)">Bu özet sadece okul idaresi içindir.</p></div>`;
    return;
  }
  const [{ data: students }, { data: teachers }, { data: results }, { data: tasks }, { data: exams }] = await Promise.all([
    sb.from("lgs_students").select("*").eq("school_id", school.id),
    sb.from("teachers").select("*").eq("school_id", school.id),
    sb.from("lgs_mock_exam_results").select("*").eq("school_id", school.id),
    sb.from("lgs_study_tasks").select("*").eq("school_id", school.id),
    sb.from("lgs_mock_exams").select("*").eq("school_id", school.id),
  ]);
  if (!students?.length) {
    content.innerHTML = `<div class="card"><p style="color:var(--muted)">Önce <strong>Öğrenciler</strong> sekmesinden öğrenci ekle.</p></div>`;
    return;
  }
  const teacherById = Object.fromEntries((teachers || []).map(t => [t.id, t]));
  const examsById = Object.fromEntries((exams || []).map(e => [e.id, e]));
  const resultsByStudent = {};
  (results || []).forEach(r => (resultsByStudent[r.student_id] ??= []).push(r));
  const tasksByStudent = {};
  (tasks || []).forEach(t => (tasksByStudent[t.student_id] ??= []).push(t));

  const flagged = students.map(s => {
    const flags = [];
    if (!s.coach_teacher_id) flags.push("Koç atanmamış");
    const myResults = resultsByStudent[s.id] || [];
    if (!myResults.length) flags.push("Hiç deneme sonucu yok");
    if (!s.veli_telefon) flags.push("Veli telefonu yok");
    if (myResults.length) {
      const examIds = [...new Set(myResults.map(r => r.mock_exam_id))];
      const dates = examIds.map(id => examsById[id]?.exam_date || examsById[id]?.created_at).filter(Boolean).map(d => new Date(d));
      if (dates.length) {
        const latest = new Date(Math.max(...dates));
        const daysSince = Math.floor((Date.now() - latest) / 86400000);
        if (daysSince > 21) flags.push(`Son deneme ${daysSince} gün önce`);
      }
    }
    return { student: s, flags };
  }).filter(x => x.flags.length);

  const noCoachCount = students.filter(s => !s.coach_teacher_id).length;
  const noResultCount = students.filter(s => !(resultsByStudent[s.id] || []).length).length;
  const noPhoneCount = students.filter(s => !s.veli_telefon).length;
  const totalBekliyor = (tasks || []).filter(t => t.status === "bekliyor").length;
  const totalYapildi = (tasks || []).filter(t => t.status === "yapildi").length;

  const coachIds = [...new Set(students.map(s => s.coach_teacher_id).filter(Boolean))];
  const coachRows = coachIds.map(tid => {
    const t = teacherById[tid];
    const myStudents = students.filter(s => s.coach_teacher_id === tid);
    const myStudentIds = new Set(myStudents.map(s => s.id));
    const myTasks = (tasks || []).filter(tk => myStudentIds.has(tk.student_id));
    return {
      name: t?.full_name || "Bilinmeyen",
      hasAccount: !!t?.user_id,
      studentCount: myStudents.length,
      bekliyor: myTasks.filter(tk => tk.status === "bekliyor").length,
    };
  }).sort((a, b) => b.studentCount - a.studentCount);

  content.innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">Okul Özeti</h3>
      <div class="list-item"><span>Toplam öğrenci</span><strong>${students.length}</strong></div>
      <div class="list-item"><span>Koçsuz öğrenci</span><strong>${noCoachCount}</strong></div>
      <div class="list-item"><span>Hiç deneme sonucu olmayan öğrenci</span><strong>${noResultCount}</strong></div>
      <div class="list-item"><span>Veli telefonu eksik öğrenci</span><strong>${noPhoneCount}</strong></div>
      <div class="list-item"><span>Bekleyen görev (okul geneli)</span><strong>${totalBekliyor}</strong></div>
      <div class="list-item"><span>Koç onayı bekleyen görev</span><strong>${totalYapildi}</strong></div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">Dikkat Gerektiren Öğrenciler (${flagged.length})</h3>
      ${flagged.length ? `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Öğrenci</th><th>Uyarılar</th></tr></thead>
          <tbody>
            ${flagged.map(f => `<tr><td>${esc(f.student.full_name)}</td><td>${f.flags.map(fl => `<span class="pill warn">${esc(fl)}</span>`).join(" ")}</td></tr>`).join("")}
          </tbody>
        </table>
      </div>
      ` : `<p style="color:var(--muted);font-size:13px">Tüm öğrenciler kapsam altında — dikkat gerektiren bir durum yok.</p>`}
    </div>
    <div class="card">
      <h3 style="margin-top:0">Koç Yükü</h3>
      ${coachRows.length ? `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Koç</th><th>Öğrenci</th><th>Panel Hesabı</th><th>Bekleyen Görev</th></tr></thead>
          <tbody>
            ${coachRows.map(c => `<tr><td>${esc(c.name)}</td><td>${c.studentCount}</td><td>${c.hasAccount ? "✅ Bağlı" : "— bağlanmadı"}</td><td>${c.bekliyor}</td></tr>`).join("")}
          </tbody>
        </table>
      </div>
      ` : `<p style="color:var(--muted);font-size:13px">Henüz kimseye öğrenci koç olarak atanmadı.</p>`}
    </div>
  `;
}

function fmtDateTime(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleString("tr-TR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
}

function describeLgsAuditEntry(entry, lookups) {
  const actor = esc(entry.actor_name || "Bilinmeyen kullanıcı");
  const d = entry.new_data || entry.old_data || {};

  if (entry.table_name === "lgs_students") {
    const sName = esc(d.full_name || "silinmiş öğrenci");
    if (entry.action === "insert") return `${actor} — ${sName} öğrencisini ekledi`;
    if (entry.action === "delete") return `${actor} — ${sName} öğrencisini sildi`;
    const fields = { full_name: "ad", class_id: "şube", coach_teacher_id: "koç", veli_telefon: "veli telefonu", veli_adi: "veli adı", hedef_puan: "hedef puan", hedef_okul: "hedef okul" };
    const changed = Object.entries(fields)
      .filter(([k]) => JSON.stringify(entry.old_data?.[k]) !== JSON.stringify(entry.new_data?.[k]))
      .map(([, label]) => label);
    return `${actor} — ${sName} kaydını güncelledi${changed.length ? ` (${esc(changed.join(", "))})` : ""}`;
  }

  const sName = esc(lookups.studentName(d.student_id) || "silinmiş öğrenci");

  if (entry.table_name === "lgs_mock_exam_results") {
    const subj = esc(lookups.subjectName(d.lgs_subject_id) || "ders");
    if (entry.action === "insert") return `${actor} — ${sName} için ${subj} sonucu girdi (${d.correct_count} doğru, ${d.wrong_count} yanlış, ${d.blank_count} boş)`;
    if (entry.action === "delete") return `${actor} — ${sName} için ${subj} sonucunu sildi`;
    const o = entry.old_data || {}, n = entry.new_data || {};
    const diffs = [];
    if (o.correct_count !== n.correct_count) diffs.push(`doğru ${o.correct_count}→${n.correct_count}`);
    if (o.wrong_count !== n.wrong_count) diffs.push(`yanlış ${o.wrong_count}→${n.wrong_count}`);
    if (o.blank_count !== n.blank_count) diffs.push(`boş ${o.blank_count}→${n.blank_count}`);
    return `${actor} — ${sName} · ${subj} sonucunu güncelledi${diffs.length ? ` (${esc(diffs.join(", "))})` : ""}`;
  }

  if (entry.table_name === "lgs_topic_errors") {
    const subj = esc(lookups.subjectName(d.lgs_subject_id) || "ders");
    const topic = esc(lookups.topicName(d.lgs_topic_id) || "konu");
    if (entry.action === "delete") return `${actor} — ${sName} için ${subj} / ${topic} hata kaydını sildi`;
    return `${actor} — ${sName} için ${subj} / ${topic} hata sayısını ${d.error_count} olarak ${entry.action === "insert" ? "kaydetti" : "güncelledi"}`;
  }

  return `${actor} — bir kayıt ${entry.action === "insert" ? "eklendi" : entry.action === "delete" ? "silindi" : "güncellendi"}`;
}

async function renderLgsKayitlar(profile, school, content) {
  const [{ data: logs }, { data: students }, { data: subjects }, { data: topics }] = await Promise.all([
    sb.from("lgs_audit_log").select("*").eq("school_id", school.id).order("created_at", { ascending: false }).limit(150),
    sb.from("lgs_students").select("id, full_name").eq("school_id", school.id),
    sb.from("lgs_subjects").select("id, name").eq("school_id", school.id),
    sb.from("lgs_topics").select("id, name").eq("school_id", school.id),
  ]);
  const studentNameById = Object.fromEntries((students || []).map(s => [s.id, s.full_name]));
  const subjectNameById = Object.fromEntries((subjects || []).map(s => [s.id, s.name]));
  const topicNameById = Object.fromEntries((topics || []).map(t => [t.id, t.name]));
  const lookups = {
    studentName: id => studentNameById[id],
    subjectName: id => subjectNameById[id],
    topicName: id => topicNameById[id],
  };

  content.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0">Kayıt Geçmişi</h3>
      <p style="color:var(--muted);font-size:12.5px;margin-bottom:12px">${profile.role === "ogretmen" ? "Kendi yaptığın işlemler." : "Okuldaki tüm öğrenci ve deneme sonucu değişiklikleri."} (Son ${(logs || []).length} kayıt.)</p>
      ${(logs || []).length ? (logs || []).map(l => `
        <div class="list-item">
          <span style="font-size:12.5px">${describeLgsAuditEntry(l, lookups)}</span>
          <span style="color:var(--muted);font-size:11px;white-space:nowrap;margin-left:10px">${fmtDateTime(l.created_at)}</span>
        </div>
      `).join("") : `<p style="color:var(--muted);font-size:13px">Henüz kayıt yok.</p>`}
    </div>
  `;
}

const PANO_TYPE_LABELS = { duyuru: "Duyuru", medya: "Medya", pekistirec: "Pekiştireç" };
const PANO_CATEGORY_OPTIONS = ["Ayın Öğrencisi", "En Temiz Sınıf", "Diğer"];

function sendPanoCommand(token, cmd) {
  const ch = sb.channel(`pano-control-${token}`);
  ch.subscribe((status) => {
    if (status === "SUBSCRIBED") {
      ch.send({ type: "broadcast", event: "command", payload: cmd });
      setTimeout(() => sb.removeChannel(ch), 1500);
    }
  });
}

function fitPanoPreview() {
  const wrap = document.getElementById("pano-preview-wrap");
  const frame = document.getElementById("pano-preview-frame");
  if (!wrap || !frame) return;
  frame.style.transform = `scale(${wrap.clientWidth / 1920})`;
}

function panoPublicUrl(path) {
  if (!path) return null;
  return sb.storage.from("pano-media").getPublicUrl(path).data.publicUrl;
}

async function panoUploadFile(school, file, kindHint) {
  const maxBytes = (kindHint === "upload_video" ? 100 : 10) * 1024 * 1024;
  if (file.size > maxBytes) {
    throw new Error(`Dosya çok büyük (en fazla ${kindHint === "upload_video" ? "100MB" : "10MB"}).`);
  }
  const ext = (file.name.split(".").pop() || "bin").toLowerCase();
  const path = `${school.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error } = await sb.storage.from("pano-media").upload(path, file);
  if (error) throw error;
  return path;
}

  const el = document.getElementById("p-media-input");
  if (kind === "embed_video") {
    el.innerHTML = `<label>YouTube/Vimeo linki</label><input id="p-media-url" value="${esc(existing?.media_url || "")}" placeholder="https://www.youtube.com/watch?v=...">`;
  } else {

    el.innerHTML = `<label>Dosya <span style="color:var(--muted);font-weight:400">(en fazla ${limit})</span></label><input id="p-media-file" type="file" accept="${accept}">`;

async function renderPano(profile, school, content, typeFilter = "hepsi", statusFilter = "hepsi", editingId = null) {
  const [{ data: items }, { data: schoolRow }] = await Promise.all([
    sb.from("pano_items").select("*").eq("school_id", school.id).order("sort_order"),
    sb.from("schools").select("display_token").eq("id", school.id).single(),
  ]);
  const editItem = editingId ? (items || []).find(i => i.id === editingId) : null;
  const formType = editItem?.type || "duyuru";

  const typeCounts = { duyuru: 0, medya: 0, pekistirec: 0 };
  const statusCounts = { taslak: 0, yayinda: 0 };
  (items || []).forEach(i => { typeCounts[i.type]++; statusCounts[i.status]++; });

  let filtered = items || [];
  if (typeFilter !== "hepsi") filtered = filtered.filter(i => i.type === typeFilter);
  if (statusFilter !== "hepsi") filtered = filtered.filter(i => i.status === statusFilter);

  const displayLink = schoolRow?.display_token ? `${location.origin}${location.pathname.replace(/index\.html$/, "")}pano.html?token=${schoolRow.display_token}` : null;

  content.innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">Görüntüleme Linki</h3>
      <p style="color:var(--muted);font-size:12.5px;margin-bottom:12px">Bu bağlantıyı koridordaki ekranın tarayıcısına bir kere yapıştır, açık bırak — giriş gerekmez, içerikler otomatik döner ve yayınladıkça güncellenir.</p>
      ${displayLink ? `
        <input readonly value="${esc(displayLink)}" style="font-size:12px" onclick="this.select()">
        <button class="secondary" id="regen-token" style="margin-top:10px">Yeniden Oluştur <span style="color:var(--muted);font-weight:400">(eski link geçersiz olur)</span></button>
      ` : `<button class="primary" id="gen-token" style="width:100%">Görüntüleme Linki Oluştur</button>`}
    </div>

    ${displayLink ? `
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">Canlı Önizleme</h3>
      <p style="color:var(--muted);font-size:12.5px;margin-bottom:12px">Koridordaki ekranda şu an ne gösterildiğini, gerçek boyut oranıyla ve gerçek zamanlı olarak (kendi başına dönerek) buradan görüyorsun — koridora gitmene gerek yok. Aşağıdaki butonlar hem bu önizlemeyi hem <strong>koridordaki gerçek ekranı</strong> anında etkiler.</p>
      <div id="pano-preview-wrap" style="position:relative;width:100%;max-width:640px;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden">
        <iframe id="pano-preview-frame" src="${esc(displayLink)}" style="width:1920px;height:1080px;border:none;pointer-events:none;transform-origin:top left;display:block"></iframe>
      </div>
      <div class="row-actions" style="margin-top:10px">
        <button class="secondary" id="pano-preview-prev">◀ Önceki</button>
        <button class="secondary" id="pano-preview-next">Sıradaki ▶</button>
        <button class="secondary" id="pano-preview-refresh">Yeni Yayınladığımı Hemen Getir</button>
      </div>
    </div>
    ` : ""}

    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">${editItem ? "İçeriği Düzenle" : "Yeni İçerik"}</h3>
      <label>Tür</label>
      <select id="p-type" ${editItem ? "disabled" : ""}>
        ${Object.entries(PANO_TYPE_LABELS).map(([k, v]) => `<option value="${k}" ${formType === k ? "selected" : ""}>${v}</option>`).join("")}
      </select>
      <div id="p-fields"></div>
      <label>Ekranda kalma süresi (saniye)</label>
      <input id="p-seconds" type="number" min="1" value="${editItem?.display_seconds ?? 15}">
      <label>Başlangıç tarihi <span style="color:var(--muted);font-weight:400">(opsiyonel)</span></label>
      ${dateInputHtml("p-starts", editItem?.starts_on || "")}
      <label>Bitiş tarihi <span style="color:var(--muted);font-weight:400">(opsiyonel, geçince otomatik gizlenir)</span></label>
      ${dateInputHtml("p-ends", editItem?.ends_on || "")}
      <button class="primary" id="p-save" style="width:100%;margin-top:10px">${editItem ? "Güncelle" : "Taslak Olarak Kaydet"}</button>
      ${editItem ? `<button class="secondary" id="p-cancel" style="width:100%;margin-top:8px">İptal</button>` : ""}
      <div id="p-msg"></div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="subtabs" style="flex-wrap:wrap">
        <div class="subtab ${typeFilter === "hepsi" ? "active" : ""}" data-type-filter="hepsi">Tümü (${(items || []).length})</div>
        ${Object.entries(PANO_TYPE_LABELS).map(([k, v]) => `<div class="subtab ${typeFilter === k ? "active" : ""}" data-type-filter="${k}">${v} (${typeCounts[k]})</div>`).join("")}
      </div>
      <div class="subtabs" style="flex-wrap:wrap;margin-top:8px">
        <div class="subtab ${statusFilter === "hepsi" ? "active" : ""}" data-status-filter="hepsi">Tümü</div>
        <div class="subtab ${statusFilter === "taslak" ? "active" : ""}" data-status-filter="taslak">Taslak (${statusCounts.taslak})</div>
        <div class="subtab ${statusFilter === "yayinda" ? "active" : ""}" data-status-filter="yayinda">Yayında (${statusCounts.yayinda})</div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0">İçerikler</h3>
      ${filtered.length ? filtered.map(renderPanoItemRow).join("") : `<p style="color:var(--muted)">Bu filtrede içerik yok.</p>`}
    </div>
  `;

  renderPanoFormFields(editItem, formType);
  wireDate3("p-starts");
  wireDate3("p-ends");
  const typeSelect = document.getElementById("p-type");
  if (!editItem) typeSelect.onchange = (ev) => renderPanoFormFields(null, ev.target.value);

  const genBtn = document.getElementById("gen-token");
  if (genBtn) genBtn.onclick = async () => {
    await sb.from("schools").update({ display_token: crypto.randomUUID() }).eq("id", school.id);
    await renderPano(profile, school, content, typeFilter, statusFilter);
  };
  const regenBtn = document.getElementById("regen-token");
  if (regenBtn) regenBtn.onclick = async () => {
    if (!confirm("Eski link artık çalışmayacak, koridordaki ekranı yeni linkle güncellemen gerekecek. Devam?")) return;
    await sb.from("schools").update({ display_token: crypto.randomUUID() }).eq("id", school.id);
    await renderPano(profile, school, content, typeFilter, statusFilter);
  };
  const previewRefreshBtn = document.getElementById("pano-preview-refresh");
  if (previewRefreshBtn) previewRefreshBtn.onclick = () => {
    const frame = document.getElementById("pano-preview-frame");
    frame.src = frame.src;
    sendPanoCommand(schoolRow.display_token, { type: "refresh" });
  };
  const previewPrevBtn = document.getElementById("pano-preview-prev");
  if (previewPrevBtn) previewPrevBtn.onclick = () => sendPanoCommand(schoolRow.display_token, { type: "prev" });
  const previewNextBtn = document.getElementById("pano-preview-next");
  if (previewNextBtn) previewNextBtn.onclick = () => sendPanoCommand(schoolRow.display_token, { type: "next" });
  if (document.getElementById("pano-preview-wrap")) {
    fitPanoPreview();
    window.addEventListener("resize", fitPanoPreview);
  }

  document.getElementById("p-save").onclick = async () => {
    const msg = document.getElementById("p-msg");
    const type = document.getElementById("p-type").value;
    const title = document.getElementById("p-title").value.trim();
    if (!title) { msg.innerHTML = `<div class="msg err">Başlık zorunlu.</div>`; return; }
    const payload = {
      school_id: school.id,
      type,
      title,
      body_text: document.getElementById("p-body")?.value.trim() || null,
      display_seconds: Number(document.getElementById("p-seconds").value) || 15,
      starts_on: document.getElementById("p-starts").value || null,
      ends_on: document.getElementById("p-ends").value || null,
    };
    if (type === "pekistirec") {
      payload.category = document.getElementById("p-category").value;
      payload.subject_name = document.getElementById("p-subject").value.trim() || null;
      payload.period_label = document.getElementById("p-period").value.trim() || null;
      const fileInput = document.getElementById("p-media-file");
      if (fileInput?.files?.[0]) {
        try {
          const path = await panoUploadFile(school, fileInput.files[0], "upload_image");
          payload.media_kind = "upload_image";
          payload.media_path = path;
          payload.media_url = null;
        } catch (e) { msg.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
      }
    } else if (type === "medya") {
      const kind = document.getElementById("p-media-kind").value;
      payload.media_kind = kind;
      if (kind === "embed_video") {
        const url = document.getElementById("p-media-url").value.trim();
        if (!url) { msg.innerHTML = `<div class="msg err">Link gerekli.</div>`; return; }
        payload.media_url = url;
        payload.media_path = null;
      } else {
        const fileInput = document.getElementById("p-media-file");
        if (fileInput?.files?.[0]) {
          try {
            const path = await panoUploadFile(school, fileInput.files[0], kind);
            payload.media_path = path;
            payload.media_url = null;
          } catch (e) { msg.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
        } else if (!editItem?.media_path) {
          msg.innerHTML = `<div class="msg err">Dosya seç.</div>`; return;
        }
      }
    }
    const { error } = editItem
      ? await sb.from("pano_items").update(payload).eq("id", editItem.id)
      : await sb.from("pano_items").insert({ ...payload, created_by: profile.id, sort_order: (items || []).length });
    if (error) { msg.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
    await renderPano(profile, school, content, typeFilter, statusFilter);
  };

  const cancelBtn = document.getElementById("p-cancel");
  if (cancelBtn) cancelBtn.onclick = () => renderPano(profile, school, content, typeFilter, statusFilter);

  content.querySelectorAll("[data-type-filter]").forEach(el => el.onclick = () => renderPano(profile, school, content, el.dataset.typeFilter, statusFilter));
  content.querySelectorAll("[data-status-filter]").forEach(el => el.onclick = () => renderPano(profile, school, content, typeFilter, el.dataset.statusFilter));
  content.querySelectorAll("[data-edit-item]").forEach(b => b.onclick = () => renderPano(profile, school, content, typeFilter, statusFilter, b.dataset.editItem));
  content.querySelectorAll("[data-show-now]").forEach(b => b.onclick = () => sendPanoCommand(schoolRow.display_token, { type: "jump", itemId: b.dataset.showNow }));
  content.querySelectorAll("[data-toggle-status]").forEach(b => b.onclick = async () => {
    const item = (items || []).find(i => i.id === b.dataset.toggleStatus);
    const newStatus = item.status === "yayinda" ? "taslak" : "yayinda";
    await sb.from("pano_items").update({ status: newStatus, published_at: newStatus === "yayinda" ? new Date().toISOString() : item.published_at }).eq("id", item.id);
    await renderPano(profile, school, content, typeFilter, statusFilter);
  });
  content.querySelectorAll("[data-del-item]").forEach(b => b.onclick = async () => {
    if (!confirm("Bu içeriği silmek istediğine emin misin?")) return;
    const item = (items || []).find(i => i.id === b.dataset.delItem);
    if (item?.media_path) await sb.storage.from("pano-media").remove([item.media_path]);
    await sb.from("pano_items").delete().eq("id", item.id);
    await renderPano(profile, school, content, typeFilter, statusFilter);
  });
}

async function renderKilavuzModule(profile, school, activeId = "giris") {
  app.innerHTML = `
    <div class="wrap wide">
      <button class="navlink" id="back-dash">← Panele dön</button>
      <div class="eyebrow">Kullanma Kılavuzu</div>
      <h1>${esc(school.name)}</h1>
      <div class="subtitle">Her modülün ne işe yaradığı ve nasıl kullanılacağı.</div>
      <div class="subtabs" style="flex-wrap:wrap">
        ${KILAVUZ_SECTIONS.map(s => `<div class="subtab ${activeId === s.id ? "active" : ""}" data-kilavuz-section="${s.id}">${s.title}</div>`).join("")}
      </div>
      <div class="card guide-content" id="kilavuz-content"></div>
      <button class="secondary" id="kilavuz-print" style="margin-top:14px">Yazdır</button>
    </div>
  `;
  document.getElementById("back-dash").onclick = () => renderDashboard(profile, school);
  const section = KILAVUZ_SECTIONS.find(s => s.id === activeId) || KILAVUZ_SECTIONS[0];
  document.getElementById("kilavuz-content").innerHTML = `<h4>${esc(section.title)}</h4>${section.html}`;
  document.querySelectorAll("[data-kilavuz-section]").forEach(el => el.onclick = () => renderKilavuzModule(profile, school, el.dataset.kilavuzSection));
  document.getElementById("kilavuz-print").onclick = () => window.print();
}

  { cat: "Personel ve Gizlilik", q: "Personel İşleri'ndeki kayıtlar başka bir bilgisayarda neden görünmüyor?", a: `Bu modül bilinçli bir tasarım kararıyla verisini sadece o cihazda/tarayıcıda tutar, sunucuya hiç göndermez (maaş, terfi, devam gibi hassas veri olduğu için). Aynı durum Sınav Kelebek için de geçerlidir.` },
  { cat: "Mevzuata Sor", q: "Mevzuata Sor bir soruya cevap bulamadı, neden?", a: `Bu araç yapay zekâ değildir ve internetten cevap üretmez — sadece Teftişe Hazırlık ve Aylık Yönetim Akışı'na senin daha önce girdiğin doğrulanmış maddeler arasında arama yapar. Sonuç yoksa önce ilgili maddeyi oraya eklemen gerekir.` },

  { cat: "Genel", q: "Bir öğrenciyi/dersi/denemeyi silme yetkisi kimde?", a: `Kalıcı/idari işlemler (ekleme, silme, ders/deneme tanımlama) sadece idareciye açıktır. Öğretmen kendi öğrencisinin bazı bilgilerini güncelleyebilir ama silemez, yeni öğrenci ekleyemez.` },
  { cat: "Genel", q: "Girdiğim veriler nerede saklanıyor, güvenli mi?", a: `Akademik/idari veriler (öğrenci, deneme, nöbet, evrak vb.) Supabase üzerinde, okul bazlı izole (başka bir okulun verisi hiçbir şekilde görünmez) şekilde saklanır. Hassas kabul edilen Personel İşleri ve Sınav Kelebek ise hiç sunucuya gitmez, sadece kullandığın cihazda kalır.` },
];

async function renderSSSModule(profile, school, filterText = "") {
  app.innerHTML = `
    <div class="wrap wide">
      <button class="navlink" id="back-dash">← Panele dön</button>
      <div class="eyebrow">Sıkça Sorulan Sorular</div>
      <h1>${esc(school.name)}</h1>
      <div class="subtitle">Aramak istediğin kelimeyi yaz, ya da aşağıdan gezin.</div>
      <input id="sss-search" placeholder="örn. davet kodu, personel, önizleme…" value="${esc(filterText)}" style="margin-bottom:18px">
      <div id="sss-list"></div>
    </div>
  `;
  document.getElementById("back-dash").onclick = () => renderDashboard(profile, school);

  function renderList(filter) {
    const needle = filter.trim().toLocaleLowerCase("tr-TR");
    const filtered = SSS_ITEMS.filter(item => !needle || (item.q + " " + item.a).toLocaleLowerCase("tr-TR").includes(needle));
    const byCat = {};
    filtered.forEach(item => (byCat[item.cat] ??= []).push(item));
    const listEl = document.getElementById("sss-list");
    listEl.innerHTML = Object.keys(byCat).length ? Object.entries(byCat).map(([cat, items]) => `
      <div class="faq-cat">${esc(cat)}</div>
      ${items.map(item => `
        <details class="faq-item">
          <summary>${esc(item.q)}</summary>
          <div class="faq-answer">${item.a}</div>
        </details>
      `).join("")}
    `).join("") : `<p style="color:var(--muted)">Bu aramayla eşleşen soru bulunamadı.</p>`;
  }
  renderList(filterText);
  document.getElementById("sss-search").oninput = (ev) => renderList(ev.target.value);
}

/* ============ PLATFORM YÖNETİMİ ============ */

function schoolInviteUrl(code) {
  return `${location.origin}${location.pathname}?okul=${encodeURIComponent(code)}`;
}

async function renderPlatformAdmin(profile, formMsg = "") {
  app.innerHTML = `
    <div class="wrap wide">
      <button class="navlink" id="back-dash">← Panele dön</button>
      <div class="eyebrow">Platform Yönetimi</div>
      <h1>Okullar</h1>
      <div class="subtitle">Her okulun hangi modülleri görebileceğini buradan yönet. Bir okulda hiçbir modül işaretsiz bırakılmazsa (tümü açıksa) okul her zaman tüm modülleri görür.</div>
      <div class="card" style="margin-bottom:20px">
        <h3 style="margin-top:0">Yeni Okul Ekle</h3>
        <p style="color:var(--muted);font-size:12.5px;margin-top:-6px">Okulu burada oluştur, çıkan davet kodu/linki müdüre gönder — müdür linke tıklayıp hesap oluşturunca otomatik olarak bu okula bağlanır. Kendi okul kurulum ekranındaki bilgilerin aynısı (Rolün hariç, her zaman Müdür olarak atanır).</p>
        <label>Okul adı</label>
        <input id="pa-name" placeholder="örn. Zübeyde Hanım TOBB Anaokulu">
        <label>İl</label>
        <input id="pa-il" placeholder="Balıkesir">
        <label>İlçe</label>
        <input id="pa-ilce" placeholder="Merkez">
        <label>Müdür adı <span style="color:var(--muted);font-weight:400">(opsiyonel, biliyorsan gir)</span></label>
        <input id="pa-mudur" placeholder="Ad Soyad">
        <label>Okul türü</label>
        <select id="pa-turu">
          <option value="okul_oncesi">Okul Öncesi / Anaokulu</option>
          <option value="ilkokul">İlkokul</option>
          <option value="ortaokul">Ortaokul</option>
          <option value="lise">Lise</option>
        </select>
        <button class="primary" id="pa-create">Okul Oluştur ve Davet Kodu Al</button>
        <div id="pa-create-msg">${formMsg}</div>
      </div>
      <div id="pa-list"><p style="color:var(--muted)">Yükleniyor…</p></div>
    </div>
  `;
  document.getElementById("back-dash").onclick = () => boot();

  document.getElementById("pa-create").onclick = async () => {
    const name = document.getElementById("pa-name").value.trim();
    const il = document.getElementById("pa-il").value.trim();
    const ilce = document.getElementById("pa-ilce").value.trim();
    const mudur_adi = document.getElementById("pa-mudur").value.trim();
    const okul_turu = document.getElementById("pa-turu").value;
    const btn = document.getElementById("pa-create");
    const msg = document.getElementById("pa-create-msg");
    if (!name || !il || !ilce) {
      msg.innerHTML = `<div class="msg err">Okul adı, il ve ilçe zorunlu.</div>`;
      return;
    }
    btn.disabled = true;
    const invite_code = randomInviteCode();
    const { error } = await sb.from("schools").insert({ name, il, ilce, mudur_adi: mudur_adi || null, okul_turu, created_by: profile.id, invite_code });
    btn.disabled = false;
    if (error) {
      msg.innerHTML = `<div class="msg err">${esc(error.message)}</div>`;
      return;
    }
    await renderPlatformAdmin(profile, `<div class="msg ok">"${esc(name)}" oluşturuldu. Davet kodu: <strong style="font-family:ui-monospace,monospace">${esc(invite_code)}</strong> — aşağıdaki listede linkini bulup müdüre gönderebilirsin.</div>`);
  };

  const listEl = document.getElementById("pa-list");
  const { data: schools, error } = await sb.from("schools").select("*").order("created_at", { ascending: false });
  if (error) {
    listEl.innerHTML = `<div class="msg err">${esc(error.message)}</div>`;
    return;
  }
  if (!schools || !schools.length) {
    listEl.innerHTML = `<p style="color:var(--muted)">Henüz kayıtlı okul yok.</p>`;
    return;
  }

  listEl.innerHTML = schools.map(s => {
    const restricted = !!(s.enabled_modules && s.enabled_modules.length);
    const loc = [s.il, s.ilce].filter(Boolean).join("/");
    const pending = !!s.invite_code;
    return `
      <div class="card" data-school="${s.id}" style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">
          <div>
            <strong>${esc(s.name)}</strong>
            <div style="font-size:12.5px;color:var(--muted)">${esc(loc)}${loc && s.mudur_adi ? " · " : ""}${esc(s.mudur_adi || "")}${s.created_at ? ` · ${new Date(s.created_at).toLocaleDateString("tr-TR")}` : ""}</div>
          </div>
          <span class="pill" style="${restricted ? "" : "background:var(--good-soft);color:var(--good)"}">${restricted ? "Kısıtlı" : "Tüm modüller açık"}</span>
        </div>
        <div style="margin-top:10px;font-size:12px">
          ${pending
            ? `<div style="background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px">
                 ⏳ Müdür henüz hesap oluşturmadı. Davet kodu: <strong style="font-family:ui-monospace,monospace">${esc(s.invite_code)}</strong>
                 <input readonly value="${esc(schoolInviteUrl(s.invite_code))}" style="font-size:10.5px;padding:4px;margin-top:4px" onclick="this.select()">
                 <button data-regen-school="${s.id}" style="margin-top:4px">Yeni kod</button>
               </div>`
            : `<span style="color:var(--good)">✅ Müdür hesabı bağlı</span>`}
        </div>
        <div class="chips" style="margin-top:12px">
          ${MODULES.map(m => `<span class="chip ${!restricted || s.enabled_modules.includes(m.name) ? "on" : ""}" data-mod-name="${esc(m.name)}">${esc(m.name)}</span>`).join("")}
        </div>
        <div style="margin-top:12px;display:flex;gap:10px;align-items:center">
          <button class="secondary" data-save="${s.id}">Kaydet</button>
          <span id="pa-msg-${s.id}"></span>
        </div>
      </div>
    `;
  }).join("");

  listEl.querySelectorAll(".chip").forEach(chip => {
    chip.onclick = () => chip.classList.toggle("on");
  });

  listEl.querySelectorAll("[data-regen-school]").forEach(btn => {
    btn.onclick = async () => {
      btn.disabled = true;
      await sb.from("schools").update({ invite_code: randomInviteCode() }).eq("id", btn.dataset.regenSchool);
      await renderPlatformAdmin(profile);
    };
  });

  listEl.querySelectorAll("[data-save]").forEach(btn => {
    btn.onclick = async () => {
      const schoolId = btn.dataset.save;
      const card = listEl.querySelector(`[data-school="${schoolId}"]`);
      const selected = Array.from(card.querySelectorAll(".chip.on")).map(c => c.dataset.modName);
      const allOn = selected.length === MODULES.length;
      const msgEl = document.getElementById(`pa-msg-${schoolId}`);
      btn.disabled = true;
      const { error: saveErr } = await sb.from("schools").update({ enabled_modules: allOn ? null : selected }).eq("id", schoolId);
      btn.disabled = false;
      if (saveErr) {
        msgEl.innerHTML = `<span style="color:var(--crit)">${esc(saveErr.message)}</span>`;
        return;
      }
      msgEl.innerHTML = `<span style="color:var(--good)">Kaydedildi ✓</span>`;
      const pill = card.querySelector(".pill");
      const nowRestricted = !allOn;
      pill.textContent = nowRestricted ? "Kısıtlı" : "Tüm modüller açık";
      pill.style.cssText = nowRestricted ? "" : "background:var(--good-soft);color:var(--good)";
      setTimeout(() => { if (document.body.contains(msgEl)) msgEl.innerHTML = ""; }, 2500);
    };
  });
}

async function boot() {
  app.innerHTML = "";
  const { data: { user } } = await sb.auth.getUser();
  if (!user) {
    renderAuth("login");
    return;
  }
  const { data: profile } = await sb
    .from("profiles")
    .select("*, schools(*)")
    .eq("id", user.id)
    .maybeSingle();

  if (!profile || !profile.school_id) {
    const pendingSchoolCode = localStorage.getItem("pendingSchoolCode");
    if (pendingSchoolCode) {
      const { error } = await sb.rpc("claim_school_as_mudur", { p_code: pendingSchoolCode });
      if (!error) {
        localStorage.removeItem("pendingSchoolCode");
        return boot();
      }
      renderJoinError(error.message);
      return;
    }
    const pendingCode = localStorage.getItem("pendingJoinCode");
    if (pendingCode) {
      const { error } = await sb.rpc("join_school_as_teacher", { p_code: pendingCode });
      if (!error) {
        localStorage.removeItem("pendingJoinCode");
        return boot();
      }
      renderJoinError(error.message);
      return;
    }
    renderSchoolSetup(user);
    return;
  }
  profile.email = user.email;
  if (profile.role === "ogretmen") {
    renderTeacherDashboard(profile, profile.schools);
    return;
  }
  renderDashboard(profile, profile.schools);
}

boot();
</script>
