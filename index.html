<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Okul İdare Paneli</title>
<style>
  :root {
    --ink: #211c17; --ink-soft: #4a4238; --muted: #7d7365;
    --paper: #f6f3ec; --surface: #ffffff; --surface-2: #efe9dd;
    --line: #e2dac9; --line-strong: #cdc0a4;
    --accent: #1f6b65; --accent-ink: #ffffff; --accent-soft: #dcece9;
    --good: #2f7d4f; --good-soft: #e3f1e6;
    --warn: #a5690a; --warn-soft: #f6ecd8;
    --crit: #b3402c; --crit-soft: #f8e4de;
    --shadow-sm: 0 1px 2px rgba(33,28,23,.05);
    --shadow-md: 0 1px 2px rgba(33,28,23,.06), 0 8px 24px -12px rgba(33,28,23,.18);
    --shadow-lg: 0 2px 6px rgba(33,28,23,.08), 0 20px 40px -16px rgba(33,28,23,.24);
    --shadow: var(--shadow-md);
    --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px; --radius-pill: 999px;
    --ease: cubic-bezier(.4,0,.2,1);
    --dur-fast: 140ms; --dur-normal: 200ms;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #ede7db; --ink-soft: #cdc4b3; --muted: #948a78;
      --paper: #16140f; --surface: #201c16; --surface-2: #2a2519;
      --line: #3a3323; --line-strong: #4d4530;
      --accent: #57bdb2; --accent-ink: #0d1512; --accent-soft: #1e3532;
      --good: #6fc48c; --good-soft: #1c3327;
      --warn: #e0ac4c; --warn-soft: #3a2e17;
      --crit: #e2897a; --crit-soft: #3a231e;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.25);
      --shadow-md: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
      --shadow-lg: 0 2px 6px rgba(0,0,0,.35), 0 22px 44px -16px rgba(0,0,0,.55);
      --shadow: var(--shadow-md);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink); min-height: 100vh;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 64px 24px 90px; }
  .wrap.dash { max-width: 720px; }
  .eyebrow { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin-bottom: 10px; }
  h1 { font-size: 26px; margin: 0 0 8px; letter-spacing: -.02em; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 30px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-sm); transition: box-shadow var(--dur-normal) var(--ease), border-color var(--dur-normal) var(--ease); }
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; background: var(--surface-2); border-radius: 10px; padding: 4px; }
  .tab { flex: 1; text-align: center; padding: 8px; border-radius: var(--radius-md); font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); border: none; background: none; transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease); }
  .tab.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
  .tab:hover:not(.active) { color: var(--ink-soft); }

  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin: 14px 0 6px; }
  label:first-of-type { margin-top: 0; }
  input, select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-md);
    background: var(--paper); color: var(--ink); font-size: 14px; font-family: inherit;
    transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
  }
  input:hover, select:hover { border-color: var(--line-strong); }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  :focus-visible { outline: none; }
  button:focus-visible, .tab:focus-visible, .subtab:focus-visible, .chip:focus-visible, a:focus-visible {
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  button.primary {
    margin-top: 20px; width: 100%; padding: 11px; border: none; border-radius: var(--radius-md);
    background: var(--accent); color: var(--accent-ink); font-size: 14px; font-weight: 700; cursor: pointer;
    transition: filter var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
  }
  button.primary:hover:not(:disabled) { filter: brightness(1.06); box-shadow: var(--shadow-md); }
  button.primary:active:not(:disabled) { transform: translateY(1px); filter: brightness(.97); }
  button.primary:disabled { opacity: .6; cursor: not-allowed; }
  button.link { background: none; border: none; color: var(--accent); font-size: 12.5px; cursor: pointer; padding: 0; margin-top: 14px; transition: opacity var(--dur-fast) var(--ease); }
  button.link:hover { opacity: .75; }

  .msg { font-size: 12.5px; padding: 10px 12px; border-radius: var(--radius-md); margin-top: 14px; }
  .msg.err { background: var(--crit-soft); color: var(--crit); }
  .msg.ok { background: var(--good-soft); color: var(--good); }

  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
  .who { font-size: 13px; color: var(--muted); }
  .who strong { color: var(--ink); }
  .account-line { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .account-email { color: var(--ink-faint, var(--muted)); }
  .signout { font-size: 12.5px; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: var(--radius-md); padding: 7px 12px; cursor: pointer; transition: border-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease); }
  .signout:hover { border-color: var(--line-strong); color: var(--ink); background: var(--surface-2); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .mod { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 18px; box-shadow: var(--shadow-sm); position: relative; transition: box-shadow var(--dur-normal) var(--ease), border-color var(--dur-normal) var(--ease), transform var(--dur-normal) var(--ease); }
  .mod h3 { margin: 0 0 4px; font-size: 14.5px; }
  .mod p { margin: 0; font-size: 12.5px; color: var(--muted); }
  .soon { position: absolute; top: 14px; right: 14px; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: var(--radius-pill); background: var(--warn-soft); color: var(--warn); }

  .hidden { display: none !important; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

  .wrap.wide { max-width: 860px; }
  .mod.clickable { cursor: pointer; }
  .mod.clickable:hover { border-color: var(--accent); box-shadow: var(--shadow-lg); transform: translateY(-1px); }
  .navlink { background: none; border: none; color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; padding: 0; margin-bottom: 16px; transition: opacity var(--dur-fast) var(--ease); }
  .navlink:hover { opacity: .75; }
  .subtabs { display: flex; gap: 6px; margin-bottom: 24px; }
  .subtab { padding: 7px 14px; border-radius: var(--radius-md); font-size: 12.5px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--muted); transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease); }
  .subtab.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .subtab:hover:not(.active) { border-color: var(--line-strong); color: var(--ink-soft); }
  table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.data td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.data tbody tr { transition: background var(--dur-fast) var(--ease); }
  table.data tbody tr:hover { background: var(--surface-2); }
  .pill { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: var(--radius-pill); background: var(--accent-soft); color: var(--accent); margin: 1px 2px 1px 0; }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .row-actions button { font-size: 11.5px; background: none; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 4px 8px; cursor: pointer; color: var(--muted); margin-right: 4px; transition: border-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease); }
  .row-actions button:hover { border-color: var(--line-strong); color: var(--ink); background: var(--surface-2); }
  .check-row { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
  .check-row input[type=checkbox] { width: auto; }
  .check-row label { margin: 0; font-size: 13px; font-weight: 500; color: var(--ink); }
  button.secondary { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease); }
  button.secondary:hover { border-color: var(--line-strong); background: var(--surface); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: 12px; padding: 4px 10px; border-radius: var(--radius-pill); border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--ink-soft); transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }
  .chip:hover:not(.on) { border-color: var(--line-strong); background: var(--surface-2); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .list-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .list-item:last-child { border-bottom: none; }
  .table-wrap { overflow-x: auto; }
  .date3 { display: flex; align-items: center; gap: 4px; margin-bottom: 2px; }
  .date3 input { width: auto; text-align: center; padding: 8px 2px; -moz-appearance: textfield; }
  .date3 input.d3-day, .date3 input.d3-month { width: 2.5em; }
  .date3 input.d3-year { width: 4em; }
  .date3 .d3-sep { color: var(--muted); font-size: 13px; }
  .guide-content h4 { margin: 22px 0 6px; font-size: 15px; color: var(--ink); }
  .guide-content h4:first-child { margin-top: 0; }
  .guide-content p, .guide-content ul, .guide-content ol { margin: 0 0 10px; font-size: 13.5px; color: var(--ink-soft); line-height: 1.65; }
  .guide-content ul, .guide-content ol { padding-left: 20px; }
  .guide-content li { margin-bottom: 4px; }
  .guide-content strong { color: var(--ink); }
  .faq-item { border: 1px solid var(--line); border-radius: var(--radius-md); margin-bottom: 8px; overflow: hidden; transition: border-color var(--dur-fast) var(--ease); }
  .faq-item:hover { border-color: var(--line-strong); }
  .faq-item summary { padding: 12px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; color: var(--ink); list-style: none; transition: background var(--dur-fast) var(--ease); }
  .faq-item summary:hover { background: var(--surface-2); }
  .faq-item summary::-webkit-details-marker { display: none; }
  .faq-item summary::before { content: "▸ "; color: var(--accent); }
  .faq-item[open] summary::before { content: "▾ "; }
  .faq-item .faq-answer { padding: 0 14px 14px; font-size: 13.5px; color: var(--ink-soft); line-height: 1.6; }
  .faq-cat { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 8px; }
  .faq-cat:first-child { margin-top: 0; }
</style>
</head>

<script>

  { name: "LGS Koçluk", desc: "8. sınıf öğrenci havuzu, deneme sınavı takibi, ders bazlı zayıflık analizi." },
];

function renderAuth(mode = "login") {
  const params = new URLSearchParams(location.search);
  const urlJoin = params.get("join");
  const urlOkul = params.get("okul");
  if (urlJoin) localStorage.setItem("pendingJoinCode", urlJoin.trim().toUpperCase());
  if (urlOkul) localStorage.setItem("pendingSchoolCode", urlOkul.trim().toUpperCase());
  const pendingJoin = localStorage.getItem("pendingJoinCode") || "";
  const pendingSchool = localStorage.getItem("pendingSchoolCode") || "";

  app.innerHTML = `
    <div class="wrap">
      <div class="eyebrow">Okul İdare Paneli</div>
      <h1>Hoş geldin</h1>
      <div class="subtitle">Devam etmek için giriş yap ya da ücretsiz hesap oluştur.</div>
      <div class="card">
        <div class="tabs">
          <button class="tab ${mode === "login" ? "active" : ""}" id="tab-login">Giriş yap</button>
          <button class="tab ${mode === "signup" ? "active" : ""}" id="tab-signup">Üye ol</button>
        </div>
        ${pendingSchool ? `<div class="msg ok">🏫 Okul kurma daveti (kod: ${esc(pendingSchool)}) — ${mode === "signup" ? "hesap oluşturunca" : "giriş yapınca"} otomatik olarak bu okulun müdürü olarak bağlanacaksın.</div>` : ""}
        <label>E-posta</label>
        <input id="email" type="email" autocomplete="email" placeholder="ornek@meb.gov.tr">
        <label>Şifre</label>
        <input id="password" type="password" autocomplete="${mode === "login" ? "current-password" : "new-password"}" placeholder="en az 6 karakter">
        ${mode === "signup" && !pendingSchool ? `
          <label>Öğretmen davet kodu <span style="color:var(--muted);font-weight:400">(okul idarenden aldıysan gir; boş bırakırsan yeni bir okul hesabı açılır)</span></label>
          <input id="join-code" value="${esc(pendingJoin)}" placeholder="örn. AB3K9XPZ" style="text-transform:uppercase">
        ` : (mode === "login" && pendingJoin && !pendingSchool ? `<div class="msg ok" style="margin-top:10px">Bekleyen bir öğretmen daveti var (kod: ${esc(pendingJoin)}). Giriş yaptığında otomatik tamamlanacak.</div>` : "")}
        <button class="primary" id="submit">${mode === "login" ? "Giriş yap" : "Hesap oluştur"}</button>
        <div id="msg"></div>
      </div>
    </div>
  `;
  document.getElementById("tab-login").onclick = () => renderAuth("login");
  document.getElementById("tab-signup").onclick = () => renderAuth("signup");
  document.getElementById("submit").onclick = async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const joinCodeInput = document.getElementById("join-code");
    if (joinCodeInput && joinCodeInput.value.trim()) {
      localStorage.setItem("pendingJoinCode", joinCodeInput.value.trim().toUpperCase());
    }
    const btn = document.getElementById("submit");
    const msg = document.getElementById("msg");
    msg.innerHTML = "";
    if (!email || !password) {
      msg.innerHTML = `<div class="msg err">E-posta ve şifre gerekli.</div>`;
      return;
    }
    btn.disabled = true;
    let result;
    try {
      result = mode === "login"
        ? await sb.auth.signInWithPassword({ email, password })
        : await sb.auth.signUp({ email, password });
    } catch (e) {
      btn.disabled = false;
      msg.innerHTML = `<div class="msg err">Sunucuya ulaşılamadı (${e.message}). İnternet bağlantını kontrol et; bu sayfayı bir dosya yöneticisinden değil, bir bağlantı üzerinden açtığından emin ol.</div>`;
      return;
    }
    btn.disabled = false;
    const { data, error } = result;
    if (error) {
      const tr = error.message === "Email not confirmed"
        ? "E-postana gelen onay bağlantısına tıklamadan giriş yapamazsın. Gelen kutunu (ve spam klasörünü) kontrol et."
        : error.message;
      msg.innerHTML = `<div class="msg err">${tr}</div>`;
      return;
    }
    if (mode === "signup" && !data.session) {
      msg.innerHTML = `<div class="msg ok">Hesap oluşturuldu. E-postana gelen onay bağlantısına tıkladıktan sonra giriş yapabilirsin (gelen kutunu ve spam klasörünü kontrol et).</div>`;
      return;
    }
    boot();
  };
}

function renderJoinError(message) {
  app.innerHTML = `
    <div class="wrap">
      <div class="eyebrow">Okul İdare Paneli</div>
      <h1>Davet tamamlanamadı</h1>
      <div class="card">
        <div class="msg err">${esc(message)}</div>
        <p style="color:var(--muted);font-size:13px;margin-top:10px">Okul idarenden yeni bir davet kodu iste, ya da farklı bir hesapla giriş yap.</p>
        <button class="secondary" id="join-signout" style="width:100%">Çıkış yap</button>
      </div>
    </div>
  `;
  document.getElementById("join-signout").onclick = async () => {
    localStorage.removeItem("pendingJoinCode");
    localStorage.removeItem("pendingSchoolCode");
    await sb.auth.signOut();
    boot();
  };
}

      <div class="card">

      .from("schools")
      .insert({ name, il, ilce, mudur_adi, okul_turu, created_by: user.id })

  };
}

/* ============ PERSONEL İŞLERİ (yalnızca tarayıcıda — sunucuya gönderilmez) ============ */

function personelKey(school) { return `personel_data_${school.id}`; }

function loadPersonel(school) {
  try {
    const raw = localStorage.getItem(personelKey(school));
    return raw ? JSON.parse(raw) : { staff: [], changes: [], attendance: [] };
  } catch {
    return { staff: [], changes: [], attendance: [] };
  }
}

let lastLocalStorageError = null;

function savePersonel(school, data) {
  try {
    localStorage.setItem(personelKey(school), JSON.stringify(data));
    return true;
  } catch (e) {
    lastLocalStorageError = e;
    return false;
  }
}

function localStorageSaveErrHtml() {
  const detail = lastLocalStorageError
    ? `${lastLocalStorageError.name || "Error"}: ${lastLocalStorageError.message || "(mesaj yok)"}`
    : "bilinmeyen hata (istisna nesnesi yakalanamadı)";
  return `<div class="msg err">Kaydedilemedi — tarayıcının yerel depolaması (localStorage) bu sayfada kapalı ya da dolu olabilir. Gizli/Private sekmede olabilirsin ya da tarayıcı ayarlarından site verilerine izin vermen gerekebilir.<div style="margin-top:6px;font-size:11px;font-family:ui-monospace,monospace;opacity:0.75">Teknik detay: ${esc(detail)}</div></div>`;
}

function uid() {
  return window.crypto?.randomUUID ? window.crypto.randomUUID() : String(Date.now()) + Math.random();
}

async function renderPersonelModule(profile, school) {
  if (!localStorageAvailable()) {
    app.innerHTML = `
      <div class="wrap wide">
        <button class="navlink" id="back-dash">← Panele dön</button>
        <div class="eyebrow">Personel İşleri</div>
        <h1>${esc(school.name)}</h1>
        ${localStorageBlockedNotice()}
      </div>
    `;
    document.getElementById("back-dash").onclick = () => renderDashboard(profile, school);
    return;
  }
  app.innerHTML = `
    <div class="wrap wide">
      <button class="navlink" id="back-dash">← Panele dön</button>
      <div class="eyebrow">Personel İşleri</div>
      <h1>${esc(school.name)}</h1>
      <div class="subtitle">🔒 Bu modüldeki veriler yalnızca bu tarayıcıda saklanır, sunucuya gönderilmez.</div>
      <div class="subtabs">
        <div class="subtab active" data-ptab="staff">Personel</div>
        <div class="subtab" data-ptab="changes">Maaş &amp; Terfi</div>
        <div class="subtab" data-ptab="attendance">Devam Çizelgesi</div>
      </div>
      <div id="personel-content"></div>
    </div>
  `;
  document.getElementById("back-dash").onclick = () => renderDashboard(profile, school);
  function showTab(tab) {
    document.querySelectorAll("[data-ptab]").forEach(el => el.classList.toggle("active", el.dataset.ptab === tab));
    const content = document.getElementById("personel-content");
    if (tab === "changes") renderPersonelChanges(school, content);
    else if (tab === "attendance") renderPersonelAttendance(school, content);
    else renderPersonelStaff(school, content);
  }
  document.querySelectorAll("[data-ptab]").forEach(el => el.onclick = () => showTab(el.dataset.ptab));
  showTab("staff");
}

async function renderPersonelStaff(school, content, editingId = null) {
  const data = loadPersonel(school);
  const editStaff = editingId ? data.staff.find(s => s.id === editingId) : null;
  const { data: teachers } = editStaff ? { data: [] } : await sb.from("teachers").select("id, full_name, branch").eq("school_id", school.id).order("full_name");
  content.innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">${editStaff ? "Personeli Düzenle" : "Yeni Personel Ekle"}</h3>
      ${!editStaff && teachers?.length ? `
      <label>Öğretmen listesinden doldur <span style="color:var(--muted);font-weight:400">(opsiyonel, sadece adı buraya kopyalar — bu modülün verisi yine sadece bu tarayıcıda kalır)</span></label>
      <select id="p-teacher-fill">
        <option value="">— seç —</option>
        ${teachers.map(t => `<option value="${t.id}">${esc(t.full_name)}</option>`).join("")}
      </select>
      ` : ""}
      <label>Ad Soyad</label>
      <input id="p-name" value="${editStaff ? esc(editStaff.full_name) : ""}" placeholder="Ad Soyad">
      <label>Unvan / Branş</label>
      <input id="p-title" value="${editStaff ? esc(editStaff.title || "") : ""}" placeholder="örn. Sınıf Öğretmeni, Hizmetli">
      <button class="primary" id="p-save">${editStaff ? "Güncelle" : "Ekle"}</button>
      ${editStaff ? `<button class="secondary" id="p-cancel" style="margin-top:8px;width:100%">İptal</button>` : ""}
      <div id="p-msg"></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Personel Listesi (${data.staff.length})</h3>
      <div class="table-wrap">
      <table class="data">
        <thead><tr><th>Ad</th><th>Unvan</th><th></th></tr></thead>
        <tbody>
          ${data.staff.map(s => `
            <tr>
              <td>${esc(s.full_name)}</td>
              <td>${esc(s.title || "")}</td>
              <td class="row-actions">
                <button data-edit-staff="${s.id}">Düzenle</button>
                <button data-del-staff="${s.id}">Sil</button>
              </td>
            </tr>
          `).join("") || `<tr><td colspan="3" style="color:var(--muted)">Henüz personel eklenmedi.</td></tr>`}
        </tbody>
      </table>
      </div>
    </div>
  `;
  const teacherFillSelect = document.getElementById("p-teacher-fill");
  if (teacherFillSelect) teacherFillSelect.onchange = (ev) => {
    const t = teachers.find(x => x.id === ev.target.value);
    if (!t) return;
    document.getElementById("p-name").value = t.full_name;
    if (t.branch) document.getElementById("p-title").value = t.branch;
  };
  document.getElementById("p-save").onclick = () => {
    const full_name = document.getElementById("p-name").value.trim();
    const title = document.getElementById("p-title").value.trim();
    const msg = document.getElementById("p-msg");
    if (!full_name) { msg.innerHTML = `<div class="msg err">Ad soyad gerekli.</div>`; return; }
    if (editStaff) {
      editStaff.full_name = full_name;
      editStaff.title = title;
    } else {
      data.staff.push({ id: uid(), full_name, title });
    }
    if (!savePersonel(school, data)) { msg.innerHTML = localStorageSaveErrHtml(); return; }
    renderPersonelStaff(school, content);
  };
  const cancelBtn = document.getElementById("p-cancel");
  if (cancelBtn) cancelBtn.onclick = () => renderPersonelStaff(school, content);
  content.querySelectorAll("[data-edit-staff]").forEach(b => b.onclick = () => renderPersonelStaff(school, content, b.dataset.editStaff));
  content.querySelectorAll("[data-del-staff]").forEach(b => b.onclick = () => {
    if (!confirm("Bu personeli silmek istediğine emin misin?")) return;
    data.staff = data.staff.filter(s => s.id !== b.dataset.delStaff);
    savePersonel(school, data);
    renderPersonelStaff(school, content);
  });
}

async function renderAylik(school, content, editingId = null) {
  const { data: tasks } = await sb.from("monthly_tasks").select("*").eq("school_id", school.id).order("sort_order");
  const editTask = editingId ? (tasks || []).find(t => t.id === editingId) : null;
  const byMonth = {};
  (tasks || []).forEach(t => { (byMonth[t.month] ??= []).push(t); });
  const total = (tasks || []).length;
  const done = (tasks || []).filter(t => t.is_done).length;

  const existingTitles = new Set((tasks || []).map(t => t.title));
  const missingSeedTasks = VERIFIED_MONTHLY_SEED_TASKS.filter(t => !existingTitles.has(t.title));

  content.innerHTML = `
    ${total ? `
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:16px">
        <strong style="white-space:nowrap">${done} / ${total} görev</strong>
        <div style="flex:1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden">
          <div style="height:100%;width:${total ? Math.round(done / total * 100) : 0}%;background:var(--good)"></div>
        </div>
      </div>
    </div>` : ""}

    ${missingSeedTasks.length ? `
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">Doğrulanmış örnek görevler</h3>
      <p style="color:var(--muted);font-size:12.5px">Araştırmayla doğrulanmış ${missingSeedTasks.length} görev daha var (öğretmenler kurulu, zümre toplantıları, okul aile birliği genel kurulu — resmî yönerge/yönetmelik madde numarasıyla) — eklenebilir. Yıla göre değişen tatil/sınav tarihleri gibi tek maddeyle doğrulanamayan işler bilinçli olarak dahil edilmedi, onları kendin eklemen gerekir.</p>
      <button class="secondary" id="seed-aylik-btn" style="width:100%">Bu ${missingSeedTasks.length} görevi ekle</button>
    </div>` : ""}

    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">${editTask ? "Görevi Düzenle" : "Yeni Görev Ekle"}</h3>
      <label>Ay</label>
      <select id="m-month">
        ${MONTH_ORDER.map(m => `<option value="${m}" ${editTask?.month === m ? "selected" : ""}>${MONTH_NAMES[m]}</option>`).join("")}
      </select>
      <label>Görev başlığı</label>
      <input id="m-title" value="${editTask?.title || ""}" placeholder="örn. Okul Aile Birliği genel kurulu">
      <label>Açıklama <span style="color:var(--muted);font-weight:400">(opsiyonel)</span></label>
      <textarea id="m-desc" rows="2" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-family:inherit;font-size:14px">${editTask?.description || ""}</textarea>
      <label>Resmî dayanak <span style="color:var(--muted);font-weight:400">(varsa, emin değilsen boş bırak, uydurma)</span></label>
      <input id="m-dayanak" value="${editTask?.resmi_dayanak || ""}" placeholder="örn. İlgili yönetmelik, madde numarası">
      <button class="primary" id="m-save">${editTask ? "Güncelle" : "Ekle"}</button>
      ${editTask ? `<button class="secondary" id="m-cancel" style="margin-top:8px;width:100%">İptal</button>` : ""}
      <div id="m-msg"></div>
    </div>

    ${MONTH_ORDER.filter(m => byMonth[m]?.length).map(m => `
      <div class="card" style="margin-bottom:16px">
        <h3 style="margin-top:0">${MONTH_NAMES[m]}</h3>
        ${byMonth[m].map(t => `
          <div style="padding:12px 0;border-bottom:1px solid var(--line)">
            <div style="display:flex;gap:10px;align-items:flex-start">
              <input type="checkbox" data-done="${t.id}" ${t.is_done ? "checked" : ""} style="width:auto;margin-top:3px">
              <div style="flex:1">
                <div style="font-weight:600;${t.is_done ? "text-decoration:line-through;color:var(--muted)" : ""}">${esc(t.title)}</div>
                ${t.description ? `<div style="font-size:13px;color:var(--ink-soft);margin-top:4px">${esc(t.description)}</div>` : ""}
                ${t.resmi_dayanak ? `<div style="font-size:11.5px;color:var(--accent);margin-top:4px">📖 ${esc(t.resmi_dayanak)}</div>` : ""}
              </div>
              <div class="row-actions">
                <button data-edit-task="${t.id}">Düzenle</button>
                <button data-del-task="${t.id}">Sil</button>
              </div>
            </div>
          </div>
        `).join("")}
      </div>
    `).join("") || `<p style="color:var(--muted)">Henüz görev eklenmedi.</p>`}
  `;

  const seedBtn = document.getElementById("seed-aylik-btn");
  if (seedBtn) seedBtn.onclick = async () => {
    seedBtn.disabled = true;
    const { error } = await sb.from("monthly_tasks").insert(
      missingSeedTasks.map((t, i) => ({ school_id: school.id, month: t.month, title: t.title, description: t.description, resmi_dayanak: t.resmi_dayanak, sort_order: (tasks || []).length + i }))
    );
    if (error) { seedBtn.disabled = false; alert(error.message); return; }
    await renderAylik(school, content);
  };

  document.getElementById("m-save").onclick = async () => {
    const month = parseInt(document.getElementById("m-month").value);
    const title = document.getElementById("m-title").value.trim();
    const description = document.getElementById("m-desc").value.trim() || null;
    const resmi_dayanak = document.getElementById("m-dayanak").value.trim() || null;
    const msg = document.getElementById("m-msg");
    if (!title) { msg.innerHTML = `<div class="msg err">Görev başlığı gerekli.</div>`; return; }
    if (editTask) {
      const { error } = await sb.from("monthly_tasks").update({ month, title, description, resmi_dayanak }).eq("id", editTask.id);
      if (error) { msg.innerHTML = `<div class="msg err">${error.message}</div>`; return; }
    } else {
      const { error } = await sb.from("monthly_tasks").insert({ school_id: school.id, month, title, description, resmi_dayanak, sort_order: (tasks || []).length });
      if (error) { msg.innerHTML = `<div class="msg err">${error.message}</div>`; return; }
    }
    await renderAylik(school, content);
  };

  const cancelBtn = document.getElementById("m-cancel");
  if (cancelBtn) cancelBtn.onclick = () => renderAylik(school, content);

  content.querySelectorAll("[data-done]").forEach(cb => cb.onchange = async () => {
    await sb.from("monthly_tasks").update({ is_done: cb.checked }).eq("id", cb.dataset.done);
    await renderAylik(school, content);
  });
  content.querySelectorAll("[data-edit-task]").forEach(b => b.onclick = () => renderAylik(school, content, b.dataset.editTask));
  content.querySelectorAll("[data-del-task]").forEach(b => b.onclick = async () => {
    if (!confirm("Bu görevi silmek istediğine emin misin?")) return;
    await sb.from("monthly_tasks").delete().eq("id", b.dataset.delTask);
    await renderAylik(school, content);
  });
}

/* ============ EVRAK DEPOSU ============ */

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* Üç parçalı (gg/aa/yyyy) tarih girişi — native <input type="date">'in bazı
   tarayıcılarda (özellikle Safari) gün girildikten sonra sağa otomatik geçmemesi
   ve farklı bir yılı yazmanın zor olması sorununu çözer. Görünür 3 küçük input +
   gerçek değeri tutan gizli bir input (id aynı kalıyor, mevcut okuma kodları
   değişmeden çalışır). */
function dateInputHtml(id, isoValue) {
  const [y, m, d] = String(isoValue || "").split("-");
  return `
    <div class="date3" data-date3="${esc(id)}">
      <input type="text" inputmode="numeric" maxlength="2" class="d3-day" placeholder="gg" value="${esc(d || "")}">
      <span class="d3-sep">/</span>
      <input type="text" inputmode="numeric" maxlength="2" class="d3-month" placeholder="aa" value="${esc(m || "")}">
      <span class="d3-sep">/</span>
      <input type="text" inputmode="numeric" maxlength="4" class="d3-year" placeholder="yyyy" value="${esc(y || "")}">
      <input type="hidden" id="${esc(id)}" value="${esc(isoValue || "")}">
    </div>
  `;
}

function wireDate3(id) {
  const wrap = document.querySelector(`[data-date3="${id}"]`);
  if (!wrap) return;
  const day = wrap.querySelector(".d3-day");
  const month = wrap.querySelector(".d3-month");
  const year = wrap.querySelector(".d3-year");
  const hidden = wrap.querySelector(`#${CSS.escape(id)}`);

  function sync() {
    if (day.value.length && month.value.length && year.value.length === 4) {
      hidden.value = `${year.value}-${month.value.padStart(2, "0")}-${day.value.padStart(2, "0")}`;
    } else {
      hidden.value = "";
    }
    hidden.dispatchEvent(new Event("input"));
    hidden.dispatchEvent(new Event("change"));
  }
  function digitsOnly(el) {
    el.value = el.value.replace(/\D/g, "");
  }

  day.addEventListener("input", () => { digitsOnly(day); if (day.value.length >= 2) month.focus(); sync(); });
  month.addEventListener("input", () => { digitsOnly(month); if (month.value.length >= 2) year.focus(); sync(); });
  year.addEventListener("input", () => { digitsOnly(year); sync(); });

  day.addEventListener("keydown", (e) => { if (e.key === "ArrowRight" && day.selectionStart === day.value.length) month.focus(); });
  month.addEventListener("keydown", (e) => {
    if (e.key === "Backspace" && !month.value) day.focus();
    else if (e.key === "ArrowRight" && month.selectionStart === month.value.length) year.focus();
    else if (e.key === "ArrowLeft" && month.selectionStart === 0) day.focus();
  });
  year.addEventListener("keydown", (e) => {
    if (e.key === "Backspace" && !year.value) month.focus();
    else if (e.key === "ArrowLeft" && year.selectionStart === 0) month.focus();
  });
}

function waPhone(raw) {
  let digits = String(raw ?? "").replace(/\D/g, "");
  if (!digits) return null;
  if (digits.startsWith("0")) digits = "90" + digits.slice(1);
  else if (!digits.startsWith("90")) digits = "90" + digits;
  return digits;
}

function waLink(phone, message) {
  const p = waPhone(phone);
  if (!p) return null;
  return `https://wa.me/${p}?text=${encodeURIComponent(message)}`;
}

function turkceEk(kelime, incelEk, kalinEk, kaynastirmaGerekliMi = false) {
  const s = String(kelime ?? "").trim();
  if (!s) return `'${incelEk}`;
  const unluler = "aeıioöuü";
  const kalinUnluler = "aıou";
  let sonUnlu = null;
  for (let i = s.length - 1; i >= 0; i--) {
    const c = s[i].toLocaleLowerCase("tr-TR");
    if (unluler.includes(c)) { sonUnlu = c; break; }
  }
  const ek = sonUnlu && kalinUnluler.includes(sonUnlu) ? kalinEk : incelEk;
  const sonHarf = s.slice(-1).toLocaleLowerCase("tr-TR");
  const buffer = kaynastirmaGerekliMi && unluler.includes(sonHarf) ? "y" : "";
  return `'${buffer}${ek}`;
}

function fmtDate(iso) {
  if (!iso) return "…/…/……";
  const [y, m, d] = iso.split("-");
  return `${d}.${m}.${y}`;
}

function linesToList(text) {
  return (text || "").split("\n").map(s => s.trim()).filter(Boolean).map(s => `<li>${esc(s)}</li>`).join("");
}

/**
 * Ad-soyad girdisinde soyadı büyük harfe çevirir (ad(lar) olduğu gibi kalır), Resmî
 * Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik Madde 17/2'deki "adı ilk
 * harfi büyük diğerleri küçük, soyadı ise büyük harflerle yazılır" kuralına uygun olsun diye.
 * Soyadın Türkçe alfabede doğru büyütülmesi için tr-TR locale kullanılır (i → İ gibi).
 * Basit bir sezgisel kural: son boşlukla ayrılmış kelime soyad kabul edilir — Türkçe adlarda
 * neredeyse her zaman doğrudur, kullanıcının girdiği ad kısmına dokunulmaz.
 */
function officialSignatureName(fullName) {
  const name = (fullName || "").trim();
  if (!name) return "……………………";
  const parts = name.split(/\s+/);
  const soyad = parts.pop().toLocaleUpperCase("tr-TR");
  return esc([...parts, soyad].join(" "));
}

/**
 * Resmî Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik (RG: 10/6/2020-31151)
 * hükümlerine göre: A4 sayfa, yazı alanı üst/sol/sağdan 1,5 cm boşluk (Madde 8), Times New
 * Roman 12 punto (Madde 7), başlık ortalı — T.C. / bağlı olunan mülki idare (BÜYÜK HARF) /
 * birim adı, ilk harfleri büyük diğerleri küçük (Madde 10) — okullar ilçe teşkilatı sayıldığı
 * için ikinci satır İlçe Kaymakamlığı olarak kuruldu (Madde 10/3, 5442 sayılı İl İdaresi
 * Kanunu). meta.konu verilirse Sayı/Tarih (Madde 11-12) ve Konu (Madde 13) bloğu eklenir —
 * "Sayı:" alanı bilerek boş bırakıldı: gerçek kayıt numarası ancak okulun kendi resmî

  const birimAdi = okulAdi + (/müdürlüğü\s*$/i.test(okulAdi) ? "" : " Müdürlüğü");
  const ustBlok = meta.konu ? `
    <div style="display:flex;justify-content:space-between;margin-top:22px">
      <span>Sayı: ……………………………</span>
      ${meta.tarih ? `<span>${fmtDate(meta.tarih)}</span>` : ""}
    </div>
    <div style="margin-top:4px">Konu: ${esc(meta.konu)}</div>
  ` : "";
  return `<!DOCTYPE html>
<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head>

<![endif]-->
<style>@page { size: 21cm 29.7cm; margin: 1.5cm; } body { margin: 0; }</style>

<body>

      <div style="text-align:center; margin-bottom:4px">
        <div>T.C.</div>
        ${ustIdare ? `<div style="font-weight:bold">${ustIdare}</div>` : ""}
        <div>${esc(birimAdi)}</div>
      </div>
      ${ustBlok}
      ${bodyHtml}
      <div style="margin-top:40px;border-top:1px solid #ccc;padding-top:6px;font-size:8pt;color:#666;text-align:center">
        Bu belge Okul İdare Paneli üzerinden taslak olarak oluşturulmuştur. Resmî sayı/kayıt numarası okulunuzun kendi resmî yazışma sistemi (EBYS/kurumsal kayıt) üzerinden alınmalıdır.

function renderDocForm(school, key) {

    const fullHtml = docWrapper(school, tpl.render(data, school), tpl.meta ? tpl.meta(data) : {});
    const preview = document.getElementById("doc-preview");
    preview.innerHTML = `
      <div style="border:1px solid var(--line);border-radius:8px;overflow:hidden">
        <iframe id="doc-frame" style="width:100%;height:500px;border:none;background:#fff"></iframe>

        <button class="secondary" id="doc-print" style="flex:1">Yazdır</button>
        <button class="secondary" id="doc-download" style="flex:1">Word olarak indir</button>
      </div>
    `;
    const frame = document.getElementById("doc-frame");
    frame.srcdoc = fullHtml;
    document.getElementById("doc-print").onclick = () => {
      frame.contentWindow.focus();
      frame.contentWindow.print();
    };
    document.getElementById("doc-download").onclick = () => {
      const blob = new Blob(["﻿", fullHtml], { type: "application/msword" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${tpl.title}.doc`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    };
  };
}

function kidemYili(hireDate) {
  if (!hireDate) return null;
  const hire = new Date(hireDate + "T00:00:00");
  const now = new Date();
  let years = now.getFullYear() - hire.getFullYear();
  const beforeAnniversary = (now.getMonth() < hire.getMonth()) || (now.getMonth() === hire.getMonth() && now.getDate() < hire.getDate());
  if (beforeAnniversary) years--;
  return Math.max(years, 0);
}

function kidemEsigiDoldu(t) {
  const years = kidemYili(t.hire_date);
  if (years === null) return false;
  const threshold = t.gender === "kadin" ? 20 : t.gender === "erkek" ? 25 : null;
  return threshold !== null && years >= threshold;
}

function randomInviteCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for (let i = 0; i < 8; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

  area.querySelectorAll("[data-devret]").forEach(btn => {

    document.getElementById("devret-cancel").onclick = () => renderSchedule(profile, school, period, area);

    };
  }

/**
 * Ders Dağıtım Programı'ndan öğretmenin hangi haftaiçi günlerde hiç dersi olmadığını çıkarır
 * (day_of_week: 1=Pazartesi…5=Cuma, DERS_DAYS ile aynı kural). Yalnızca ders programında EN AZ
 * BİR kaydı bulunan öğretmenler için "o gün yok" sayılır — ders programı hiç girilmemiş bir
 * öğretmen (örn. henüz atanmamış, idareci) eski davranışta kalır (her gün uygun kabul edilir);
 * aksi halde ders programını hiç kullanmayan okullarda tüm öğretmenler yanlışlıkla her günden
 * "yok" sayılırdı.
 */
function lessonDayIndex(rows) {
  const daysByTeacher = {};
  (rows || []).forEach(r => {
    if (!r.teacher_id) return;
    (daysByTeacher[r.teacher_id] ??= new Set()).add(r.day_of_week);
  });
  return {
    hasNoLessonThatDay(teacherId, dow) {
      const days = daysByTeacher[teacherId];
      return !!days && !days.has(dow);
    },
  };
}

async function suggestSubstitute(school, assignments, target) {
  const [{ data: teachers }, { data: lessonRows }] = await Promise.all([
    sb.from("teachers").select("*").eq("school_id", school.id),
    sb.from("lesson_assignments").select("teacher_id, day_of_week").eq("school_id", school.id),
  ]);
  const { data: blocked } = await sb.from("teacher_blocked_areas").select("*").in("teacher_id", (teachers || []).map(t => t.id).length ? (teachers || []).map(t => t.id) : ["00000000-0000-0000-0000-000000000000"]);
  const blockedByTeacher = {};
  (blocked || []).forEach(b => { (blockedByTeacher[b.teacher_id] ??= new Set()).add(b.duty_area_id); });
  const availability = lessonDayIndex(lessonRows);
  const targetDow = new Date(target.duty_date + "T00:00:00").getDay();

  function isExempt(t, date) {
    if (t.pregnancy_exempt_until && date <= t.pregnancy_exempt_until) return true;
    if (t.disability_exempt && !t.disability_wants_duty) return true;
    if (t.seniority_waiver_requested) return true;
    return false;
  }

  const countByTeacher = {};
  const weekCountByTeacher = {};
  const dayAssignedTeacher = {};
  (assignments || []).forEach(a => {
    if (!a.teacher_id || a.id === target.id) return;
    countByTeacher[a.teacher_id] = (countByTeacher[a.teacher_id] || 0) + 1;
    const wk = a.teacher_id + "|" + weekKeyOf(a.duty_date);
    weekCountByTeacher[wk] = (weekCountByTeacher[wk] || 0) + 1;
    (dayAssignedTeacher[a.duty_date] ??= new Set()).add(a.teacher_id);
  });

  const pool = (teachers || []).filter(t => {
    if (t.id === target.teacher_id) return false;
    if (isExempt(t, target.duty_date)) return false;
    if (blockedByTeacher[t.id]?.has(target.duty_area_id)) return false;
    if (availability.hasNoLessonThatDay(t.id, targetDow)) return false;
    const wk = weekCountByTeacher[t.id + "|" + weekKeyOf(target.duty_date)] || 0;
    if (wk >= (t.weekly_duty_quota || 2)) return false;
    return true;
  });
  const notWorkingThatDay = pool.filter(t => !(dayAssignedTeacher[target.duty_date]?.has(t.id)));
  const candidates = notWorkingThatDay.length ? notWorkingThatDay : pool;

  const ranked = candidates
    .map(t => ({ id: t.id, full_name: t.full_name, count: countByTeacher[t.id] || 0 }))
    .sort((a, b) => a.count - b.count);

  return { top: ranked[0] || null, pool: ranked };
}

function toLocalISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function weekKeyOf(dateStr) {
  const dt = new Date(dateStr + "T00:00:00");
  const day = dt.getDay() || 7;
  const monday = new Date(dt);
  monday.setDate(dt.getDate() - day + 1);
  return toLocalISO(monday);
}

async function generateSchedule(school, period) {
  await sb.from("duty_assignments").delete().eq("duty_period_id", period.id).eq("is_pinned", false);

  const [{ data: teachers }, { data: slots }, { data: areas }, { data: existing }, { data: lessonRows }] = await Promise.all([
    sb.from("teachers").select("*").eq("school_id", school.id),
    sb.from("duty_time_slots").select("*").eq("school_id", school.id).order("sort_order"),
    sb.from("duty_areas").select("*").eq("school_id", school.id).order("sort_order"),
    sb.from("duty_assignments").select("*").eq("duty_period_id", period.id),
    sb.from("lesson_assignments").select("teacher_id, day_of_week").eq("school_id", school.id),
  ]);
  const { data: blocked } = await sb.from("teacher_blocked_areas").select("*").in("teacher_id", (teachers || []).map(t => t.id).length ? (teachers || []).map(t => t.id) : ["00000000-0000-0000-0000-000000000000"]);

  if (!teachers?.length) throw new Error("Önce Öğretmenler sekmesinden en az bir öğretmen ekle.");
  if (!slots?.length) throw new Error("Önce Ayarlar sekmesinden en az bir zaman dilimi ekle.");
  if (!areas?.length) throw new Error("Önce Ayarlar sekmesinden en az bir alan ekle.");

  const blockedByTeacher = {};
  (blocked || []).forEach(b => { (blockedByTeacher[b.teacher_id] ??= new Set()).add(b.duty_area_id); });
  const availability = lessonDayIndex(lessonRows);

  const pinned = (existing || []).filter(a => a.is_pinned);
  const pinnedKeys = new Set(pinned.map(a => `${a.duty_date}|${a.time_slot_id}|${a.duty_area_id}`));

  function isExempt(t, date) {
    if (t.pregnancy_exempt_until && date <= t.pregnancy_exempt_until) return true;
    if (t.disability_exempt && !t.disability_wants_duty) return true;
    if (t.seniority_waiver_requested) return true;
    return false;
  }

  const holidaySet = new Set(period.holiday_dates || []);
  const days = [];
  const dowByDate = {};
  let d = new Date(period.starts_on + "T00:00:00");
  const end = new Date(period.ends_on + "T00:00:00");
  while (d <= end) {
    const iso = toLocalISO(d);
    const dow = d.getDay();
    if (dow !== 0 && dow !== 6 && !holidaySet.has(iso)) { days.push(iso); dowByDate[iso] = dow; }
    d.setDate(d.getDate() + 1);
  }

  const countByTeacher = {};
  teachers.forEach(t => countByTeacher[t.id] = 0);
  const weekCountByTeacher = {};
  const dayAssignedTeacher = {};
  pinned.forEach(a => {
    if (!a.teacher_id) return;
    countByTeacher[a.teacher_id] = (countByTeacher[a.teacher_id] || 0) + 1;
    const wk = a.teacher_id + "|" + weekKeyOf(a.duty_date);
    weekCountByTeacher[wk] = (weekCountByTeacher[wk] || 0) + 1;
    (dayAssignedTeacher[a.duty_date] ??= new Set()).add(a.teacher_id);
  });

  const newRows = [];
  const unfilledByDate = {};
  for (const date of days) {
    const dow = dowByDate[date];
    for (const slot of slots) {
      for (const ar of areas) {
        const key = `${date}|${slot.id}|${ar.id}`;
        if (pinnedKeys.has(key)) continue;

        let pool = teachers.filter(t => {
          if (isExempt(t, date)) return false;
          if (blockedByTeacher[t.id]?.has(ar.id)) return false;
          if (availability.hasNoLessonThatDay(t.id, dow)) return false;
          const wk = weekCountByTeacher[t.id + "|" + weekKeyOf(date)] || 0;
          if (wk >= (t.weekly_duty_quota || 2)) return false;
          return true;
        });
        const notWorkingToday = pool.filter(t => !(dayAssignedTeacher[date]?.has(t.id)));
        const candidates = notWorkingToday.length ? notWorkingToday : pool;
        if (!candidates.length) { unfilledByDate[date] = (unfilledByDate[date] || 0) + 1; continue; }

        candidates.sort((a, b) => (countByTeacher[a.id] || 0) - (countByTeacher[b.id] || 0));
        const chosen = candidates[0];

        newRows.push({ duty_period_id: period.id, teacher_id: chosen.id, duty_date: date, area: ar.label, duty_area_id: ar.id, time_slot_id: slot.id, is_pinned: false });
        countByTeacher[chosen.id] = (countByTeacher[chosen.id] || 0) + 1;
        const wk = chosen.id + "|" + weekKeyOf(date);
        weekCountByTeacher[wk] = (weekCountByTeacher[wk] || 0) + 1;
        (dayAssignedTeacher[date] ??= new Set()).add(chosen.id);
      }
    }
  }

  if (newRows.length) {
    const { error } = await sb.from("duty_assignments").insert(newRows);
    if (error) throw error;
  }
  const totalSlots = days.length * slots.length * areas.length;
  const totalUnfilled = Object.values(unfilledByDate).reduce((s, n) => s + n, 0);
  const fullyEmptyDays = days.filter(d => (unfilledByDate[d] || 0) === slots.length * areas.length && !pinned.some(p => p.duty_date === d));
  return { created: newRows.length, totalSlots, totalUnfilled, unfilledByDate, fullyEmptyDays };
}

/**
 * İdareci (müdür yardımcısı) nöbeti — öğretmen nöbet havuzundan bağımsız, adalet algoritması
 * uygulanmaz. Mevzuatta birden fazla müdür yardımcısı arasında paylaşıma dair açık hüküm yok;
 * müdür kime hangi tarih aralığını (gün gün ya da haftalık) vereceğine kendi takdirinde karar
 * verir — bu yüzden burada sadece esnek bir tarih aralığı + idareci ataması (serbest CRUD) var,
 * otomatik dağıtım yok.
 */
async function renderIdareciNobeti(profile, school, content, editingId = null) {
  const [{ data: idareciler }, { data: assignments }] = await Promise.all([
    sb.from("teachers").select("*").eq("school_id", school.id).eq("is_idareci", true).order("full_name"),
    sb.from("idareci_duty_assignments").select("*, teachers(full_name, phone)").eq("school_id", school.id).order("starts_on", { ascending: false }),
  ]);

  if (!idareciler?.length) {
    content.innerHTML = `<p style="color:var(--muted)">Henüz "Müdür yardımcısı (idareci)" olarak işaretlenmiş bir öğretmen yok — Öğretmenler sekmesinden bir öğretmeni idareci olarak işaretle.</p>`;
    return;
  }

  const editAssign = editingId ? (assignments || []).find(a => a.id === editingId) : null;
  const summary = {};
  (assignments || []).forEach(a => {
    const name = a.teachers?.full_name || "?";
    const days = Math.round((new Date(a.ends_on) - new Date(a.starts_on)) / 86400000) + 1;
    summary[name] = (summary[name] || 0) + days;
  });

  content.innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">${editAssign ? "Nöbeti Düzenle" : "Yeni İdareci Nöbeti"}</h3>
      <p style="color:var(--muted);font-size:12.5px;margin-top:-4px">Mevzuatta müdür yardımcıları arasında paylaşıma dair açık hüküm yok — kim hangi tarihte nöbetçi olacağına idare karar verir. Tek gün için başlangıç/bitişi aynı seç, hafta için bir hafta aralığı gir.</p>
      <label>İdareci</label>
      <select id="i-teacher">${idareciler.map(t => `<option value="${t.id}" ${editAssign?.teacher_id === t.id ? "selected" : ""}>${esc(t.full_name)}</option>`).join("")}</select>
      <label>Başlangıç</label>
      ${dateInputHtml("i-start", editAssign?.starts_on || "")}
      <label>Bitiş</label>
      ${dateInputHtml("i-end", editAssign?.ends_on || "")}
      <label>Not <span style="color:var(--muted);font-weight:400">(opsiyonel)</span></label>
      <input id="i-note" value="${editAssign ? esc(editAssign.note || "") : ""}" placeholder="örn. izinli idareci yerine">
      <button class="primary" id="i-save">${editAssign ? "Güncelle" : "Ekle"}</button>
      ${editAssign ? `<button class="secondary" id="i-cancel" style="margin-top:8px;width:100%">İptal</button>` : ""}
      <div id="i-msg"></div>
    </div>
    ${Object.keys(summary).length ? `
      <div class="card" style="margin-bottom:16px">
        <h3 style="margin-top:0">Kim Kaç Gün İdareci Nöbeti Tuttu</h3>
        ${Object.entries(summary).sort((a, b) => b[1] - a[1]).map(([name, days]) => `<div class="list-item"><span>${esc(name)}</span><strong>${days} gün</strong></div>`).join("")}
      </div>
    ` : ""}
    <div class="card">
      <h3 style="margin-top:0">Nöbet Kayıtları</h3>
      <div class="table-wrap">
      <table class="data">
        <thead><tr><th>Tarih Aralığı</th><th>İdareci</th><th>Not</th><th></th></tr></thead>
        <tbody>
          ${(assignments || []).map(a => {
            const single = a.starts_on === a.ends_on;
            const range = single ? fmtDate(a.starts_on) : `${fmtDate(a.starts_on)} — ${fmtDate(a.ends_on)}`;
            const message = `Merhaba ${a.teachers?.full_name || ""}, ${range} tarihleri arasında idareci nöbetçisisiniz.${a.note ? `\nNot: ${a.note}` : ""}\n\nİyi çalışmalar.\n${school.name}`;
            const link = waLink(a.teachers?.phone, message);
            return `
            <tr>
              <td>${esc(range)}</td>
              <td>${esc(a.teachers?.full_name || "(silinmiş öğretmen)")}</td>
              <td>${esc(a.note || "")}</td>
              <td class="row-actions">
                ${link ? `<a href="${link}" target="_blank" rel="noopener">📲</a>` : ""}
                <button data-edit-idareci="${a.id}">Düzenle</button>
                <button data-del-idareci="${a.id}">Sil</button>
              </td>
            </tr>
          `;
          }).join("") || `<tr><td colspan="4" style="color:var(--muted)">Henüz kayıt eklenmedi.</td></tr>`}
        </tbody>
      </table>
      </div>
    </div>
  `;

  wireDate3("i-start");
  wireDate3("i-end");
  document.getElementById("i-save").onclick = async () => {
    const teacher_id = document.getElementById("i-teacher").value;
    const starts_on = document.getElementById("i-start").value;
    const ends_on = document.getElementById("i-end").value;
    const note = document.getElementById("i-note").value.trim() || null;
    const msg = document.getElementById("i-msg");
    if (!starts_on || !ends_on) { msg.innerHTML = `<div class="msg err">Başlangıç ve bitiş tarihi gerekli.</div>`; return; }
    if (ends_on < starts_on) { msg.innerHTML = `<div class="msg err">Bitiş, başlangıçtan önce olamaz.</div>`; return; }
    if (editAssign) {
      const { error } = await sb.from("idareci_duty_assignments").update({ teacher_id, starts_on, ends_on, note }).eq("id", editAssign.id);
      if (error) { msg.innerHTML = `<div class="msg err">${error.message}</div>`; return; }
    } else {
      const { error } = await sb.from("idareci_duty_assignments").insert({ school_id: school.id, teacher_id, starts_on, ends_on, note });
      if (error) { msg.innerHTML = `<div class="msg err">${error.message}</div>`; return; }
    }
    await renderIdareciNobeti(profile, school, content);
  };
  const cancelBtn = document.getElementById("i-cancel");
  if (cancelBtn) cancelBtn.onclick = () => renderIdareciNobeti(profile, school, content);
  content.querySelectorAll("[data-edit-idareci]").forEach(b => b.onclick = () => renderIdareciNobeti(profile, school, content, b.dataset.editIdareci));
  content.querySelectorAll("[data-del-idareci]").forEach(b => b.onclick = async () => {
    if (!confirm("Bu nöbet kaydını silmek istediğine emin misin?")) return;
    await sb.from("idareci_duty_assignments").delete().eq("id", b.dataset.delIdareci);
    await renderIdareciNobeti(profile, school, content);
  });
}

async function renderMevzuat(school, content) {
  const { count: totalCount } = await sb.from("checklist_items").select("id", { count: "exact", head: true }).eq("school_id", school.id);
  const { count: totalTasks } = await sb.from("monthly_tasks").select("id", { count: "exact", head: true }).eq("school_id", school.id);
  const hasCorpus = (totalCount || 0) + (totalTasks || 0) > 0;

  content.innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <label>Ara</label>
      <input id="mv-q" placeholder="örn. hamilelik, kıdem, tahliye tatbikatı, devir teslim">
    </div>
    <div id="mv-results"></div>
  `;

  const resultsEl = document.getElementById("mv-results");
  if (!hasCorpus) {
    resultsEl.innerHTML = `<p style="color:var(--muted)">Henüz aranacak madde yok — önce Teftişe Hazırlık ya da Aylık Yönetim Akışı'na madde/görev ekle.</p>`;
  }

  let debounceTimer = null;
  async function runSearch(q) {
    const query = q.trim();
    if (!query) { resultsEl.innerHTML = hasCorpus ? "" : resultsEl.innerHTML; return; }
    resultsEl.innerHTML = `<p style="color:var(--muted)">Aranıyor…</p>`;
    const { data, error } = await sb.rpc("search_mevzuat", { p_query: query });
    if (error) {
      resultsEl.innerHTML = `<div class="msg err">${esc(error.message)}</div>`;
      return;
    }
    resultsEl.innerHTML = (data && data.length)
      ? data.map(r => `
        <div class="card" style="margin-bottom:10px">
          <span class="pill">${esc(r.source)}</span> ${r.category ? `<span class="pill">${esc(r.category)}</span>` : ""}
          <div style="margin-top:8px;font-weight:600">${esc(r.content)}</div>
          ${r.dayanak ? `<div style="font-size:11.5px;color:var(--accent);margin-top:6px">📖 ${esc(r.dayanak)}</div>` : ""}
          ${r.note ? `<div style="font-size:12px;color:var(--muted);margin-top:4px">💡 ${esc(r.note)}</div>` : ""}
        </div>
      `).join("")
      : `<p style="color:var(--muted)">Eşleşme bulunamadı. Bu, elimizde bu konuda doğrulanmış bir kayıt olmadığı anlamına gelir — uydurmak yerine boş sonuç gösteriyoruz. Teftişe Hazırlık/Aylık Yönetim Akışı'na doğrulanmış kaynakla eklemeyi düşün.</p>`;
  }

  document.getElementById("mv-q").oninput = (e) => {
    clearTimeout(debounceTimer);
    const q = e.target.value;
    debounceTimer = setTimeout(() => runSearch(q), 250);
  };
}

async function renderDersModule(profile, school, tab) {
  app.innerHTML = dersHeader(school, tab);
  document.getElementById("back-dash").onclick = () => renderDashboard(profile, school);
  document.querySelectorAll("[data-tab]").forEach(el => {
    el.onclick = () => renderDersModule(profile, school, el.dataset.tab);
  });
  const content = document.getElementById("ders-content");
  content.innerHTML = `<div class="card">Yükleniyor…</div>`;

}

/**
 * İki fazlı çizelgeleme motoru:
 * Faz 1 — yapılandırma: en yüklü öğretmenden başlayarak, çoklu yumuşak-kısıt skoruna göre
 *   en iyi uygun hücreye greedy yerleştirme (kısıt-yoğunluğu sıralı sezgisel).
 * Faz 2 — simulated annealing: sabitlenmemiş atamalar üzerinde move/swap komşuluklarıyla
 *   yerel arama, toplam ceza (öğretmen boşlukları + aynı gün ders tekrarı + sınıf günlük
 *   yük dengesizliği + ağır ders/sabah tercihi) minimize edilene kadar iyileştirme.
 * Sert kısıtlar (öğretmen/sınıf çakışması, günlük tekrar sınırı) her iki fazda da asla ihlal edilmez.
 */
function generateLessonSchedule(school, { classes, subjects, periods, hours, existing, teachers }) {
  const days = DERS_DAYS;
  const subjectById = Object.fromEntries(subjects.map(s => [s.id, s]));
  const periodSortByIdx = {};
  periods.forEach((p, idx) => periodSortByIdx[p.id] = idx);

  const classOccupied = {};
  const teacherOccupied = {};
  const classDaySubjectCount = {};
  const classDayCount = {};
  const teacherDayPeriods = {};
  const placed = [];
  const unplaced = [];

  function markOccupied(class_id, teacher_id, day, period_id, subject_id) {
    classOccupied[`${class_id}|${day}|${period_id}`] = true;
    teacherOccupied[`${teacher_id}|${day}|${period_id}`] = true;
    classDaySubjectCount[`${class_id}|${day}|${subject_id}`] = (classDaySubjectCount[`${class_id}|${day}|${subject_id}`] || 0) + 1;
    classDayCount[`${class_id}|${day}`] = (classDayCount[`${class_id}|${day}`] || 0) + 1;
    (teacherDayPeriods[`${teacher_id}|${day}`] ??= new Set()).add(periodSortByIdx[period_id]);
  }

  (existing || []).filter(a => a.is_pinned).forEach(a => {
    markOccupied(a.class_id, a.teacher_id, a.day_of_week, a.period_id, a.subject_id);
    placed.push({ class_id: a.class_id, subject_id: a.subject_id, teacher_id: a.teacher_id, day_of_week: a.day_of_week, period_id: a.period_id, is_pinned: true, id: a.id });
  });

  const pinnedCountByReq = {};
  (existing || []).filter(a => a.is_pinned).forEach(a => {
    const key = `${a.class_id}|${a.subject_id}|${a.teacher_id}`;
    pinnedCountByReq[key] = (pinnedCountByReq[key] || 0) + 1;
  });

  let units = [];
  hours.forEach(h => {
    const key = `${h.class_id}|${h.subject_id}|${h.teacher_id}`;
    const remaining = Math.max(h.weekly_hours - (pinnedCountByReq[key] || 0), 0);
    for (let i = 0; i < remaining; i++) units.push({ class_id: h.class_id, subject_id: h.subject_id, teacher_id: h.teacher_id });
  });

  const teacherLoad = {};
  units.forEach(u => teacherLoad[u.teacher_id] = (teacherLoad[u.teacher_id] || 0) + 1);
  units = units
    .map(u => ({ u, r: Math.random() }))
    .sort((a, b) => (teacherLoad[b.u.teacher_id] - teacherLoad[a.u.teacher_id]) || (a.r - b.r))
    .map(x => x.u);

  function candidateScore(class_id, teacher_id, subject_id, day, period_id) {
    let score = 0;
    const subj = subjectById[subject_id];
    const pIdx = periodSortByIdx[period_id];
    if (subj?.is_heavy) score += pIdx * 3;
    score += (classDaySubjectCount[`${class_id}|${day}|${subject_id}`] || 0) * 8;
    score += (classDayCount[`${class_id}|${day}`] || 0) * 2;
    const existingPeriods = teacherDayPeriods[`${teacher_id}|${day}`];
    if (existingPeriods && existingPeriods.size) {
      const minDist = Math.min(...[...existingPeriods].map(idx => Math.abs(idx - pIdx)));
      if (minDist > 1) score += minDist * 4;
    }
    return score;
  }

  for (const u of units) {
    let best = null, bestScore = Infinity;
    for (const day of days) {
      if ((classDaySubjectCount[`${u.class_id}|${day}|${u.subject_id}`] || 0) >= DERS_MAX_PER_DAY) continue;
      for (const p of periods) {
        if (classOccupied[`${u.class_id}|${day}|${p.id}`] || teacherOccupied[`${u.teacher_id}|${day}|${p.id}`]) continue;
        const s = candidateScore(u.class_id, u.teacher_id, u.subject_id, day, p.id);
        if (s < bestScore) { bestScore = s; best = { day, period_id: p.id }; }
      }
    }
    if (best) {
      markOccupied(u.class_id, u.teacher_id, best.day, best.period_id, u.subject_id);
      placed.push({ class_id: u.class_id, subject_id: u.subject_id, teacher_id: u.teacher_id, day_of_week: best.day, period_id: best.period_id, is_pinned: false });
    } else {
      unplaced.push(u);
    }
  }

  function fullPenalty(schedule) {
    let penalty = 0;
    const perTeacherDay = {}, perClassDaySubject = {}, perClassDay = {};
    schedule.forEach(a => {
      const pIdx = periodSortByIdx[a.period_id];
      (perTeacherDay[`${a.teacher_id}|${a.day_of_week}`] ??= []).push(pIdx);
      const csKey = `${a.class_id}|${a.day_of_week}|${a.subject_id}`;
      perClassDaySubject[csKey] = (perClassDaySubject[csKey] || 0) + 1;
      const cdKey = `${a.class_id}|${a.day_of_week}`;
      perClassDay[cdKey] = (perClassDay[cdKey] || 0) + 1;
      if (subjectById[a.subject_id]?.is_heavy) penalty += pIdx * 3;
    });
    Object.values(perTeacherDay).forEach(arr => {
      arr.sort((a, b) => a - b);
      for (let i = 1; i < arr.length; i++) penalty += (arr[i] - arr[i - 1] - 1) * 4;
    });
    Object.values(perClassDaySubject).forEach(c => { if (c > 1) penalty += (c - 1) * 8; });
    const classIds = [...new Set(schedule.map(a => a.class_id))];
    classIds.forEach(cid => {
      const counts = days.map(d => perClassDay[`${cid}|${d}`] || 0);
      const mean = counts.reduce((s, c) => s + c, 0) / days.length;
      const variance = counts.reduce((s, c) => s + (c - mean) ** 2, 0) / days.length;
      penalty += variance * 2;
    });
    return penalty;
  }

  const movable = placed.filter(a => !a.is_pinned);
  if (movable.length > 1) {
    let current = placed.slice();
    let currentPenalty = fullPenalty(current);
    let best = current.slice();
    let bestPenalty = currentPenalty;
    let temperature = 10;
    const iterations = Math.min(4000, movable.length * 60);
    const cooling = 0.997;

    function isFree(schedule, class_id, teacher_id, day, period_id, excludeIdx) {
      for (let i = 0; i < schedule.length; i++) {
        if (i === excludeIdx) continue;
        const a = schedule[i];
        if (a.day_of_week !== day || a.period_id !== period_id) continue;
        if (a.class_id === class_id || a.teacher_id === teacher_id) return false;
      }
      return true;
    }

    for (let iter = 0; iter < iterations; iter++) {
      const movableIdxs = current.map((a, i) => a.is_pinned ? -1 : i).filter(i => i >= 0);
      if (!movableIdxs.length) break;
      const i = movableIdxs[Math.floor(Math.random() * movableIdxs.length)];
      const a = current[i];
      let candidate = current.slice();
      let valid = false;

      if (Math.random() < 0.5) {
        const day = days[Math.floor(Math.random() * days.length)];
        const p = periods[Math.floor(Math.random() * periods.length)];
        if (isFree(current, a.class_id, a.teacher_id, day, p.id, i)) {
          const csCount = current.filter((x, xi) => xi !== i && x.class_id === a.class_id && x.day_of_week === day && x.subject_id === a.subject_id).length;
          if (csCount < DERS_MAX_PER_DAY) {
            candidate[i] = { ...a, day_of_week: day, period_id: p.id };
            valid = true;
          }
        }
      } else {
        const j = movableIdxs[Math.floor(Math.random() * movableIdxs.length)];
        if (j !== i) {
          const b = current[j];
          const aNew = { ...a, day_of_week: b.day_of_week, period_id: b.period_id };
          const bNew = { ...b, day_of_week: a.day_of_week, period_id: a.period_id };
          const others = current.filter((_, idx) => idx !== i && idx !== j);
          const aOk = !others.some(x => x.day_of_week === aNew.day_of_week && x.period_id === aNew.period_id && (x.class_id === aNew.class_id || x.teacher_id === aNew.teacher_id));
          const bOk = !others.some(x => x.day_of_week === bNew.day_of_week && x.period_id === bNew.period_id && (x.class_id === bNew.class_id || x.teacher_id === bNew.teacher_id));
          const aCs = others.filter(x => x.class_id === aNew.class_id && x.day_of_week === aNew.day_of_week && x.subject_id === aNew.subject_id).length;
          const bCs = others.filter(x => x.class_id === bNew.class_id && x.day_of_week === bNew.day_of_week && x.subject_id === bNew.subject_id).length;
          if (aOk && bOk && aCs < DERS_MAX_PER_DAY && bCs < DERS_MAX_PER_DAY) {
            candidate[i] = aNew;
            candidate[j] = bNew;
            valid = true;
          }
        }
      }

      if (!valid) { temperature *= cooling; continue; }

      const candidatePenalty = fullPenalty(candidate);
      const delta = candidatePenalty - currentPenalty;
      if (delta < 0 || Math.random() < Math.exp(-delta / Math.max(temperature, 0.01))) {
        current = candidate;
        currentPenalty = candidatePenalty;
        if (currentPenalty < bestPenalty) { best = current.slice(); bestPenalty = currentPenalty; }
      }
      temperature *= cooling;
    }
    return { placed: best, unplaced, score: Math.round(bestPenalty * 10) / 10 };
  }

  return { placed, unplaced, score: Math.round(fullPenalty(placed) * 10) / 10 };
}

async function renderDersProgram(profile, school, content, viewMode = "sinif", genResult = null) {
  const [{ data: classes }, { data: subjects }, { data: periods }, { data: hours }, { data: teachers }, { data: existing }] = await Promise.all([
    sb.from("classes").select("*").eq("school_id", school.id).order("sort_order"),
    sb.from("subjects").select("*").eq("school_id", school.id).order("sort_order"),
    sb.from("lesson_periods").select("*").eq("school_id", school.id).order("sort_order"),
    sb.from("class_subject_hours").select("*").eq("school_id", school.id),
    sb.from("teachers").select("*").eq("school_id", school.id),
    sb.from("lesson_assignments").select("*").eq("school_id", school.id),
  ]);

  if (!classes?.length || !periods?.length || !hours?.length) {
    content.innerHTML = `<p style="color:var(--muted)">Program oluşturmadan önce Ayarlar'dan sınıf/ders saati ekle ve Atamalar'dan haftalık saatleri tanımla.</p>`;
    return;
  }

  const teacherById = Object.fromEntries((teachers || []).map(t => [t.id, t]));
  const subjectById = Object.fromEntries((subjects || []).map(s => [s.id, s]));
  const classById = Object.fromEntries(classes.map(c => [c.id, c]));
  const totalNeeded = hours.reduce((s, h) => s + h.weekly_hours, 0);

  const warningHtml = genResult && genResult.unplaced.length ? `
    <div class="card" style="margin-bottom:16px;border-color:var(--warn)">

    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">

          <p style="color:var(--muted);font-size:12.5px;margin:4px 0 0">${totalNeeded} saat/hafta talep · ${(existing || []).length} saat yerleştirilmiş${genResult ? ` · optimizasyon skoru: ${genResult.score} (düşük daha iyi)` : ""}</p>
        </div>
        <button class="primary" id="gen-ders-btn" style="margin:0;width:auto;padding:10px 18px">${existing?.length ? "Yeniden Oluştur" : "Program Oluştur"}</button>
      </div>
      <p style="color:var(--muted);font-size:11.5px;margin:6px 0 0">Yeniden oluşturma, sabitlenmiş dersleri korur. Optimizasyon: yapılandırma + simulated annealing yerel arama.</p>
      <div id="gen-ders-msg"></div>
    </div>
    ${existing?.length ? `
      <div class="subtabs" style="margin-bottom:16px">
        <div class="subtab ${viewMode === "sinif" ? "active" : ""}" data-view="sinif">Sınıf Bazlı</div>
        <div class="subtab ${viewMode === "ogretmen" ? "active" : ""}" data-view="ogretmen">Öğretmen Bazlı</div>
      </div>
      ${viewMode === "ogretmen" ? ogretmenHtml : sinifHtml}
    ` : `<p style="color:var(--muted)">Henüz program oluşturulmadı.</p>`}
  `;

  content.querySelectorAll("[data-view]").forEach(el => el.onclick = () => renderDersProgram(profile, school, content, el.dataset.view, genResult));

  content.querySelectorAll("[data-toggle-pin]").forEach(btn => btn.onclick = async () => {
    const id = btn.dataset.togglePin;
    const current = (existing || []).find(a => a.id === id);
    await sb.from("lesson_assignments").update({ is_pinned: !current?.is_pinned }).eq("id", id);
    await renderDersProgram(profile, school, content, viewMode, genResult);
  });

  document.getElementById("gen-ders-btn").onclick = async () => {
    const btn = document.getElementById("gen-ders-btn");
    const msg = document.getElementById("gen-ders-msg");
    btn.disabled = true;
    msg.innerHTML = `<div class="msg ok">Program oluşturuluyor (optimizasyon çalışıyor)…</div>`;
    await new Promise(r => setTimeout(r, 30));
    let result = null;
    try {
      await sb.from("lesson_assignments").delete().eq("school_id", school.id).eq("is_pinned", false);
      const { data: freshExisting } = await sb.from("lesson_assignments").select("*").eq("school_id", school.id);
      result = generateLessonSchedule(school, { classes, subjects, periods, hours, existing: freshExisting, teachers: teachers || [] });
      const toInsert = result.placed.filter(p => !p.is_pinned).map(p => ({
        school_id: school.id, class_id: p.class_id, subject_id: p.subject_id, teacher_id: p.teacher_id,
        day_of_week: p.day_of_week, period_id: p.period_id, is_pinned: false,
      }));
      if (toInsert.length) {
        const { error } = await sb.from("lesson_assignments").insert(toInsert);
        if (error) throw error;
      }
    } catch (e) {
      msg.innerHTML = `<div class="msg err">${e.message}</div>`;
      btn.disabled = false;
      return;
    }
    btn.disabled = false;
    await renderDersProgram(profile, school, content, viewMode, result);
  };
}

/* ============ SINAV KELEBEK (yalnızca tarayıcıda — öğrenci isimleri kişisel veri) ============ */

function kelebekKey(school) { return `kelebek_data_${school.id}`; }

function loadKelebek(school) {
  try {
    const raw = localStorage.getItem(kelebekKey(school));
    return raw ? JSON.parse(raw) : { exams: [] };
  } catch {
    return { exams: [] };
  }
}

function saveKelebek(school, data) {
  try {
    localStorage.setItem(kelebekKey(school), JSON.stringify(data));
    return true;
  } catch (e) {
    lastLocalStorageError = e;
    return false;
  }
}

function splitLines(text) {
  return (text || "").split("\n").map(s => s.trim()).filter(Boolean);
}

function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/**
 * Kelebek oturma düzeni: aynı gruptan (sınıf/şube) öğrenciler yatayda/dikeyde bitişik
 * oturmasın. Grupları round-robin iç içe geçirip yılan (snake) sırayla yerleştirir, sonra
 * kalan bitişik ihlallerini rastgele takas ile onarır (onarım sadece ihlali azaltıyorsa kalıcı
 * olur). Tam çözüm imkansızsa (bir grup diğerlerine göre aşırı kalabalıksa) kalan ihlaller
 * sessizce gizlenmez, açıkça raporlanır.
 */
function generateKelebekSeating(groups, rows, cols) {
  const totalSeats = rows * cols;
  const totalStudents = groups.reduce((s, g) => s + g.students.length, 0);
  if (totalStudents > totalSeats) {
    throw new Error(`${totalStudents} öğrenci için sadece ${totalSeats} sıra var — sıra/sütun sayısını artır ya da öğrenci sayısını azalt.`);
  }

  // 8 yönlü (çapraz dahil) komşulukta bir grup, kendi içinde hiç bitişik olmadan en fazla
  // ⌈satır/2⌉×⌈sütun/2⌉ üyeye sahip olabilir (grid'i 2×2 bloklara ayırınca her blokta en fazla
  // 1 üye kalabilir, çünkü bir bloktaki 4 hücre birbirine kral-hamlesiyle komşudur). Bu matematiksel
  // bir üst sınır — aşılırsa hiçbir algoritma sıfır ihlal üretemez, önceden açıkça bildirilir.
  const maxIsolatedGroupSize = Math.ceil(rows / 2) * Math.ceil(cols / 2);
  const oversizedGroups = groups.filter(g => g.students.length > maxIsolatedGroupSize);

  const seatOrder = [];
  for (let r = 0; r < rows; r++) {
    const cs = [...Array(cols).keys()];
    if (r % 2 === 1) cs.reverse();
    cs.forEach(c => seatOrder.push({ row: r, col: c }));
  }

  const queues = groups
    .map(g => ({ label: g.label, list: shuffleArr(g.students) }))
    .sort((a, b) => b.list.length - a.list.length);
  const interleaved = [];
  let remaining = true;
  while (remaining) {
    remaining = false;
    for (const q of queues) {
      if (q.list.length) {
        interleaved.push({ name: q.list.shift(), label: q.label });
        remaining = true;
      }
    }
  }

  // Öğrenci sayısı sıra sayısından azsa, dolu sıraları grid'in bir köşesinde sıkıştırmak yerine
  // eşit aralıklarla (stride) tüm grid'e yayıyoruz — sıkışık bir bölge, çapraz komşuluk kısıtı
  // altında gereksiz yere fazla ihlal üretir; yayılmış bir dağılım doğal olarak daha az çakışır.
  const chosenIndices = interleaved.map((_, i) => Math.floor((i * seatOrder.length) / interleaved.length));
  const usedSeatIdx = new Set(chosenIndices);
  const seating = chosenIndices.map((idx, i) => ({ ...seatOrder[idx], ...interleaved[i] }));
  const emptySeats = seatOrder.filter((_, idx) => !usedSeatIdx.has(idx));

  function seatAt(r, c) { return seating.find(s => s.row === r && s.col === c); }
  function neighborsOf(seat) {
    return [
      [seat.row - 1, seat.col], [seat.row + 1, seat.col], [seat.row, seat.col - 1], [seat.row, seat.col + 1],
      [seat.row - 1, seat.col - 1], [seat.row - 1, seat.col + 1], [seat.row + 1, seat.col - 1], [seat.row + 1, seat.col + 1],
    ].map(([r, c]) => seatAt(r, c)).filter(Boolean);
  }
  function countViolations() {
    let n = 0;
    seating.forEach(s => { neighborsOf(s).forEach(nb => { if (nb !== s && nb.label === s.label) n++; }); });
    return n;
  }

  function swap(a, b) {
    const tmpName = a.name, tmpLabel = a.label;
    a.name = b.name; a.label = b.label;
    b.name = tmpName; b.label = tmpLabel;
  }

  let current = countViolations();
  let bestSnapshot = seating.map(s => ({ name: s.name, label: s.label }));
  let bestViolations = current;
  let temperature = 4;
  const iterations = Math.min(6000, seating.length * 150);
  const cooling = 0.998;

  for (let iter = 0; iter < iterations && bestViolations > 0; iter++) {
    const violatingSeats = seating.filter(s => neighborsOf(s).some(nb => nb !== s && nb.label === s.label));
    if (!violatingSeats.length) break;
    const a = violatingSeats[Math.floor(Math.random() * violatingSeats.length)];
    const b = seating[Math.floor(Math.random() * seating.length)];
    if (a === b || a.label === b.label) { temperature *= cooling; continue; }

    swap(a, b);
    const next = countViolations();
    const delta = next - current;
    if (delta <= 0 || Math.random() < Math.exp(-delta / Math.max(temperature, 0.01))) {
      current = next;
      if (current < bestViolations) {
        bestViolations = current;
        bestSnapshot = seating.map(s => ({ name: s.name, label: s.label }));
      }
    } else {
      swap(a, b); // revert
    }
    temperature *= cooling;
  }

  seating.forEach((s, i) => { s.name = bestSnapshot[i].name; s.label = bestSnapshot[i].label; });

  const violations = [];
  seating.forEach(s => {
    neighborsOf(s).forEach(nb => {
      if (nb !== s && nb.label === s.label && s.row * cols + s.col < nb.row * cols + nb.col) {
        violations.push({ a: s, b: nb });
      }
    });
  });

  return { seating, emptySeats, violations, oversizedGroups, maxIsolatedGroupSize };
}

      ${grid.map(row => `
        <tr>
          ${row.map(s => `<td style="border:1px solid #999;padding:8px;text-align:center;font-size:12px;width:${100 / exam.cols}%">${esc(s.name)}<div style="font-size:10px;color:#555">${esc(s.label)}</div></td>`).join("")}
        </tr>
      `).join("")}
    </table>
  `);
}
