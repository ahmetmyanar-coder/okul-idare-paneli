async function renderMevzuat(school, content) {
  const { count: totalCount } = await sb.from("checklist_items").select("id", { count: "exact", head: true }).eq("school_id", school.id);
  const { count: totalTasks } = await sb.from("monthly_tasks").select("id", { count: "exact", head: true }).eq("school_id", school.id);
  const hasCorpus = (totalCount || 0) + (totalTasks || 0) > 0;

  content.innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <label>Ara</label>
      <input id="mv-q" placeholder="örn. hamilelik, kıdem, tahliye tatbikatı, devir teslim">
    </div>
    <div id="mv-results"></div>
  `;

  const resultsEl = document.getElementById("mv-results");
  if (!hasCorpus) {
    resultsEl.innerHTML = `<p style="color:var(--muted)">Henüz aranacak madde yok — önce Teftişe Hazırlık ya da Aylık Yönetim Akışı'na madde/görev ekle.</p>`;
  }

  let debounceTimer = null;
  async function runSearch(q) {
    const query = q.trim();
    if (!query) { resultsEl.innerHTML = hasCorpus ? "" : resultsEl.innerHTML; return; }
    resultsEl.innerHTML = `<p style="color:var(--muted)">Aranıyor…</p>`;
    const { data, error } = await sb.rpc("search_mevzuat", { p_query: query });
    if (error) {
      resultsEl.innerHTML = `<div class="msg err">${esc(error.message)}</div>`;
      return;
    }
    resultsEl.innerHTML = (data && data.length)
      ? data.map(r => `
        <div class="card" style="margin-bottom:10px">
          <span class="pill">${esc(r.source)}</span> ${r.category ? `<span class="pill">${esc(r.category)}</span>` : ""}
          <div style="margin-top:8px;font-weight:600">${esc(r.content)}</div>
          ${r.dayanak ? `<div style="font-size:11.5px;color:var(--accent);margin-top:6px">📖 ${esc(r.dayanak)}</div>` : ""}
          ${r.note ? `<div style="font-size:12px;color:var(--muted);margin-top:4px">💡 ${esc(r.note)}</div>` : ""}
        </div>
      `).join("")
      : `<p style="color:var(--muted)">Eşleşme bulunamadı. Bu, elimizde bu konuda doğrulanmış bir kayıt olmadığı anlamına gelir — uydurmak yerine boş sonuç gösteriyoruz. Teftişe Hazırlık/Aylık Yönetim Akışı'na doğrulanmış kaynakla eklemeyi düşün.</p>`;
  }

  document.getElementById("mv-q").oninput = (e) => {
    clearTimeout(debounceTimer);
    const q = e.target.value;
    debounceTimer = setTimeout(() => runSearch(q), 250);
  };
}

/**
 * İki fazlı çizelgeleme motoru:
 * Faz 1 — yapılandırma: en yüklü öğretmenden başlayarak, çoklu yumuşak-kısıt skoruna göre
 *   en iyi uygun hücreye greedy yerleştirme (kısıt-yoğunluğu sıralı sezgisel).
 * Faz 2 — simulated annealing: sabitlenmemiş atamalar üzerinde move/swap komşuluklarıyla
 *   yerel arama, toplam ceza (öğretmen boşlukları + aynı gün ders tekrarı + sınıf günlük
 *   yük dengesizliği + ağır ders/sabah tercihi) minimize edilene kadar iyileştirme.
 * Sert kısıtlar (öğretmen/sınıf çakışması, günlük tekrar sınırı) her iki fazda da asla ihlal edilmez.
 */
function generateLessonSchedule(school, { classes, subjects, periods, hours, existing, teachers }) {
  const days = DERS_DAYS;
  const subjectById = Object.fromEntries(subjects.map(s => [s.id, s]));
  const periodSortByIdx = {};
  periods.forEach((p, idx) => periodSortByIdx[p.id] = idx);

  const classOccupied = {};
  const teacherOccupied = {};
  const classDaySubjectCount = {};
  const classDayCount = {};
  const teacherDayPeriods = {};
  const placed = [];
  const unplaced = [];

  function markOccupied(class_id, teacher_id, day, period_id, subject_id) {
    classOccupied[`${class_id}|${day}|${period_id}`] = true;
    teacherOccupied[`${teacher_id}|${day}|${period_id}`] = true;
    classDaySubjectCount[`${class_id}|${day}|${subject_id}`] = (classDaySubjectCount[`${class_id}|${day}|${subject_id}`] || 0) + 1;
    classDayCount[`${class_id}|${day}`] = (classDayCount[`${class_id}|${day}`] || 0) + 1;
    (teacherDayPeriods[`${teacher_id}|${day}`] ??= new Set()).add(periodSortByIdx[period_id]);
  }

  (existing || []).filter(a => a.is_pinned).forEach(a => {
    markOccupied(a.class_id, a.teacher_id, a.day_of_week, a.period_id, a.subject_id);
    placed.push({ class_id: a.class_id, subject_id: a.subject_id, teacher_id: a.teacher_id, day_of_week: a.day_of_week, period_id: a.period_id, is_pinned: true, id: a.id });
  });

  const pinnedCountByReq = {};
  (existing || []).filter(a => a.is_pinned).forEach(a => {
    const key = `${a.class_id}|${a.subject_id}|${a.teacher_id}`;
    pinnedCountByReq[key] = (pinnedCountByReq[key] || 0) + 1;
  });

  let units = [];
  hours.forEach(h => {
    const key = `${h.class_id}|${h.subject_id}|${h.teacher_id}`;
    const remaining = Math.max(h.weekly_hours - (pinnedCountByReq[key] || 0), 0);
    for (let i = 0; i < remaining; i++) units.push({ class_id: h.class_id, subject_id: h.subject_id, teacher_id: h.teacher_id });
  });

  const teacherLoad = {};
  units.forEach(u => teacherLoad[u.teacher_id] = (teacherLoad[u.teacher_id] || 0) + 1);
  units = units
    .map(u => ({ u, r: Math.random() }))
    .sort((a, b) => (teacherLoad[b.u.teacher_id] - teacherLoad[a.u.teacher_id]) || (a.r - b.r))
    .map(x => x.u);

  function candidateScore(class_id, teacher_id, subject_id, day, period_id) {
    let score = 0;
    const subj = subjectById[subject_id];
    const pIdx = periodSortByIdx[period_id];
    if (subj?.is_heavy) score += pIdx * 3;
    score += (classDaySubjectCount[`${class_id}|${day}|${subject_id}`] || 0) * 8;
    score += (classDayCount[`${class_id}|${day}`] || 0) * 2;
    const existingPeriods = teacherDayPeriods[`${teacher_id}|${day}`];
    if (existingPeriods && existingPeriods.size) {
      const minDist = Math.min(...[...existingPeriods].map(idx => Math.abs(idx - pIdx)));
      if (minDist > 1) score += minDist * 4;
    }
    return score;
  }

  for (const u of units) {
    let best = null, bestScore = Infinity;
    for (const day of days) {
      if ((classDaySubjectCount[`${u.class_id}|${day}|${u.subject_id}`] || 0) >= DERS_MAX_PER_DAY) continue;
      for (const p of periods) {
        if (classOccupied[`${u.class_id}|${day}|${p.id}`] || teacherOccupied[`${u.teacher_id}|${day}|${p.id}`]) continue;
        const s = candidateScore(u.class_id, u.teacher_id, u.subject_id, day, p.id);
        if (s < bestScore) { bestScore = s; best = { day, period_id: p.id }; }
      }
    }
    if (best) {
      markOccupied(u.class_id, u.teacher_id, best.day, best.period_id, u.subject_id);
      placed.push({ class_id: u.class_id, subject_id: u.subject_id, teacher_id: u.teacher_id, day_of_week: best.day, period_id: best.period_id, is_pinned: false });
    } else {
      unplaced.push(u);
    }
  }

  function fullPenalty(schedule) {
    let penalty = 0;
    const perTeacherDay = {}, perClassDaySubject = {}, perClassDay = {};
    schedule.forEach(a => {
      const pIdx = periodSortByIdx[a.period_id];
      (perTeacherDay[`${a.teacher_id}|${a.day_of_week}`] ??= []).push(pIdx);
      const csKey = `${a.class_id}|${a.day_of_week}|${a.subject_id}`;
      perClassDaySubject[csKey] = (perClassDaySubject[csKey] || 0) + 1;
      const cdKey = `${a.class_id}|${a.day_of_week}`;
      perClassDay[cdKey] = (perClassDay[cdKey] || 0) + 1;
      if (subjectById[a.subject_id]?.is_heavy) penalty += pIdx * 3;
    });
    Object.values(perTeacherDay).forEach(arr => {
      arr.sort((a, b) => a - b);
      for (let i = 1; i < arr.length; i++) penalty += (arr[i] - arr[i - 1] - 1) * 4;
    });
    Object.values(perClassDaySubject).forEach(c => { if (c > 1) penalty += (c - 1) * 8; });
    const classIds = [...new Set(schedule.map(a => a.class_id))];
    classIds.forEach(cid => {
      const counts = days.map(d => perClassDay[`${cid}|${d}`] || 0);
      const mean = counts.reduce((s, c) => s + c, 0) / days.length;
      const variance = counts.reduce((s, c) => s + (c - mean) ** 2, 0) / days.length;
      penalty += variance * 2;
    });
    return penalty;
  }

  const movable = placed.filter(a => !a.is_pinned);
  if (movable.length > 1) {
    let current = placed.slice();
    let currentPenalty = fullPenalty(current);
    let best = current.slice();
    let bestPenalty = currentPenalty;
    let temperature = 10;
    const iterations = Math.min(4000, movable.length * 60);
    const cooling = 0.997;

    function isFree(schedule, class_id, teacher_id, day, period_id, excludeIdx) {
      for (let i = 0; i < schedule.length; i++) {
        if (i === excludeIdx) continue;
        const a = schedule[i];
        if (a.day_of_week !== day || a.period_id !== period_id) continue;
        if (a.class_id === class_id || a.teacher_id === teacher_id) return false;
      }
      return true;
    }

    for (let iter = 0; iter < iterations; iter++) {
      const movableIdxs = current.map((a, i) => a.is_pinned ? -1 : i).filter(i => i >= 0);
      if (!movableIdxs.length) break;
      const i = movableIdxs[Math.floor(Math.random() * movableIdxs.length)];
      const a = current[i];
      let candidate = current.slice();
      let valid = false;

      if (Math.random() < 0.5) {
        const day = days[Math.floor(Math.random() * days.length)];
        const p = periods[Math.floor(Math.random() * periods.length)];
        if (isFree(current, a.class_id, a.teacher_id, day, p.id, i)) {
          const csCount = current.filter((x, xi) => xi !== i && x.class_id === a.class_id && x.day_of_week === day && x.subject_id === a.subject_id).length;
          if (csCount < DERS_MAX_PER_DAY) {
            candidate[i] = { ...a, day_of_week: day, period_id: p.id };
            valid = true;
          }
        }
      } else {
        const j = movableIdxs[Math.floor(Math.random() * movableIdxs.length)];
        if (j !== i) {
          const b = current[j];
          const aNew = { ...a, day_of_week: b.day_of_week, period_id: b.period_id };
          const bNew = { ...b, day_of_week: a.day_of_week, period_id: a.period_id };
          const others = current.filter((_, idx) => idx !== i && idx !== j);
          const aOk = !others.some(x => x.day_of_week === aNew.day_of_week && x.period_id === aNew.period_id && (x.class_id === aNew.class_id || x.teacher_id === aNew.teacher_id));
          const bOk = !others.some(x => x.day_of_week === bNew.day_of_week && x.period_id === bNew.period_id && (x.class_id === bNew.class_id || x.teacher_id === bNew.teacher_id));
          const aCs = others.filter(x => x.class_id === aNew.class_id && x.day_of_week === aNew.day_of_week && x.subject_id === aNew.subject_id).length;
          const bCs = others.filter(x => x.class_id === bNew.class_id && x.day_of_week === bNew.day_of_week && x.subject_id === bNew.subject_id).length;
          if (aOk && bOk && aCs < DERS_MAX_PER_DAY && bCs < DERS_MAX_PER_DAY) {
            candidate[i] = aNew;
            candidate[j] = bNew;
            valid = true;
          }
        }
      }

      if (!valid) { temperature *= cooling; continue; }

      const candidatePenalty = fullPenalty(candidate);
      const delta = candidatePenalty - currentPenalty;
      if (delta < 0 || Math.random() < Math.exp(-delta / Math.max(temperature, 0.01))) {
        current = candidate;
        currentPenalty = candidatePenalty;
        if (currentPenalty < bestPenalty) { best = current.slice(); bestPenalty = currentPenalty; }
      }
      temperature *= cooling;
    }
    return { placed: best, unplaced, score: Math.round(bestPenalty * 10) / 10 };
  }

  return { placed, unplaced, score: Math.round(fullPenalty(placed) * 10) / 10 };
}

async function renderDersProgram(profile, school, content, viewMode = "sinif", genResult = null) {
  const [{ data: classes }, { data: subjects }, { data: periods }, { data: hours }, { data: teachers }, { data: existing }] = await Promise.all([
    sb.from("classes").select("*").eq("school_id", school.id).order("sort_order"),
    sb.from("subjects").select("*").eq("school_id", school.id).order("sort_order"),
    sb.from("lesson_periods").select("*").eq("school_id", school.id).order("sort_order"),
    sb.from("class_subject_hours").select("*").eq("school_id", school.id),
    sb.from("teachers").select("*").eq("school_id", school.id).in("staff_type", ["ogretmen", "yonetici"]),
    sb.from("lesson_assignments").select("*").eq("school_id", school.id),
  ]);

  if (!classes?.length || !periods?.length || !hours?.length) {
    content.innerHTML = `<p style="color:var(--muted)">Program oluşturmadan önce Ayarlar'dan sınıf/ders saati ekle ve Atamalar'dan haftalık saatleri tanımla.</p>`;
    return;
  }

  const teacherById = Object.fromEntries((teachers || []).map(t => [t.id, t]));
  const subjectById = Object.fromEntries((subjects || []).map(s => [s.id, s]));
  const classById = Object.fromEntries(classes.map(c => [c.id, c]));
  const totalNeeded = hours.reduce((s, h) => s + h.weekly_hours, 0);

  const warningHtml = genResult && genResult.unplaced.length ? `
    <div class="card" style="margin-bottom:16px;border-color:var(--warn)">
      <h3 style="margin-top:0">⚠️ Yerleştirilemeyen Dersler</h3>
      <p style="margin:0">${genResult.unplaced.length} ders saati, çakışma/kapasite yetersizliği nedeniyle programa yerleştirilemedi:</p>
      <ul style="margin:8px 0 0;padding-left:20px;font-size:13px">
        ${genResult.unplaced.map(u => `<li>${esc(classById[u.class_id]?.name || "?")} — ${esc(subjectById[u.subject_id]?.name || "?")} (${esc(teacherById[u.teacher_id]?.full_name || "?")})</li>`).join("")}
      </ul>
      <p style="font-size:12px;color:var(--muted);margin:8px 0 0">Çözüm için: haftalık ders saati sayısını azalt, ders saati (periods) sayısını artır ya da çakışan atamaları gözden geçir.</p>
    </div>
  ` : "";

  const byClassCell = {}, byTeacherCell = {};
  (existing || []).forEach(a => {
    (byClassCell[a.class_id] ??= {})[`${a.day_of_week}|${a.period_id}`] = a;
    (byTeacherCell[a.teacher_id] ??= {})[`${a.day_of_week}|${a.period_id}`] = a;
  });

  function renderEntityGrid(entities, cellMap, labelFn, cellContentFn, editable) {
    return entities.map(e => `
      <div class="card" style="margin-bottom:16px">
        <h3 style="margin-top:0">${esc(labelFn(e))}</h3>
        <div class="table-wrap">
        <table class="data">
          <thead><tr><th></th>${DERS_DAYS.map(d => `<th>${DAY_NAMES_DERS[d]}</th>`).join("")}</tr></thead>
          <tbody>
            ${periods.map(p => `
              <tr>
                <td style="white-space:nowrap"><strong>${esc(p.label)}</strong></td>
                ${DERS_DAYS.map(d => {
                  const a = (cellMap[e.id] || {})[`${d}|${p.id}`];
                  if (!a) return `<td></td>`;
                  const pinBtn = editable ? `<button data-toggle-pin="${a.id}" title="${a.is_pinned ? "Sabitlemeyi kaldır" : "Sabitle — Yeniden Oluştur bu dersi değiştirmesin"}" style="border:none;background:none;cursor:pointer;padding:0;font-size:11px;margin-left:4px">${a.is_pinned ? "📌" : "📍"}</button>` : (a.is_pinned ? " 📌" : "");
                  return `<td>${esc(subjectById[a.subject_id]?.name || "?")}${pinBtn}<div style="font-size:10.5px;color:var(--muted)">${cellContentFn(a)}</div></td>`;
                }).join("")}
              </tr>
            `).join("")}
          </tbody>
        </table>
        </div>
      </div>
    `).join("");
  }

  const sinifHtml = renderEntityGrid(classes, byClassCell, c => c.name, a => esc(teacherById[a.teacher_id]?.full_name || "?"), true);
  const ogretmenHtml = renderEntityGrid(teachers || [], byTeacherCell, t => t.full_name, a => esc(classById[a.class_id]?.name || "?"), false);

  content.innerHTML = `
    ${warningHtml}
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div>
          <h3 style="margin:0">Haftalık Ders Programı</h3>
          <p style="color:var(--muted);font-size:12.5px;margin:4px 0 0">${totalNeeded} saat/hafta talep · ${(existing || []).length} saat yerleştirilmiş${genResult ? ` · optimizasyon skoru: ${genResult.score} (düşük daha iyi)` : ""}</p>
        </div>
        <button class="primary" id="gen-ders-btn" style="margin:0;width:auto;padding:10px 18px">${existing?.length ? "Yeniden Oluştur" : "Program Oluştur"}</button>
      </div>
      <p style="color:var(--muted);font-size:11.5px;margin:6px 0 0">Yeniden oluşturma, sabitlenmiş dersleri korur. Optimizasyon: yapılandırma + simulated annealing yerel arama.</p>
      <div id="gen-ders-msg"></div>
    </div>
    ${existing?.length ? `
      <div class="subtabs" style="margin-bottom:16px">
        <div class="subtab ${viewMode === "sinif" ? "active" : ""}" data-view="sinif">Sınıf Bazlı</div>
        <div class="subtab ${viewMode === "ogretmen" ? "active" : ""}" data-view="ogretmen">Öğretmen Bazlı</div>
      </div>
      ${viewMode === "ogretmen" ? ogretmenHtml : sinifHtml}
    ` : `<p style="color:var(--muted)">Henüz program oluşturulmadı.</p>`}
  `;

  content.querySelectorAll("[data-view]").forEach(el => el.onclick = () => renderDersProgram(profile, school, content, el.dataset.view, genResult));

  content.querySelectorAll("[data-toggle-pin]").forEach(btn => btn.onclick = async () => {
    const id = btn.dataset.togglePin;
    const current = (existing || []).find(a => a.id === id);
    await sb.from("lesson_assignments").update({ is_pinned: !current?.is_pinned }).eq("id", id);
    await renderDersProgram(profile, school, content, viewMode, genResult);
  });

  document.getElementById("gen-ders-btn").onclick = async () => {
    const btn = document.getElementById("gen-ders-btn");
    const msg = document.getElementById("gen-ders-msg");
    btn.disabled = true;
    msg.innerHTML = `<div class="msg ok">Program oluşturuluyor (optimizasyon çalışıyor)…</div>`;
    await new Promise(r => setTimeout(r, 30));
    let result = null;
    try {
      await sb.from("lesson_assignments").delete().eq("school_id", school.id).eq("is_pinned", false);
      const { data: freshExisting } = await sb.from("lesson_assignments").select("*").eq("school_id", school.id);
      result = generateLessonSchedule(school, { classes, subjects, periods, hours, existing: freshExisting, teachers: teachers || [] });
      const toInsert = result.placed.filter(p => !p.is_pinned).map(p => ({
        school_id: school.id, class_id: p.class_id, subject_id: p.subject_id, teacher_id: p.teacher_id,
        day_of_week: p.day_of_week, period_id: p.period_id, is_pinned: false,
      }));
      if (toInsert.length) {
        const { error } = await sb.from("lesson_assignments").insert(toInsert);
        if (error) throw error;
      }
    } catch (e) {
      msg.innerHTML = `<div class="msg err">${e.message}</div>`;
      btn.disabled = false;
      return;
    }
    btn.disabled = false;
    await renderDersProgram(profile, school, content, viewMode, result);
  };
}

/* ============ SINAV KELEBEK (yalnızca tarayıcıda — öğrenci isimleri kişisel veri) ============ */

function kelebekKey(school) { return `kelebek_data_${school.id}`; }

function loadKelebek(school) {
  try {
    const raw = localStorage.getItem(kelebekKey(school));
    return raw ? JSON.parse(raw) : { exams: [] };
  } catch {
    return { exams: [] };
  }
}

function saveKelebek(school, data) {
  try {
    localStorage.setItem(kelebekKey(school), JSON.stringify(data));
    return true;
  } catch (e) {
    lastLocalStorageError = e;
    return false;
  }
}

function splitLines(text) {
  return (text || "").split("\n").map(s => s.trim()).filter(Boolean);
}

function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/**
 * Kelebek oturma düzeni: aynı gruptan (sınıf/şube) öğrenciler yatayda/dikeyde bitişik
 * oturmasın. Grupları round-robin iç içe geçirip yılan (snake) sırayla yerleştirir, sonra
 * kalan bitişik ihlallerini rastgele takas ile onarır (onarım sadece ihlali azaltıyorsa kalıcı
 * olur). Tam çözüm imkansızsa (bir grup diğerlerine göre aşırı kalabalıksa) kalan ihlaller
 * sessizce gizlenmez, açıkça raporlanır.
 */
function generateKelebekSeating(groups, rows, cols) {
  const totalSeats = rows * cols;
  const totalStudents = groups.reduce((s, g) => s + g.students.length, 0);
  if (totalStudents > totalSeats) {
    throw new Error(`${totalStudents} öğrenci için sadece ${totalSeats} sıra var — sıra/sütun sayısını artır ya da öğrenci sayısını azalt.`);
  }

  // 8 yönlü (çapraz dahil) komşulukta bir grup, kendi içinde hiç bitişik olmadan en fazla
  // ⌈satır/2⌉×⌈sütun/2⌉ üyeye sahip olabilir (grid'i 2×2 bloklara ayırınca her blokta en fazla
  // 1 üye kalabilir, çünkü bir bloktaki 4 hücre birbirine kral-hamlesiyle komşudur). Bu matematiksel
  // bir üst sınır — aşılırsa hiçbir algoritma sıfır ihlal üretemez, önceden açıkça bildirilir.
  const maxIsolatedGroupSize = Math.ceil(rows / 2) * Math.ceil(cols / 2);
  const oversizedGroups = groups.filter(g => g.students.length > maxIsolatedGroupSize);

  const seatOrder = [];
  for (let r = 0; r < rows; r++) {
    const cs = [...Array(cols).keys()];
    if (r % 2 === 1) cs.reverse();
    cs.forEach(c => seatOrder.push({ row: r, col: c }));
  }

  const queues = groups
    .map(g => ({ label: g.label, list: shuffleArr(g.students) }))
    .sort((a, b) => b.list.length - a.list.length);
  const interleaved = [];
  let remaining = true;
  while (remaining) {
    remaining = false;
    for (const q of queues) {
      if (q.list.length) {
        interleaved.push({ name: q.list.shift(), label: q.label });
        remaining = true;
      }
    }
  }

  // Öğrenci sayısı sıra sayısından azsa, dolu sıraları grid'in bir köşesinde sıkıştırmak yerine
  // eşit aralıklarla (stride) tüm grid'e yayıyoruz — sıkışık bir bölge, çapraz komşuluk kısıtı
  // altında gereksiz yere fazla ihlal üretir; yayılmış bir dağılım doğal olarak daha az çakışır.
  const chosenIndices = interleaved.map((_, i) => Math.floor((i * seatOrder.length) / interleaved.length));
  const usedSeatIdx = new Set(chosenIndices);
  const seating = chosenIndices.map((idx, i) => ({ ...seatOrder[idx], ...interleaved[i] }));
  const emptySeats = seatOrder.filter((_, idx) => !usedSeatIdx.has(idx)).map(s => ({ row: s.row, col: s.col }));

  function seatAt(r, c) { return seating.find(s => s.row === r && s.col === c); }
  function neighborsOf(seat) {
    return [
      [seat.row - 1, seat.col], [seat.row + 1, seat.col], [seat.row, seat.col - 1], [seat.row, seat.col + 1],
      [seat.row - 1, seat.col - 1], [seat.row - 1, seat.col + 1], [seat.row + 1, seat.col - 1], [seat.row + 1, seat.col + 1],
    ].map(([r, c]) => seatAt(r, c)).filter(Boolean);
  }
  function countViolations() {
    let n = 0;
    seating.forEach(s => { neighborsOf(s).forEach(nb => { if (nb !== s && nb.label === s.label) n++; }); });
    return n;
  }

  function swap(a, b) {
    const tmpName = a.name, tmpLabel = a.label;
    a.name = b.name; a.label = b.label;
    b.name = tmpName; b.label = tmpLabel;
  }

  // Bir öğrenciyi boş bir sıraya taşır (öğrencinin konumuyla boş sıranın konumunu takas eder).
  function relocate(occupied, empty) {
    const r = occupied.row, c = occupied.col;
    occupied.row = empty.row; occupied.col = empty.col;
    empty.row = r; empty.col = c;
  }
  const snapshot = () => seating.map(s => ({ row: s.row, col: s.col, name: s.name, label: s.label }));

  let current = countViolations();
  let bestSnapshot = snapshot();
  let bestViolations = current;
  let temperature = 4;
  const iterations = Math.min(6000, seating.length * 150);
  const cooling = 0.998;

  for (let iter = 0; iter < iterations && bestViolations > 0; iter++) {
    const violatingSeats = seating.filter(s => neighborsOf(s).some(nb => nb !== s && nb.label === s.label));
    if (!violatingSeats.length) break;
    const a = violatingSeats[Math.floor(Math.random() * violatingSeats.length)];

    // İki hamle türü var ve İKİNCİSİ kritik:
    // (1) iki öğrenciyi yer değiştir — dolu sıra KÜMESİ değişmez, sadece etiketler permüte olur;
    // (2) bir öğrenciyi boş sıraya taşı — dolu sıra kümesinin kendisi değişir.
    // Yalnızca (1) ile arama, başta stride ile seçilmiş sıra kümesine hapsolur. O küme geometrik
    // olarak kötüyse (ör. üç sıra birbirine komşuysa, iki grupla güvercin yuvası gereği en az bir
    // aynı-grup komşuluk KAÇINILMAZDIR) hiçbir etiket permütasyonu sıfıra inemez — kare grid'lerde
    // (8×8, 9×9) tam olarak bu oluyordu ve sonuç ısrarla 1 ihlalde takılı kalıyordu. (2) bu kilidi açar.
    let undo;
    if (emptySeats.length && Math.random() < 0.5) {
      const e = emptySeats[Math.floor(Math.random() * emptySeats.length)];
      relocate(a, e);
      undo = () => relocate(a, e);
    } else {
      const b = seating[Math.floor(Math.random() * seating.length)];
      if (a === b || a.label === b.label) { temperature *= cooling; continue; }
      swap(a, b);
      undo = () => swap(a, b);
    }

    const next = countViolations();
    const delta = next - current;
    if (delta <= 0 || Math.random() < Math.exp(-delta / Math.max(temperature, 0.01))) {
      current = next;
      if (current < bestViolations) {
        bestViolations = current;
        bestSnapshot = snapshot();
      }
    } else {
      undo();
    }
    temperature *= cooling;
  }

  seating.forEach((s, i) => {
    s.row = bestSnapshot[i].row; s.col = bestSnapshot[i].col;
    s.name = bestSnapshot[i].name; s.label = bestSnapshot[i].label;
  });
  // Konumlar değişmiş olabileceği için boş sıra listesi en iyi çözüme göre yeniden hesaplanır.
  const dolu = new Set(seating.map(s => s.row + "," + s.col));
  emptySeats.length = 0;
  seatOrder.forEach(s => { if (!dolu.has(s.row + "," + s.col)) emptySeats.push({ row: s.row, col: s.col }); });

  const violations = [];
  seating.forEach(s => {
    neighborsOf(s).forEach(nb => {
      if (nb !== s && nb.label === s.label && s.row * cols + s.col < nb.row * cols + nb.col) {
        violations.push({ a: s, b: nb });
      }
    });
  });

  return { seating, emptySeats, violations, oversizedGroups, maxIsolatedGroupSize };
}

function kelebekDocHtml(school, exam) {
  const grid = [];
  for (let r = 0; r < exam.rows; r++) {
    grid.push(exam.seating.filter(s => s.row === r).sort((a, b) => a.col - b.col));
  }
  return docWrapper(school, `
    <h3 style="text-align:center">SINAV OTURMA PLANI</h3>
    <p style="text-align:center;margin-top:-6px">${esc(exam.name)}${exam.date ? ` — ${fmtDate(exam.date)}` : ""}</p>
    ${exam.salon || exam.gozetmen ? `<p style="text-align:center;margin-top:-4px;font-size:11pt">${exam.salon ? `<strong>Salon:</strong> ${esc(exam.salon)}` : ""}${exam.salon && exam.gozetmen ? " &nbsp;·&nbsp; " : ""}${exam.gozetmen ? `<strong>Gözetmen:</strong> ${esc(exam.gozetmen)}` : ""}</p>` : ""}
    <table style="width:100%;border-collapse:collapse;margin-top:16px">
      ${grid.map(row => `
        <tr>
          ${row.map(s => `<td style="border:1px solid #999;padding:8px;text-align:center;font-size:12px;width:${100 / exam.cols}%">${esc(s.name)}<div style="font-size:10px;color:#555">${esc(s.label)}</div></td>`).join("")}
        </tr>
      `).join("")}

function renderSeatingResult(school, exam) {
  const grid = [];
  for (let r = 0; r < exam.rows; r++) {
    grid.push(exam.seating.filter(s => s.row === r).sort((a, b) => a.col - b.col));
  }
  return `
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">${esc(exam.name)}</h3>
      <p style="color:var(--muted);font-size:12.5px;margin-top:-6px">${exam.salon ? `${esc(exam.salon)} · ` : ""}${exam.gozetmen ? `Gözetmen: ${esc(exam.gozetmen)} · ` : ""}${exam.seating.length} öğrenci yerleşti${exam.date ? ` · ${fmtDate(exam.date)}` : ""}${exam.rows * exam.cols > exam.seating.length ? ` · ${exam.rows * exam.cols - exam.seating.length} sıra boş` : ""}</p>
      ${exam.oversizedGroups?.length ? `<div class="msg err">⚠️ Matematiksel olarak imkansız: ${exam.oversizedGroups.map(g => `"${esc(g.label)}" (${g.count} öğrenci)`).join(", ")} bu sıra/sütun boyutunda (çapraz komşuluk dahil) en fazla ${exam.maxIsolatedGroupSize} öğrenciye kadar hiç bitişiksiz ayrılabilir. Sıra/sütun sayısını artır ya da bu grubu ayrı bir oturuma böl.</div>` : ""}
      ${exam.remainingViolations > 0 ? `<div class="msg err">⚠️ ${exam.remainingViolations} yerde aynı gruptan öğrenciler bitişik kalmak zorunda kaldı${exam.oversizedGroups?.length ? "" : " — grup boyutları arasındaki dengesizlik nedeniyle tam kelebek düzeni mümkün olmadı. Sıra/sütun sayısını artırmak yardımcı olabilir."}</div>` : `<div class="msg ok">Hiçbir aynı-grup öğrenci bitişik değil (yatay/dikey/çapraz).</div>`}
      <div class="table-wrap" style="margin-top:14px">
        <table class="data">
          <tbody>
            ${grid.map(row => `
              <tr>
                ${row.map(s => `<td style="text-align:center">${esc(s.name)}<div style="font-size:10.5px;color:var(--muted)">${esc(s.label)}</div></td>`).join("")}
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="secondary" id="k-print" style="flex:1">Yazdır</button>
        <button class="secondary" id="k-download" style="flex:1">Word olarak indir</button>
      </div>
      <iframe id="k-frame" style="display:none"></iframe>
    </div>
  `;
}

async function renderKelebek(school, content, draftGroups = null, lastExam = null) {
  const data = loadKelebek(school);
  if (!draftGroups) draftGroups = [{ label: "", text: "" }, { label: "", text: "" }];

  function readDraftFromDom() {
    const labels = [...content.querySelectorAll(".k-group-label")];
    const texts = [...content.querySelectorAll(".k-group-text")];
    return labels.map((el, i) => ({ label: el.value, text: texts[i].value }));
  }

  content.innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">Yeni Sınav Oturma Planı</h3>
      <label>Sınav adı</label>
      <input id="k-name" placeholder="örn. 1. Dönem Ortak Sınavı">
      <label>Tarih <span style="color:var(--muted);font-weight:400">(opsiyonel)</span></label>
      ${dateInputHtml("k-date", "")}
      <div style="display:flex;gap:12px">
        <div style="flex:1"><label>Salon / derslik <span style="color:var(--muted);font-weight:400">(opsiyonel)</span></label><input id="k-salon" placeholder="örn. 7-A dersliği"></div>
        <div style="flex:2"><label>Gözetmen(ler) <span style="color:var(--muted);font-weight:400">(opsiyonel; virgülle ayır)</span></label><input id="k-gozetmen" placeholder="örn. Ayşe Kaya, Ali Veli"></div>
      </div>
      <div style="display:flex;gap:12px">
        <div style="flex:1"><label>Sıra sayısı</label><input id="k-rows" type="number" min="1" value="6"></div>
        <div style="flex:1"><label>Sütun sayısı</label><input id="k-cols" type="number" min="1" value="6"></div>
      </div>
      <label style="margin-top:14px;display:block">Sınıf grupları <span style="color:var(--muted);font-weight:400">(her grup ayrı bir sınıf/şube — aynı gruptakiler yan yana/art arda oturmaz)</span></label>
      <div id="k-groups">
        ${draftGroups.map((g, i) => `
          <div class="card" style="margin:10px 0;background:var(--surface-2)">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <label style="margin:0">Grup ${i + 1}</label>
              ${draftGroups.length > 1 ? `<button class="secondary" data-remove-group="${i}" style="width:auto;padding:4px 10px;font-size:12px;margin:0">Kaldır</button>` : ""}
            </div>
            <input class="k-group-label" data-idx="${i}" value="${esc(g.label)}" placeholder="örn. 8-A">
            <label style="font-size:12px">Öğrenci listesi <span style="color:var(--muted);font-weight:400">(her satıra bir isim)</span></label>
            <textarea class="k-group-text" data-idx="${i}" rows="4" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-family:inherit;font-size:14px">${esc(g.text)}</textarea>
          </div>
        `).join("")}
      </div>
      <button class="secondary" id="k-add-group" style="margin-top:8px;width:100%">+ Grup Ekle</button>
      <button class="primary" id="k-generate" style="margin-top:14px">Oturma Planını Oluştur</button>
      <div id="k-msg"></div>
    </div>
    ${lastExam ? renderSeatingResult(school, lastExam) : ""}
    ${data.exams.length ? `
      <div class="card">
        <h3 style="margin-top:0">Kayıtlı Sınavlar</h3>
        ${data.exams.slice().sort((a, b) => (b.date || "").localeCompare(a.date || "")).map(e => `
          <div class="list-item">
            <span>${esc(e.name)}${e.date ? ` · ${fmtDate(e.date)}` : ""}</span>
            <div class="row-actions">
              <button data-view-exam="${e.id}">Görüntüle</button>
              <button data-del-exam="${e.id}">Sil</button>
            </div>
          </div>
        `).join("")}
      </div>
    ` : ""}
  `;

  document.getElementById("k-add-group").onclick = () => {
    const current = readDraftFromDom();
    current.push({ label: "", text: "" });
    renderKelebek(school, content, current, lastExam);
  };
  content.querySelectorAll("[data-remove-group]").forEach(b => b.onclick = () => {
    const current = readDraftFromDom();
    current.splice(parseInt(b.dataset.removeGroup), 1);
    renderKelebek(school, content, current.length ? current : [{ label: "", text: "" }], lastExam);
  });

  wireDate3("k-date");
  document.getElementById("k-generate").onclick = () => {
    const name = document.getElementById("k-name").value.trim();
    const date = document.getElementById("k-date").value;
    const salon = document.getElementById("k-salon").value.trim();
    const gozetmen = document.getElementById("k-gozetmen").value.trim();
    const rows = parseInt(document.getElementById("k-rows").value) || 0;
    const cols = parseInt(document.getElementById("k-cols").value) || 0;
    const msg = document.getElementById("k-msg");
    const rawGroups = readDraftFromDom()
      .map(g => ({ label: g.label.trim(), students: splitLines(g.text) }))
      .filter(g => g.label && g.students.length);
    if (!name) { msg.innerHTML = `<div class="msg err">Sınav adı gerekli.</div>`; return; }
    if (!rows || !cols) { msg.innerHTML = `<div class="msg err">Sıra ve sütun sayısı gerekli.</div>`; return; }
    if (rawGroups.length < 2) { msg.innerHTML = `<div class="msg err">En az 2 sınıf grubu ve öğrenci listesi gerekli (kelebek düzeni için).</div>`; return; }
    let result;
    try {
      result = generateKelebekSeating(rawGroups, rows, cols);
    } catch (e) {
      msg.innerHTML = `<div class="msg err">${esc(e.message)}</div>`;
      return;
    }
    const exam = {
      id: uid(), name, date, salon, gozetmen, rows, cols, seating: result.seating,
      remainingViolations: result.violations.length,
      oversizedGroups: result.oversizedGroups.map(g => ({ label: g.label, count: g.students.length })),
      maxIsolatedGroupSize: result.maxIsolatedGroupSize,
      createdAt: new Date().toISOString(),
    };
    data.exams.push(exam);
    if (!saveKelebek(school, data)) { msg.innerHTML = localStorageSaveErrHtml(); return; }
    renderKelebek(school, content, null, exam);
  };

  content.querySelectorAll("[data-view-exam]").forEach(b => b.onclick = () => {
    const exam = data.exams.find(e => e.id === b.dataset.viewExam);
    renderKelebek(school, content, null, exam);
  });
  content.querySelectorAll("[data-del-exam]").forEach(b => b.onclick = () => {
    if (!confirm("Bu sınav oturma planını silmek istediğine emin misin?")) return;
    data.exams = data.exams.filter(e => e.id !== b.dataset.delExam);
    saveKelebek(school, data);
    renderKelebek(school, content, draftGroups, null);
  });

  if (lastExam) {
    const fullHtml = kelebekDocHtml(school, lastExam);
    const frame = document.getElementById("k-frame");
    document.getElementById("k-print").onclick = () => {
      frame.srcdoc = fullHtml;
      frame.onload = () => { frame.contentWindow.focus(); frame.contentWindow.print(); };
    };
    document.getElementById("k-download").onclick = () => {
      const blob = new Blob(["﻿", fullHtml], { type: "application/msword" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${lastExam.name}.doc`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    };
  }
}

/* ============ TALEP TAKİBİ ============ */

const TALEP_STATUS_LABELS = { bekliyor: "Bekliyor", islemde: "İşlemde", tamamlandi: "Tamamlandı", reddedildi: "Reddedildi" };
const TALEP_STATUS_ORDER = ["bekliyor", "islemde", "tamamlandi", "reddedildi"];

async function renderTalepModule(profile, school) {
  app.innerHTML = `
    <div class="wrap wide">
      <button class="navlink" id="back-dash">← Panele dön</button>
      <div class="eyebrow">Talep Takibi</div>
      <h1>${esc(school.name)}</h1>
      <div class="subtitle">Öğretmenlerden (ya da diğer personelden) gelen talep/bildirimleri kaydet, durumunu takip et.</div>
      <div id="talep-content"></div>
    </div>
  `;
  document.getElementById("back-dash").onclick = () => renderDashboard(profile, school);
  await renderTalep(school, document.getElementById("talep-content"));
}

async function renderTalep(school, content, filterStatus = "hepsi") {
  const [{ data: requests }, { data: teachers }] = await Promise.all([
    sb.from("requests").select("*").eq("school_id", school.id).order("created_at", { ascending: false }),
    sb.from("teachers").select("id, full_name").eq("school_id", school.id).order("full_name"),
  ]);

  const counts = { bekliyor: 0, islemde: 0, tamamlandi: 0, reddedildi: 0 };
  (requests || []).forEach(r => { counts[r.status] = (counts[r.status] || 0) + 1; });

  const filtered = filterStatus === "hepsi" ? (requests || []) : (requests || []).filter(r => r.status === filterStatus);

  content.innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">Yeni Talep</h3>
      <label>Talep eden</label>
      <select id="r-select">
        <option value="">Öğretmen listesinden seç…</option>
        ${(teachers || []).map(t => `<option value="${t.id}">${esc(t.full_name)}</option>`).join("")}
        <option value="__custom__">Listede yok (elle yaz)</option>
      </select>
      <div id="r-custom-wrap" class="hidden">
        <label>Ad Soyad</label>
        <input id="r-name" placeholder="örn. Ayşe Öğretmen, 5-A Sınıfı">
      </div>
      <label>Kategori</label>
      <select id="r-category">
        <option value="Malzeme">Malzeme</option>
        <option value="Bakım / Tamirat">Bakım / Tamirat</option>
        <option value="İzin">İzin</option>
        <option value="Diğer">Diğer</option>
      </select>
      <label>Açıklama</label>
      <textarea id="r-desc" rows="3" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-family:inherit;font-size:14px" placeholder="Talebin ayrıntısı"></textarea>
      <button class="primary" id="r-save">Ekle</button>
      <div id="r-msg"></div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div class="subtabs" style="flex-wrap:wrap">
        <div class="subtab ${filterStatus === "hepsi" ? "active" : ""}" data-filter="hepsi">Tümü (${(requests || []).length})</div>
        ${TALEP_STATUS_ORDER.map(s => `<div class="subtab ${filterStatus === s ? "active" : ""}" data-filter="${s}">${TALEP_STATUS_LABELS[s]} (${counts[s]})</div>`).join("")}
      </div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Talepler</h3>
      ${filtered.length ? filtered.map(r => `
        <div class="card" style="margin-bottom:10px;background:var(--surface-2)">
          <div style="display:flex;justify-content:space-between;align-items:start;gap:10px;flex-wrap:wrap">
            <div>
              <strong>${esc(r.requester_name)}</strong> ${r.category ? `<span class="pill">${esc(r.category)}</span>` : ""}
              <div style="font-size:13px;margin-top:4px">${esc(r.description)}</div>
              <div style="font-size:11px;color:var(--muted);margin-top:4px">${fmtDate(r.created_at.slice(0, 10))}</div>
            </div>
            <select data-status-for="${r.id}" style="width:auto">
              ${TALEP_STATUS_ORDER.map(s => `<option value="${s}" ${r.status === s ? "selected" : ""}>${TALEP_STATUS_LABELS[s]}</option>`).join("")}
            </select>
          </div>
          <label style="font-size:12px;margin-top:8px">Not <span style="color:var(--muted);font-weight:400">(opsiyonel)</span></label>
          <input data-note-for="${r.id}" value="${esc(r.note || "")}" placeholder="örn. sipariş verildi, 2 hafta sürecek">
          <div class="row-actions" style="margin-top:6px"><button data-del-request="${r.id}">Sil</button></div>
        </div>
      `).join("") : `<p style="color:var(--muted)">Bu filtrede talep yok.</p>`}
    </div>
  `;

  content.querySelectorAll("[data-filter]").forEach(el => el.onclick = () => renderTalep(school, content, el.dataset.filter));

  const talepTeacherNameById = Object.fromEntries((teachers || []).map(t => [t.id, t.full_name]));
  document.getElementById("r-select").onchange = (ev) => {
    document.getElementById("r-custom-wrap").classList.toggle("hidden", ev.target.value !== "__custom__");
  };
  document.getElementById("r-save").onclick = async () => {
    const selectVal = document.getElementById("r-select").value;
    let requester_name = null, requester_teacher_id = null;
    if (selectVal === "__custom__") {
      requester_name = document.getElementById("r-name").value.trim();
    } else if (selectVal) {
      requester_teacher_id = selectVal;
      requester_name = talepTeacherNameById[selectVal];
    }
    const category = document.getElementById("r-category").value;
    const description = document.getElementById("r-desc").value.trim();
    const msg = document.getElementById("r-msg");
    if (!requester_name || !description) { msg.innerHTML = `<div class="msg err">Talep eden ve açıklama gerekli.</div>`; return; }
    const { error } = await sb.from("requests").insert({ school_id: school.id, requester_name, requester_teacher_id, category, description });
    if (error) { msg.innerHTML = `<div class="msg err">${error.message}</div>`; return; }
    await renderTalep(school, content, filterStatus);
  };

  content.querySelectorAll("[data-status-for]").forEach(sel => sel.onchange = async () => {
    const id = sel.dataset.statusFor;
    const status = sel.value;
    const resolved_at = (status === "tamamlandi" || status === "reddedildi") ? new Date().toISOString() : null;
    await sb.from("requests").update({ status, resolved_at }).eq("id", id);
    await renderTalep(school, content, filterStatus);
  });
  content.querySelectorAll("[data-note-for]").forEach(input => input.onchange = async () => {
    await sb.from("requests").update({ note: input.value.trim() || null }).eq("id", input.dataset.noteFor);
  });
  content.querySelectorAll("[data-del-request]").forEach(b => b.onclick = async () => {
    if (!confirm("Bu talebi silmek istediğine emin misin?")) return;
    await sb.from("requests").delete().eq("id", b.dataset.delRequest);
    await renderTalep(school, content, filterStatus);
  });
}

const planlamaNorm = s => (s || "").toLocaleLowerCase("tr-TR").replace(/[^a-zçğıöşü0-9]+/g, " ").trim();
function planlamaExpectedRolesHtml(committee, members) {
  const tpl = PLANLAMA_SEED_ORTAOKUL.find(s => planlamaNorm(s.name) === planlamaNorm(committee.name));
  if (!tpl) return "";
  const roleOf = m => (m.role || "").toLocaleLowerCase("tr-TR");
  const rows = tpl.roles.map(r => {
    const key = r.role.toLocaleLowerCase("tr-TR").split(" ")[0];
    const have = (members || []).filter(m => roleOf(m).includes(key)).length;
    const ok = have >= r.n;
    return `<div class="list-item"><span>${ok ? "✅" : "⬜"} <strong>${esc(r.role)}</strong> <span style="color:var(--muted)">— ${esc(r.who)}</span></span><span class="pill ${ok ? "good" : "warn"}">${have}/${r.n}</span></div>`;
  }).join("");
  return `<div style="margin:6px 0 12px"><div style="font-size:12.5px;font-weight:600;margin-bottom:4px">Beklenen üyelik yapısı <span style="font-weight:400;color:var(--muted)">(${tpl.basis ? esc(tpl.basis) : "yaygın uygulama"}; üye rolünü aynı adla gir — Başkan, Asil üye, Yedek üye…)</span></div>${rows}</div>`;
}

/**
 * Kurul/komisyon/kulüpleri türlerine göre gruplar. `committee_type` serbest metin olarak
 * saklandığı için (form "Kurul" yazarken eski/dış kayıtlar "kurul" olabilir) eşleştirme
 * büyük-küçük harf ve Türkçe karakter duyarsız yapılır; tanınmayan ya da boş tür
 * "Diğer" altında toplanır — hiçbir kayıt listeden düşmez.
 */
function groupCommitteesByType(committees) {
  const gruplar = [
    { baslik: "Kurullar", anahtar: "kurul", items: [] },
    { baslik: "Komisyonlar", anahtar: "komisyon", items: [] },
    { baslik: "Kulüpler", anahtar: "kulup", items: [] },
    { baslik: "Diğer", anahtar: null, items: [] },
  ];
  (committees || []).forEach(c => {
    const tur = (c.committee_type || "").toLocaleLowerCase("tr-TR").replace(/ü/g, "u");
    (gruplar.find(g => g.anahtar && tur.includes(g.anahtar)) || gruplar[3]).items.push(c);
  });
  return gruplar.filter(g => g.items.length);
}

/* ============ ÖĞRETMEN ARAÇLARI (yalnızca tarayıcıda — öğrenci verisi sunucuya gönderilmez) ============ */
/**
 * Sınav analizi, dereceli puanlama ölçeği (rubrik), sınıf oturma planı ve öğretmen belgeleri.
 * Öğrenci adları ve puanları localStorage'da, hesap+okul bazında saklanır (Kelebek/Personel ile aynı gizlilik ilkesi).
 * Doğrulanmış eşikler (MEB Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği): md.21/1 — Türkçe dışındaki derslerde
 * 0-49,99 başarısız, 50,00+ başarılı; Türkçe'de 0-69,99 başarısız, 70,00+ başarılı. md.53/1 — dönem ağırlıklı puan
 * ortalaması 70,00-84,99 Teşekkür, 85,00+ Takdir. md.22/3 — ders etkinliklerine katılım puanı sayısı (haftalık 2 ve altı → 2, üstü → 3).
 * md.22/2 — ortaokulda ders yılında en az bir proje; verildiği dönemde değerlendirilir. Liseler için eşik alanı elle değiştirilir.
 */
function oaKey(school, profile) { return `ogretmen_araclari_${school.id}_${profile.id}`; }
function loadOA(school, profile) {
  try { const raw = localStorage.getItem(oaKey(school, profile)); const d = raw ? JSON.parse(raw) : {}; return { analyses: d.analyses || [], rubrics: d.rubrics || [], seatings: d.seatings || [] }; }
  catch { return { analyses: [], rubrics: [], seatings: [] }; }
}
function saveOA(school, profile, data) {
  try { localStorage.setItem(oaKey(school, profile), JSON.stringify(data)); return true; }
  catch (e) { lastLocalStorageError = e; return false; }
}
const OA_TOOLS = [
  { id: "analiz", label: "Sınav Analizi", desc: "Puan listesini yapıştır: ortalama, medyan, standart sapma, başarı oranı, puan dağılımı, soru bazında başarı ve basılı analiz raporu." },
  { id: "olcek", label: "Değerlendirme Ölçeği", desc: "Proje/performans için dereceli puanlama anahtarı: ölçütleri ve puanları belirle, sınıfı puanla, ölçek ve puan çizelgesini yazdır." },
  { id: "oturma", label: "Sınıf Oturma Planı", desc: "Sınıf listesinden alfabetik/rastgele oturma planı; öne alınacaklar ve yan yana oturmayacaklar kuralı; basılı plan." },
  { id: "belgeler", label: "Belgelerim", desc: "Ders kesim raporu, sınav kâğıdı teslim tutanağı, proje seçim formu ve dönem sonu kontrol listesi." },
];
const OA_BANDS = [[0, 49.99, "0 – 49,99 (başarısız)"], [50, 69.99, "50 – 69,99"], [70, 84.99, "70 – 84,99 (teşekkür aralığı)"], [85, 100, "85 – 100 (takdir aralığı)"]];
const oaNum = s => { const n = parseFloat(String(s).trim().replace(",", ".")); return Number.isFinite(n) ? n : null; };
const oaFmt = n => (Math.round(n * 100) / 100).toLocaleString("tr-TR", { minimumFractionDigits: 0, maximumFractionDigits: 2 });

/* "No Ad Soyad p1 p2 …" / "Ad Soyad<TAB>puan" / "Ad Soyad | 10 | 8 | …" satırlarını çözer. */
function oaParseScores(text) {
  const rows = [], errors = [];
  splitLines(text).forEach((line, i) => {
    let parts = line.split(/\t|\||;/).map(x => x.trim()).filter(Boolean);
    if (parts.length === 1) {
      const m = line.trim().match(/^(.*?\S)\s+((?:[\d]+(?:[.,]\d+)?\s*)+)$/);
      if (!m) { errors.push(`Satır ${i + 1}: puan bulunamadı — "${line.trim().slice(0, 40)}"`); return; }
      parts = [m[1], ...m[2].trim().split(/\s+/)];
    }
    let name = parts[0], nums = parts.slice(1).map(oaNum);
    if (nums.some(n => n === null)) { errors.push(`Satır ${i + 1}: sayı olmayan puan — "${line.trim().slice(0, 40)}"`); return; }
    let no = null;
    const lead = name.match(/^(\d{1,6})\s+(.+)$/);
    if (lead) { no = lead[1]; name = lead[2]; }
    else if (/^\d+$/.test(name) && parts.length > 2) { no = name; name = parts[1]; nums = parts.slice(2).map(oaNum); }
    if (!nums.length) { errors.push(`Satır ${i + 1}: puan yok`); return; }
    rows.push({ no, name, scores: nums, total: nums.length === 1 ? nums[0] : nums.reduce((a, b) => a + b, 0) });
  });
  return { rows, errors };
}
function oaStats(values) {
  const n = values.length; if (!n) return null;
  const sorted = values.slice().sort((a, b) => a - b);
  const mean = values.reduce((a, b) => a + b, 0) / n;
  const median = n % 2 ? sorted[(n - 1) / 2] : (sorted[n / 2 - 1] + sorted[n / 2]) / 2;
  const sd = Math.sqrt(values.reduce((a, v) => a + (v - mean) ** 2, 0) / n);
  return { n, mean, median, sd, min: sorted[0], max: sorted[n - 1] };
}
function oaAnalyze(rows, opts) {
  const totals = rows.map(r => r.total);
  const st = oaStats(totals);
  const pass = rows.filter(r => r.total >= opts.threshold).length;
  const bands = OA_BANDS.map(([lo, hi, label]) => ({ label, count: rows.filter(r => r.total >= lo && r.total <= hi).length }));
  const qCount = rows.length && rows.every(r => r.scores.length === rows[0].scores.length) && rows[0].scores.length > 1 ? rows[0].scores.length : 0;
  let questions = [];
  if (qCount) {
    const maxes = opts.qMax && opts.qMax.length === qCount ? opts.qMax : Array(qCount).fill(opts.fullScore / qCount);
    questions = Array.from({ length: qCount }, (_, q) => {
      const vals = rows.map(r => r.scores[q]); const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
      const pct = maxes[q] ? mean / maxes[q] * 100 : 0;
      const fullCount = vals.filter(v => maxes[q] && v >= maxes[q]).length, zeroCount = vals.filter(v => v === 0).length;
      return { q: q + 1, max: maxes[q], mean, pct, fullCount, zeroCount };
    });
  }
  return { st, pass, passPct: rows.length ? pass / rows.length * 100 : 0, bands, questions, qCount };
}

/* Oturma planı: satır×sütun (her sütun bir sıra grubu, sütun içinde seatsPerDesk kişi). */
function oaBuildSeating(students, opts) {
  let list = students.slice();
  if (opts.order === "alfabetik") list.sort((a, b) => a.localeCompare(b, "tr"));
  else if (opts.order === "rastgele") { for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; } }
  const front = (opts.front || []).filter(n => list.includes(n));
  list = [...front, ...list.filter(n => !front.includes(n))];
  const capacity = opts.rows * opts.cols * opts.perDesk;
  const seats = [];
  for (let r = 0; r < opts.rows; r++) for (let c = 0; c < opts.cols; c++) for (let k = 0; k < opts.perDesk; k++) seats.push({ row: r, col: c, k, name: null });
  list.slice(0, capacity).forEach((n, i) => seats[i].name = n);
  // yan yana oturmayacaklar: aynı sırada (row,col) ya da bitişik sütunda aynı satırda olanları ayır (basit onarım)
  const pairs = opts.apart || [];
  const adjacent = (a, b) => a.row === b.row && Math.abs(a.col - b.col) <= (a.col === b.col ? 0 : 1);
  for (let iter = 0; iter < 200 && pairs.length; iter++) {
    let fixed = true;
    for (const [x, y] of pairs) {
      const sx = seats.find(s => s.name === x), sy = seats.find(s => s.name === y);
      if (!sx || !sy || !adjacent(sx, sy)) continue;
      fixed = false;
      const candidates = seats.filter(s => s.name && s.name !== x && s.name !== y && !adjacent(s, sx) && !pairs.some(([p, q]) => (p === s.name && adjacent(sy, sx)) || (q === s.name && adjacent(sy, sx))));
      const target = candidates[Math.floor(Math.random() * candidates.length)];
      if (target) { const tmp = target.name; target.name = sy.name; sy.name = tmp; }
    }
    if (fixed) break;
  }
  const overflow = list.slice(capacity);
  const violations = pairs.filter(([x, y]) => { const sx = seats.find(s => s.name === x), sy = seats.find(s => s.name === y); return sx && sy && adjacent(sx, sy); });
  return { seats, overflow, violations };
}

        ${R.qCount ? `<div class="table-wrap" style="margin-top:10px"><table class="data"><thead><tr><th>Soru</th><th>Tam</th><th>Ort.</th><th>Başarı</th><th>Durum</th></tr></thead><tbody>${R.questions.map(q => `<tr><td>S${q.q}</td><td>${oaFmt(q.max)}</td><td>${oaFmt(q.mean)}</td><td>%${oaFmt(q.pct)}</td><td><span class="pill ${q.pct < 50 ? "crit" : q.pct < 70 ? "warn" : "good"}">${q.pct < 50 ? "Geliştirilmeli" : q.pct < 70 ? "Orta" : "İyi"}</span></td></tr>`).join("")}</tbody></table></div>` : ""}
        <button class="secondary" id="oa-open-report" style="margin-top:10px">Analiz Raporunu Aç / Yazdır</button>`;
      document.getElementById("oa-open-report").onclick = () => showDoc(oaAnalysisReportHtml(school, an), `Sınav Analizi ${an.ders} ${an.sinif}`);
    };
    document.getElementById("oa-run").onclick = () => {
      const msg = document.getElementById("oa-msg");
      const v = id => document.getElementById(id).value.trim();
      const parsed = oaParseScores(v("oa-text"));
      if (!parsed.rows.length) { msg.innerHTML = `<div class="msg err">Puan listesi okunamadı. ${parsed.errors.slice(0, 2).map(esc).join(" · ")}</div>`; return; }

      const qMax = v("oa-qmax") ? v("oa-qmax").split(/[,;\s]+/).map(oaNum).filter(n => n !== null) : null;
      const over = parsed.rows.filter(r => r.total > fullScore);
      const an = { id: a.id || uid(), name: v("oa-name") || "Sınav", ders: v("oa-ders"), sinif: v("oa-sinif"), date: document.getElementById("oa-date").value || null, fullScore, threshold, qMax, qMaxText: v("oa-qmax"), text: v("oa-text"), rows: parsed.rows, notes: v("oa-notes"), includeList: document.getElementById("oa-list").checked, teacher: v("oa-teacher"), createdAt: a.createdAt || new Date().toISOString() };
      if (editing) data.analyses = data.analyses.map(x => x.id === an.id ? an : x); else data.analyses.push(an);
      if (!saveOA(school, profile, data)) { msg.innerHTML = localStorageSaveErrHtml(); return; }
      msg.innerHTML = `<div class="msg ok">Analiz kaydedildi.${parsed.errors.length ? ` ${parsed.errors.length} satır atlandı: ${parsed.errors.slice(0, 2).map(esc).join(" · ")}` : ""}${over.length ? ` Uyarı: ${over.length} öğrencinin puanı tam puanı aşıyor.` : ""}</div>`;
      renderResult(an);
    };
    if (editing && editing.rows) renderResult(editing);
    content.querySelectorAll("[data-oa-report]").forEach(b => b.onclick = () => { const x = data.analyses.find(y => y.id === b.dataset.oaReport); showDoc(oaAnalysisReportHtml(school, x), `Sınav Analizi ${x.ders} ${x.sinif}`); });
    content.querySelectorAll("[data-oa-edit]").forEach(b => b.onclick = () => rerender({ editId: b.dataset.oaEdit }));
    content.querySelectorAll("[data-oa-del]").forEach(b => b.onclick = () => { if (!confirm("Bu analiz silinsin mi?")) return; data.analyses = data.analyses.filter(x => x.id !== b.dataset.oaDel); saveOA(school, profile, data); rerender({ editId: null }); });

  }

        <div id="or-crit">${crit.map((c, i) => `<div style="display:grid;grid-template-columns:2fr 80px 2fr auto;gap:8px;align-items:center;margin-bottom:6px"><input class="or-cname" data-i="${i}" value="${esc(c.name)}" placeholder="Ölçüt" style="margin:0"><input class="or-cmax" data-i="${i}" type="number" min="0" value="${c.max}" style="margin:0"><input class="or-cdesc" data-i="${i}" value="${esc(c.desc || "")}" placeholder="Açıklama (opsiyonel)" style="margin:0"><button class="or-cdel" data-i="${i}" style="margin:0;padding:6px 10px">×</button></div>`).join("")}</div>

        <label style="margin-top:14px">Öğrenci listesi <span style="color:var(--muted);font-weight:400">(her satıra bir öğrenci; okul numarası başta olabilir)</span></label>
        <textarea id="or-students" rows="5" ${DIS_TA}>${esc(r.studentsText || r.students.join("\n"))}</textarea>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
          <button class="secondary" id="or-grid" style="width:auto;margin:0;padding:8px 14px">Puan tablosunu oluştur</button>
          <button class="primary" id="or-save" style="width:auto;margin:0;padding:8px 14px">Kaydet</button>
          <button class="secondary" id="or-print" style="width:auto;margin:0;padding:8px 14px">Ölçek ve çizelgeyi yazdır</button>
          ${editing ? `<button class="secondary" id="or-cancel" style="width:auto;margin:0;padding:8px 14px">Vazgeç</button>` : ""}
        </div>
        <div id="or-msg"></div>
        <div id="or-table" class="table-wrap" style="margin-top:12px"></div>
        <div id="oa-preview" style="margin-top:12px"></div>
      </div>
      <div class="card">
        <h3 style="margin-top:0">Kayıtlı Ölçekler (${data.rubrics.length})</h3>
        ${data.rubrics.length ? data.rubrics.map(x => `<div class="list-item"><span><strong>${esc(x.name || "(adsız)")}</strong> · ${esc(OA_RUBRIC_TEMPLATES[x.type]?.label || x.type)} · ${esc(x.ders)} ${esc(x.sinif)}<div style="font-size:11.5px;color:var(--muted)">${x.criteria.length} ölçüt · ${x.students.length} öğrenci</div></span><div class="row-actions"><button data-or-print="${x.id}">Yazdır</button><button data-or-edit="${x.id}">Düzenle</button><button data-or-del="${x.id}">Sil</button></div></div>`).join("") : `<p style="color:var(--muted)">Henüz ölçek yok.</p>`}
      </div>`;
    const readCrit = () => [...content.querySelectorAll(".or-cname")].map((el, i) => ({ name: el.value.trim(), max: +content.querySelector(`.or-cmax[data-i="${i}"]`).value || 0, desc: content.querySelector(`.or-cdesc[data-i="${i}"]`).value.trim() }));

    content.querySelectorAll(".or-cdel").forEach(b => b.onclick = () => { const c = readCrit(); c.splice(+b.dataset.i, 1); rerender({ criteria: c, type: document.getElementById("or-type").value }); });

    document.getElementById("or-type").onchange = (ev) => { if (!editing && confirm("Ölçütler seçilen türün şablonuyla değiştirilsin mi?")) rerender({ type: ev.target.value, criteria: null }); };
    let scores = (r.scores || []).map(s => s.slice());
    const drawGrid = () => {
      const students = readStudents(), c = readCrit();
      if (!students.length) { document.getElementById("or-table").innerHTML = `<p style="color:var(--muted)">Önce öğrenci listesini gir.</p>`; return; }

      content.querySelectorAll(".or-score").forEach(el => el.oninput = () => { const i = +el.dataset.i, j = +el.dataset.j; scores[i] = scores[i] || []; scores[i][j] = el.value === "" ? "" : Math.min(+el.max, Math.max(0, +el.value)); if (el.value !== "" && +el.value > +el.max) el.value = el.max; content.querySelector(`.or-sum[data-i="${i}"]`).innerHTML = `<strong>${oaFmt(scores[i].reduce((a, v) => a + (+v || 0), 0))}</strong>`; });
    };
    document.getElementById("or-grid").onclick = drawGrid;
    if (editing && editing.students.length) drawGrid();
    const collect = () => ({ id: r.id || uid(), name: document.getElementById("or-name").value.trim(), ders: document.getElementById("or-ders").value.trim(), sinif: document.getElementById("or-sinif").value.trim(), donem: document.getElementById("or-donem").value.trim(), type: document.getElementById("or-type").value, criteria: readCrit().filter(c => c.name), students: readStudents(), studentsText: document.getElementById("or-students").value, scores, teacher: document.getElementById("or-teacher").value.trim() });
    document.getElementById("or-save").onclick = () => {
      const msg = document.getElementById("or-msg"); const x = collect();
      if (!x.criteria.length) { msg.innerHTML = `<div class="msg err">En az bir ölçüt gerekli.</div>`; return; }
      if (editing) data.rubrics = data.rubrics.map(y => y.id === x.id ? x : y); else data.rubrics.push(x);
      if (!saveOA(school, profile, data)) { msg.innerHTML = localStorageSaveErrHtml(); return; }
      msg.innerHTML = `<div class="msg ok">Ölçek kaydedildi (${x.criteria.length} ölçüt, ${x.students.length} öğrenci).</div>`;
      if (!editing) rerender({ editId: x.id, criteria: null });
    };
    document.getElementById("or-print").onclick = () => showDoc(oaRubricHtml(school, collect()), `Ölçek ${document.getElementById("or-name").value.trim() || "puanlama"}`);
    const cancel = document.getElementById("or-cancel"); if (cancel) cancel.onclick = () => rerender({ editId: null, criteria: null, type: null });
    content.querySelectorAll("[data-or-print]").forEach(b => b.onclick = () => { const x = data.rubrics.find(y => y.id === b.dataset.orPrint); showDoc(oaRubricHtml(school, x), `Ölçek ${x.name}`); });
    content.querySelectorAll("[data-or-edit]").forEach(b => b.onclick = () => rerender({ editId: b.dataset.orEdit, criteria: null, type: null }));
    content.querySelectorAll("[data-or-del]").forEach(b => b.onclick = () => { if (!confirm("Bu ölçek silinsin mi?")) return; data.rubrics = data.rubrics.filter(x => x.id !== b.dataset.orDel); saveOA(school, profile, data); rerender({ editId: null, criteria: null, type: null }); });
    return;
  }

  if (tool === "oturma") {
    const last = state.plan || null;
    content.innerHTML = `
      <div class="card" style="margin-bottom:14px">
        <h3 style="margin-top:0">Yeni Oturma Planı</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end">
          <div><label>Sınıf / şube</label><input id="os-sinif" value="${esc(state.sinif || "")}" placeholder="örn. 7-B"></div>
          <div><label>Öğretmen</label><input id="os-teacher" value="${esc(state.teacher || teacherName)}"></div>
          <div><label>Tarih</label>${dateInputHtml("os-date", state.date || toLocalISO(new Date()))}</div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;align-items:end">
          <div><label>Sıra (satır) sayısı</label><input id="os-rows" type="number" min="1" value="${state.rows || 6}"></div>
          <div><label>Sütun (sıra grubu) sayısı</label><input id="os-cols" type="number" min="1" value="${state.cols || 3}"></div>
          <div><label>Sırada kaç kişi</label><select id="os-per"><option value="2" ${(state.perDesk || 2) === 2 ? "selected" : ""}>2 (ikili sıra)</option><option value="1" ${state.perDesk === 1 ? "selected" : ""}>1 (tekli)</option></select></div>
          <div><label>Düzen</label><select id="os-order"><option value="alfabetik">Alfabetik</option><option value="rastgele" ${state.order === "rastgele" ? "selected" : ""}>Rastgele</option><option value="liste" ${state.order === "liste" ? "selected" : ""}>Listedeki sıra</option></select></div>
        </div>
        <label>Öğrenci listesi <span style="color:var(--muted);font-weight:400">(her satıra bir öğrenci; okul numarası başta olabilir)</span></label>
        <textarea id="os-students" rows="6" ${DIS_TA}>${esc(state.studentsText || "")}</textarea>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div><label>Öne alınacaklar <span style="color:var(--muted);font-weight:400">(görme/işitme vb.; her satıra bir ad)</span></label><textarea id="os-front" rows="3" ${DIS_TA}>${esc(state.frontText || "")}</textarea></div>
          <div><label>Yan yana oturmayacaklar <span style="color:var(--muted);font-weight:400">(her satır: Ad Soyad | Ad Soyad)</span></label><textarea id="os-apart" rows="3" ${DIS_TA}>${esc(state.apartText || "")}</textarea></div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
          <button class="primary" id="os-run" style="width:auto;margin:0;padding:9px 16px">Planı Oluştur</button>
          ${last ? `<button class="secondary" id="os-save" style="width:auto;margin:0;padding:9px 16px">Kaydet</button><button class="secondary" id="os-print" style="width:auto;margin:0;padding:9px 16px">Yazdır</button>` : ""}
        </div>
        <div id="os-msg"></div>
        ${last ? `<div style="margin-top:12px"><div style="border:2px solid var(--line);border-radius:6px;padding:4px;text-align:center;font-weight:600;letter-spacing:3px;margin-bottom:6px">TAHTA</div><div class="table-wrap"><table class="data"><tbody>${Array.from({ length: last.rows }, (_, r) => `<tr>${Array.from({ length: last.cols }, (_, c) => `<td style="text-align:center;vertical-align:top">${last.seats.filter(s => s.row === r && s.col === c).map(s => `<div>${esc(s.name || "—")}</div>`).join("")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${last.overflow.length ? `<div class="msg err">Yer kalmadı: ${last.overflow.map(esc).join(", ")} — sıra/sütun sayısını artır.</div>` : ""}${last.violations.length ? `<div class="msg err">${last.violations.length} çift ayrılamadı: ${last.violations.map(([x, y]) => `${esc(x)} – ${esc(y)}`).join("; ")}</div>` : ""}</div>` : ""}
        <div id="oa-preview" style="margin-top:12px"></div>
      </div>
      <div class="card">
        <h3 style="margin-top:0">Kayıtlı Planlar (${data.seatings.length})</h3>
        ${data.seatings.length ? data.seatings.map(x => `<div class="list-item"><span><strong>${esc(x.sinif)}</strong><div style="font-size:11.5px;color:var(--muted)">${x.date ? fmtDate(x.date) : ""} · ${x.seats.filter(s => s.name).length} öğrenci · ${x.rows}×${x.cols}</div></span><div class="row-actions"><button data-os-print="${x.id}">Yazdır</button><button data-os-del="${x.id}">Sil</button></div></div>`).join("") : `<p style="color:var(--muted)">Henüz plan yok.</p>`}
      </div>`;
    wireDate3("os-date");
    const collectOpts = () => ({ sinif: document.getElementById("os-sinif").value.trim(), teacher: document.getElementById("os-teacher").value.trim(), date: document.getElementById("os-date").value || null, rows: +document.getElementById("os-rows").value || 1, cols: +document.getElementById("os-cols").value || 1, perDesk: +document.getElementById("os-per").value || 2, order: document.getElementById("os-order").value, studentsText: document.getElementById("os-students").value, frontText: document.getElementById("os-front").value, apartText: document.getElementById("os-apart").value });
    document.getElementById("os-run").onclick = () => {
      const o = collectOpts(); const msg = document.getElementById("os-msg");
      const students = splitLines(o.studentsText).map(l => l.replace(/^\d{1,6}\s+/, "").trim()).filter(Boolean);
      if (!students.length) { msg.innerHTML = `<div class="msg err">Öğrenci listesi gerekli.</div>`; return; }
      const front = splitLines(o.frontText).map(s => s.trim()).filter(Boolean);
      const apart = splitLines(o.apartText).map(l => l.split("|").map(s => s.trim())).filter(p => p.length === 2 && p[0] && p[1]);
      const res = oaBuildSeating(students, { rows: o.rows, cols: o.cols, perDesk: o.perDesk, order: o.order, front, apart });
      rerender({ ...o, plan: { id: uid(), sinif: o.sinif, teacher: o.teacher, date: o.date, rows: o.rows, cols: o.cols, perDesk: o.perDesk, front, seats: res.seats, overflow: res.overflow, violations: res.violations } });

    if (last) {
      document.getElementById("os-save").onclick = () => { data.seatings.push(last); if (!saveOA(school, profile, data)) { document.getElementById("os-msg").innerHTML = localStorageSaveErrHtml(); return; } rerender({ plan: null }); };

    content.querySelectorAll("[data-os-del]").forEach(b => b.onclick = () => { if (!confirm("Bu plan silinsin mi?")) return; data.seatings = data.seatings.filter(x => x.id !== b.dataset.osDel); saveOA(school, profile, data); rerender({ plan: null }); });

  }

  if (tool === "belgeler") {
    const keys = ["ders_kesim", "yazili_teslim", "proje_secim", "donem_sonu_kontrol"];
    content.innerHTML = `
      <div class="card" style="margin-bottom:14px">
        <h3 style="margin-top:0">Belgelerim</h3>
        <p style="font-size:12.5px;color:var(--muted);margin:0 0 10px">Öğretmenin kendi düzenlediği belgeler; resmî yazı başlığı okul bilgisiyle gelir, imza öğretmenindir. Alanları doldur, "Belgeyi Oluştur" de, yazdır ya da Word'e al.</p>
        <div class="grid">${keys.map(k => { const t = EVRAK_TEMPLATES.find(x => x.key === k); return t ? `<div class="mod clickable" data-oa-doc="${k}"><h3>${esc(t.title)}</h3><p>${esc(t.desc)}</p></div>` : ""; }).join("")}</div>
        <div id="doc-form" style="margin-top:14px"></div>
      </div>`;

  }
}

/* ============ DERS DENETİMİ (öğretmen ders denetim formu) ============ */
/**
 * Dayanak: MEB Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği md.39/3 (Ek: RG-17/1/2025-32785):
 * "Okul müdürü, Bakanlık tarafından kabul edilen eğitim ve öğretim programlarının uygulanmasını denetler,
 * eğitim ve öğretim faaliyetlerinin söz konusu programlarda belirtilen esaslara göre planlanıp uygulanmasına
 * yönelik tedbirler alır." (MEB'in Kasım 2025 konsolide metninden birebir). Formun ölçütleri mevzuatla
 * belirlenmiş değildir; aşağıdaki varsayılan liste okul tarafından "Ölçütler" sekmesinden düzenlenebilir.
 * Ölçek: 1 Geliştirilmeli · 2 İyi · 3 Çok iyi · boş = gözlenmedi.
 */
const DENETIM_SEED = [
  ["Planlama ve Hazırlık", "Ünitelendirilmiş yıllık plan ve günlük ders planı hazır; işlenen kazanımla uyumlu"],

function denetimDayanak(school) {
  return ["ortaokul", "ilkokul", "okul_oncesi"].includes(school.okul_turu)
    ? "MEB Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği md.39/3 (okul müdürü eğitim ve öğretim programlarının uygulanmasını denetler)"
    : "Okul müdürünün eğitim ve öğretim programlarının uygulanmasını denetleme görevi (ilgili kurum yönetmeliği)";

function denetimSummary(obs, criteria) {
  const s = { 1: 0, 2: 0, 3: 0, none: 0 };
  criteria.forEach(c => { const v = obs.scores?.[c.id]; if (v === 1 || v === 2 || v === 3) s[v]++; else s.none++; });
  return s;
}

async function denetimEnsureCriteria(school) {
  let { data: criteria } = await sb.from("observation_criteria").select("*").eq("school_id", school.id).order("sort_order");
  if (!criteria || !criteria.length) {
    const { data: inserted } = await sb.from("observation_criteria").insert(DENETIM_SEED.map(([section, text], i) => ({ school_id: school.id, section, text, sort_order: i }))).select();
    criteria = inserted || [];
  }
  return criteria;
}
