        <option value="upload_video" ${kind === "upload_video" ? "selected" : ""}>Video yükle (≤100MB)</option>
        <option value="embed_video" ${kind === "embed_video" ? "selected" : ""}>YouTube/Vimeo linki</option>
      </select>
      <div id="p-media-input"></div>
      <label>Altyazı <span style="color:var(--muted);font-weight:400">(opsiyonel)</span></label>
      <input id="p-body" value="${esc(isMedya ? (editItem.body_text || "") : "")}" placeholder="örn. Kısa açıklama">
      ${isMedya && editItem?.media_path ? `<p style="font-size:11px;color:var(--muted)">Mevcut dosya yüklü — yeni dosya seçmezsen mevcut kalır.</p>` : ""}
    `;
    renderPanoMediaInput(kind, isMedya ? editItem : null);
    document.getElementById("p-media-kind").onchange = (ev) => renderPanoMediaInput(ev.target.value, isMedya ? editItem : null);
  } else {
    const isPek = editItem?.type === "pekistirec";
    fieldsEl.innerHTML = `
      <label>Başlık</label>
      <input id="p-title" value="${esc(isPek ? editItem.title : "")}" placeholder="örn. Ayın Öğrencisi">
      <label>Kategori</label>
      <select id="p-category">
        ${PANO_CATEGORY_OPTIONS.map(c => `<option value="${c}" ${isPek && editItem.category === c ? "selected" : ""}>${c}</option>`).join("")}
      </select>
      <label>İsim / Sınıf</label>
      <input id="p-subject" value="${esc(isPek ? (editItem.subject_name || "") : "")}" placeholder="örn. 8-A ya da Ahmet Yılmaz">
      <label>Dönem <span style="color:var(--muted);font-weight:400">(opsiyonel)</span></label>
      <input id="p-period" value="${esc(isPek ? (editItem.period_label || "") : "")}" placeholder="örn. Eylül 2026">
      <label>Açıklama <span style="color:var(--muted);font-weight:400">(opsiyonel)</span></label>
      <textarea id="p-body" rows="2" style="${ta}">${esc(isPek ? (editItem.body_text || "") : "")}</textarea>
      <label>Fotoğraf <span style="color:var(--muted);font-weight:400">(opsiyonel, ≤10MB)</span></label>
      <input id="p-media-file" type="file" accept="image/*">
      ${isPek && editItem?.media_path ? `<p style="font-size:11px;color:var(--muted)">Mevcut fotoğraf yüklü — yeni dosya seçmezsen mevcut kalır.</p>` : ""}
    `;
  }
}

function renderPanoItemRow(i) {
  let thumb;
  if (i.media_kind === "upload_image" && i.media_path) {
    thumb = `<img src="${esc(panoPublicUrl(i.media_path))}" style="width:56px;height:56px;object-fit:cover;border-radius:6px;flex:none">`;
  } else if (i.media_kind === "upload_video" && i.media_path) {
    thumb = `<video src="${esc(panoPublicUrl(i.media_path))}" style="width:56px;height:56px;object-fit:cover;border-radius:6px;flex:none" muted></video>`;
  } else if (i.media_kind === "embed_video") {
    thumb = `<div style="width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--surface-2);border-radius:6px;flex:none">📺</div>`;
  } else if (i.type === "pekistirec") {
    thumb = `<div style="width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--surface-2);border-radius:6px;flex:none">🏆</div>`;
  } else {
    thumb = `<div style="width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--surface-2);border-radius:6px;flex:none">📢</div>`;
  }
  return `
    <div class="card" style="margin-bottom:10px;background:var(--surface-2);display:flex;gap:12px;align-items:flex-start">
      ${thumb}
      <div style="flex:1;min-width:0">
        <strong>${esc(i.title)}</strong>
        <span class="pill">${PANO_TYPE_LABELS[i.type]}</span>
        <span class="pill ${i.status === "yayinda" ? "" : "warn"}">${i.status === "yayinda" ? "Yayında" : "Taslak"}</span>
        ${i.category ? `<span class="pill">${esc(i.category)}</span>` : ""}
        ${i.subject_name ? `<div style="font-size:13px;margin-top:4px">${esc(i.subject_name)}${i.period_label ? ` · ${esc(i.period_label)}` : ""}</div>` : ""}
        ${i.body_text ? `<div style="font-size:12.5px;color:var(--muted);margin-top:4px">${esc(i.body_text.slice(0, 120))}${i.body_text.length > 120 ? "…" : ""}</div>` : ""}
        <div class="row-actions" style="margin-top:8px">
          ${i.status === "yayinda" ? `<button data-show-now="${i.id}">📺 Şimdi Göster</button>` : ""}
          <button data-toggle-status="${i.id}">${i.status === "yayinda" ? "Geri Al" : "Yayınla"}</button>
          <button data-edit-item="${i.id}">Düzenle</button>
          <button data-del-item="${i.id}">Sil</button>
        </div>
      </div>
    </div>
  `;
}

async function renderPano(profile, school, content, typeFilter = "hepsi", statusFilter = "hepsi", editingId = null) {
  const [{ data: items }, { data: schoolRow }] = await Promise.all([
    sb.from("pano_items").select("*").eq("school_id", school.id).order("sort_order"),
    sb.from("schools").select("display_token, pano_pin_hash, pano_pin_updated_at").eq("id", school.id).single(),
  ]);
  const pinSet = !!schoolRow?.pano_pin_hash;
  const editItem = editingId ? (items || []).find(i => i.id === editingId) : null;
  const formType = editItem?.type || "duyuru";

  const typeCounts = { duyuru: 0, medya: 0, pekistirec: 0 };
  const statusCounts = { taslak: 0, yayinda: 0 };
  (items || []).forEach(i => { typeCounts[i.type]++; statusCounts[i.status]++; });

  let filtered = items || [];
  if (typeFilter !== "hepsi") filtered = filtered.filter(i => i.type === typeFilter);
  if (statusFilter !== "hepsi") filtered = filtered.filter(i => i.status === statusFilter);

  const displayLink = schoolRow?.display_token ? `${location.origin}${location.pathname.replace(/index\.html$/, "")}pano.html?token=${schoolRow.display_token}` : null;

  content.innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">Görüntüleme Linki</h3>
      <p style="color:var(--muted);font-size:12.5px;margin-bottom:12px">Bu bağlantıyı koridordaki ekranın tarayıcısına bir kere yapıştır, açık bırak — giriş gerekmez, içerikler otomatik döner ve yayınladıkça güncellenir.</p>
      ${displayLink ? `
        <input readonly value="${esc(displayLink)}" style="font-size:12px" onclick="this.select()">
        <button class="secondary" id="regen-token" style="margin-top:10px">Yeniden Oluştur <span style="color:var(--muted);font-weight:400">(eski link geçersiz olur)</span></button>
      ` : `<button class="primary" id="gen-token" style="width:100%">Görüntüleme Linki Oluştur</button>`}
    </div>

    ${displayLink ? `
    <div class="card" style="margin-bottom:16px;${pinSet ? "" : "border-color:var(--warn)"}">
      <h3 style="margin-top:0">Ekran PIN'i <span class="pill ${pinSet ? "good" : "warn"}" style="margin-left:6px">${pinSet ? "Tanımlı" : "Tanımlı değil"}</span></h3>
      <p style="color:var(--muted);font-size:12.5px;margin-bottom:10px">Pano öğrenci adı ve fotoğrafı (ayın öğrencisi vb.) gösterebilir. MEB Bilgi İşlem Genel Müdürlüğü'nün 29.06.2026 tarihli genelgesi (md.5) çevrim içi platformlarda öğrenci ve personel bilgisinin kamuya açık yayımlanmamasını istiyor; bu yüzden bağlantıyı bilen herkes değil, yalnızca PIN'i bilen koridor ekranı içeriği görebilmeli. PIN koridordaki cihazda bir kez girilir ve orada kalır; 15 dakikada 10 hatalı deneme ekranı kilitler.${pinSet && schoolRow.pano_pin_updated_at ? ` Son güncelleme: ${fmtDate(schoolRow.pano_pin_updated_at.slice(0, 10))}.` : ""}</p>
      <div style="display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end">
        <div><label>${pinSet ? "Yeni PIN" : "PIN"} <span style="color:var(--muted);font-weight:400">(4–8 rakam)</span></label><input id="pano-pin" inputmode="numeric" maxlength="8" placeholder="örn. 2468" autocomplete="off"></div>
        <button class="primary" id="pano-pin-save" style="width:auto;margin:0;padding:9px 16px">${pinSet ? "PIN'i Değiştir" : "PIN'i Kaydet"}</button>
      </div>
      ${pinSet ? `<button class="secondary" id="pano-pin-clear" style="width:auto;margin-top:8px;padding:6px 12px;font-size:12.5px">PIN'i kaldır (önerilmez)</button>` : ""}
      <div id="pano-pin-msg"></div>
    </div>` : ""}

    ${displayLink ? `
    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">Canlı Önizleme</h3>
      <p style="color:var(--muted);font-size:12.5px;margin-bottom:12px">Koridordaki ekranda şu an ne gösterildiğini, gerçek boyut oranıyla ve gerçek zamanlı olarak (kendi başına dönerek) buradan görüyorsun — koridora gitmene gerek yok. Aşağıdaki butonlar hem bu önizlemeyi hem <strong>koridordaki gerçek ekranı</strong> anında etkiler.</p>
      <div id="pano-preview-wrap" style="position:relative;width:100%;max-width:640px;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden">
        <iframe id="pano-preview-frame" src="${esc(displayLink)}" style="width:1920px;height:1080px;border:none;pointer-events:none;transform-origin:top left;display:block"></iframe>
      </div>
      <div class="row-actions" style="margin-top:10px">
        <button class="secondary" id="pano-preview-prev">◀ Önceki</button>
        <button class="secondary" id="pano-preview-next">Sıradaki ▶</button>
        <button class="secondary" id="pano-preview-refresh">Yeni Yayınladığımı Hemen Getir</button>
      </div>
    </div>
    ` : ""}

    <div class="card" style="margin-bottom:16px">
      <h3 style="margin-top:0">${editItem ? "İçeriği Düzenle" : "Yeni İçerik"}</h3>
      <label>Tür</label>
      <select id="p-type" ${editItem ? "disabled" : ""}>
        ${Object.entries(PANO_TYPE_LABELS).map(([k, v]) => `<option value="${k}" ${formType === k ? "selected" : ""}>${v}</option>`).join("")}
      </select>
      <div id="p-fields"></div>
      <label>Ekranda kalma süresi (saniye)</label>
      <input id="p-seconds" type="number" min="1" value="${editItem?.display_seconds ?? 15}">
      <label>Başlangıç tarihi <span style="color:var(--muted);font-weight:400">(opsiyonel)</span></label>
      ${dateInputHtml("p-starts", editItem?.starts_on || "")}
      <label>Bitiş tarihi <span style="color:var(--muted);font-weight:400">(opsiyonel, geçince otomatik gizlenir)</span></label>
      ${dateInputHtml("p-ends", editItem?.ends_on || "")}
      <button class="primary" id="p-save" style="width:100%;margin-top:10px">${editItem ? "Güncelle" : "Taslak Olarak Kaydet"}</button>
      ${editItem ? `<button class="secondary" id="p-cancel" style="width:100%;margin-top:8px">İptal</button>` : ""}
      <div id="p-msg"></div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="subtabs" style="flex-wrap:wrap">
        <div class="subtab ${typeFilter === "hepsi" ? "active" : ""}" data-type-filter="hepsi">Tümü (${(items || []).length})</div>
        ${Object.entries(PANO_TYPE_LABELS).map(([k, v]) => `<div class="subtab ${typeFilter === k ? "active" : ""}" data-type-filter="${k}">${v} (${typeCounts[k]})</div>`).join("")}
      </div>
      <div class="subtabs" style="flex-wrap:wrap;margin-top:8px">
        <div class="subtab ${statusFilter === "hepsi" ? "active" : ""}" data-status-filter="hepsi">Tümü</div>
        <div class="subtab ${statusFilter === "taslak" ? "active" : ""}" data-status-filter="taslak">Taslak (${statusCounts.taslak})</div>
        <div class="subtab ${statusFilter === "yayinda" ? "active" : ""}" data-status-filter="yayinda">Yayında (${statusCounts.yayinda})</div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0">İçerikler</h3>
      ${filtered.length ? filtered.map(renderPanoItemRow).join("") : `<p style="color:var(--muted)">Bu filtrede içerik yok.</p>`}
    </div>
  `;

  renderPanoFormFields(editItem, formType);
  wireDate3("p-starts");
  wireDate3("p-ends");
  const typeSelect = document.getElementById("p-type");
  if (!editItem) typeSelect.onchange = (ev) => renderPanoFormFields(null, ev.target.value);

  const genBtn = document.getElementById("gen-token");
  if (genBtn) genBtn.onclick = async () => {
    await sb.from("schools").update({ display_token: crypto.randomUUID() }).eq("id", school.id);
    await renderPano(profile, school, content, typeFilter, statusFilter);
  };
  const regenBtn = document.getElementById("regen-token");
  if (regenBtn) regenBtn.onclick = async () => {
    if (!confirm("Eski link artık çalışmayacak, koridordaki ekranı yeni linkle güncellemen gerekecek. Devam?")) return;
    const newToken = crypto.randomUUID();
    try { const oldPin = localStorage.getItem(`pano_pin_${schoolRow.display_token}`); if (oldPin) localStorage.setItem(`pano_pin_${newToken}`, oldPin); } catch { /* yoksay */ }
    await sb.from("schools").update({ display_token: newToken }).eq("id", school.id);
    await renderPano(profile, school, content, typeFilter, statusFilter);
  };
  const pinSaveBtn = document.getElementById("pano-pin-save");
  if (pinSaveBtn) pinSaveBtn.onclick = async () => {
    const msg = document.getElementById("pano-pin-msg");
    const pin = document.getElementById("pano-pin").value.trim();
    if (!/^[0-9]{4,8}$/.test(pin)) { msg.innerHTML = `<div class="msg err">PIN 4–8 rakamdan oluşmalı.</div>`; return; }
    const { error } = await sb.rpc("set_pano_pin", { p_pin: pin });
    if (error) { msg.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
    try { localStorage.setItem(`pano_pin_${schoolRow.display_token}`, pin); } catch { /* önizleme PIN isteyecek */ }
    await renderPano(profile, school, content, typeFilter, statusFilter);
  };
  const pinClearBtn = document.getElementById("pano-pin-clear");
  if (pinClearBtn) pinClearBtn.onclick = async () => {
    if (!confirm("PIN kaldırılırsa bağlantıyı bilen herkes panoyu görebilir; genelge gereği öğrenci bilgisi içeren içerik yayınlamamalısın. Yine de kaldırılsın mı?")) return;
    const { error } = await sb.rpc("set_pano_pin", { p_pin: null });
    if (error) { document.getElementById("pano-pin-msg").innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
    try { localStorage.removeItem(`pano_pin_${schoolRow.display_token}`); } catch { /* yoksay */ }
    await renderPano(profile, school, content, typeFilter, statusFilter);
  };
  const previewRefreshBtn = document.getElementById("pano-preview-refresh");
  if (previewRefreshBtn) previewRefreshBtn.onclick = () => {
    const frame = document.getElementById("pano-preview-frame");
    frame.src = frame.src;
    sendPanoCommand(schoolRow.display_token, { type: "refresh" });
  };
  const previewPrevBtn = document.getElementById("pano-preview-prev");
  if (previewPrevBtn) previewPrevBtn.onclick = () => sendPanoCommand(schoolRow.display_token, { type: "prev" });
  const previewNextBtn = document.getElementById("pano-preview-next");
  if (previewNextBtn) previewNextBtn.onclick = () => sendPanoCommand(schoolRow.display_token, { type: "next" });
  if (document.getElementById("pano-preview-wrap")) {
    fitPanoPreview();
    window.addEventListener("resize", fitPanoPreview);
  }

  document.getElementById("p-save").onclick = async () => {
    const msg = document.getElementById("p-msg");
    const type = document.getElementById("p-type").value;
    const title = document.getElementById("p-title").value.trim();
    if (!title) { msg.innerHTML = `<div class="msg err">Başlık zorunlu.</div>`; return; }
    const payload = {
      school_id: school.id,
      type,
      title,
      body_text: document.getElementById("p-body")?.value.trim() || null,
      display_seconds: Number(document.getElementById("p-seconds").value) || 15,
      starts_on: document.getElementById("p-starts").value || null,
      ends_on: document.getElementById("p-ends").value || null,
    };
    if (type === "pekistirec") {
      payload.category = document.getElementById("p-category").value;
      payload.subject_name = document.getElementById("p-subject").value.trim() || null;
      payload.period_label = document.getElementById("p-period").value.trim() || null;
      const fileInput = document.getElementById("p-media-file");
      if (fileInput?.files?.[0]) {
        try {
          const path = await panoUploadFile(school, fileInput.files[0], "upload_image");
          payload.media_kind = "upload_image";
          payload.media_path = path;
          payload.media_url = null;
        } catch (e) { msg.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
      }
    } else if (type === "medya") {
      const kind = document.getElementById("p-media-kind").value;
      payload.media_kind = kind;
      if (kind === "embed_video") {
        const url = document.getElementById("p-media-url").value.trim();
        if (!url) { msg.innerHTML = `<div class="msg err">Link gerekli.</div>`; return; }
        payload.media_url = url;
        payload.media_path = null;
      } else {
        const fileInput = document.getElementById("p-media-file");
        if (fileInput?.files?.[0]) {
          try {
            const path = await panoUploadFile(school, fileInput.files[0], kind);
            payload.media_path = path;
            payload.media_url = null;
          } catch (e) { msg.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
        } else if (!editItem?.media_path) {
          msg.innerHTML = `<div class="msg err">Dosya seç.</div>`; return;
        }
      }
    }
    const { error } = editItem
      ? await sb.from("pano_items").update(payload).eq("id", editItem.id)
      : await sb.from("pano_items").insert({ ...payload, created_by: profile.id, sort_order: (items || []).length });
    if (error) { msg.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
    await renderPano(profile, school, content, typeFilter, statusFilter);
  };

  const cancelBtn = document.getElementById("p-cancel");
  if (cancelBtn) cancelBtn.onclick = () => renderPano(profile, school, content, typeFilter, statusFilter);

  content.querySelectorAll("[data-type-filter]").forEach(el => el.onclick = () => renderPano(profile, school, content, el.dataset.typeFilter, statusFilter));
  content.querySelectorAll("[data-status-filter]").forEach(el => el.onclick = () => renderPano(profile, school, content, typeFilter, el.dataset.statusFilter));
  content.querySelectorAll("[data-edit-item]").forEach(b => b.onclick = () => renderPano(profile, school, content, typeFilter, statusFilter, b.dataset.editItem));
  content.querySelectorAll("[data-show-now]").forEach(b => b.onclick = () => sendPanoCommand(schoolRow.display_token, { type: "jump", itemId: b.dataset.showNow }));
  content.querySelectorAll("[data-toggle-status]").forEach(b => b.onclick = async () => {
    const item = (items || []).find(i => i.id === b.dataset.toggleStatus);
    const newStatus = item.status === "yayinda" ? "taslak" : "yayinda";
    await sb.from("pano_items").update({ status: newStatus, published_at: newStatus === "yayinda" ? new Date().toISOString() : item.published_at }).eq("id", item.id);
    await renderPano(profile, school, content, typeFilter, statusFilter);
  });
  content.querySelectorAll("[data-del-item]").forEach(b => b.onclick = async () => {
    if (!confirm("Bu içeriği silmek istediğine emin misin?")) return;
    const item = (items || []).find(i => i.id === b.dataset.delItem);
    if (item?.media_path) await sb.storage.from("pano-media").remove([item.media_path]);
    await sb.from("pano_items").delete().eq("id", item.id);
    await renderPano(profile, school, content, typeFilter, statusFilter);
  });
}

  { id: "nobet", title: "Nöbet Programı", html: `
    <h4>Ayarlar</h4>
    <p>Gün içindeki nöbet <strong>zaman dilimlerini</strong> (Sabah Girişi, Teneffüs vb.) ve nöbet tutulan sabit <strong>alanları</strong> (1. Kat, Bahçe, Yemekhane vb.) burada tanımlarsın.</p>
    <h4>Öğretmenler</h4>
    <p>Bu ekran panelin genelinde kullanılan <strong>tek öğretmen kaynağıdır</strong> — Planlama İşleri, Talep Takibi, LGS Koçluk ve Ders Dağıtımı hep buradan beslenir, başka hiçbir yerde ayrı bir "öğretmen ekle" formu yoktur. Kıdem/hamilelik/engellilik muafiyetleri ve yasaklı alanlar da burada işaretlenir; sistem çizelgeyi oluştururken bunlara otomatik uyar.</p>
    <h4>Dönem &amp; Çizelge</h4>
    <p>Bir dönem (tarih aralığı + tatil günleri) oluştur, "Çizelge Oluştur" bas — dönüşümlü/dengeli dağıtım otomatik yapılır, muafiyetler ve yasaklı alanlar ihlal edilmez. Kota nedeniyle boş kalan slotlar "Eksik Kapsama" uyarısıyla ayrıca gösterilir. İzinli/raporlu bir öğretmenin yerine "Devret" ile en az nöbeti olan uygun öğretmen otomatik önerilir.</p>
    <h4>Ders Dağıtım Programı ile bağlantı</h4>
    <p>Ders Dağıtım Programı'nda bir öğretmenin haftanın belirli günlerinde hiç dersi yoksa (o gün okulda değilse), hem "Çizelge Oluştur" hem de "Devret" o öğretmeni o güne otomatik nöbetçi yazmaz — bu, elle "yasaklı alan" girmeye gerek kalmadan ders programından otomatik çekilir. Bir öğretmenin ders programında hiç kaydı yoksa (örn. idareci ya da program henüz girilmemiş) bu kısıt uygulanmaz, öğretmen her gün için normal şekilde uygun kabul edilir.</p>
    <h4>İdareci Nöbeti</h4>
    <p>Müdür yardımcıları arası nöbet/izin takibi — mevzuatta paylaşıma dair açık hüküm olmadığı için tamamen idarenin takdirine bırakılmış, ayrı bir kayıt defteri.</p>
    <p>Her satırda 📲 ile ilgili öğretmene WhatsApp üzerinden doğrudan bildirim gönderebilirsin.</p>
  ` },
  { id: "evrak", title: "Evrak Deposu", html: `
    <p>5 hazır şablon var: Tebliğ-Tebellüğ Belgesi, Öğretmenler Kurulu Toplantı Tutanağı, Müdür Yardımcısı Görev Dağılımı, Nöbetçi Öğretmen Talimatnamesi, Müdür Devir-Teslim Tutanağı. Formu doldur, "Belgeyi Oluştur" — okul/müdür bilgisi otomatik dolar, resmî yazışma formatında önizleme çıkar. "Yazdır" ya da "Word olarak indir" ile kullanabilirsin.</p>
    <p>Sayfa düzeni, yazı tipi/punto, başlık, Sayı/Tarih/Konu yerleşimi ve imza bloğu <strong>Resmî Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik</strong>e (RG: 10/6/2020-31151) uygun kuruldu. Tek istisna: <strong>"Sayı:"</strong> alanı bilerek boş bırakılıyor — gerçek kayıt numarası ancak okulunun kendi resmî yazışma sistemi (EBYS/kurumsal kayıt defteri) üzerinden alınabilir, bu panel onu uyduramaz; belgeyi resmîleştirirken bu alanı elle doldurman gerekir.</p>
  ` },
  { id: "teftis", title: "Teftişe Hazırlık", html: `
    <p>Kategori bazlı, işaretlenebilir bir kontrol listesi. Her maddede varsa <strong>resmî dayanak</strong> (kanun/yönetmelik) ve sahadan gelen <strong>pratik not</strong> ayrı ayrı tutulur. Liste boşsa "Doğrulanmış örnek maddeler" seed butonuyla gerçek mevzuata dayalı bir başlangıç seti eklenebilir. Kendi maddeni eklerken emin olmadığın resmî dayanağı boş bırak — uydurma girme.</p>
  ` },
  { id: "aylik", title: "Aylık Yönetim Akışı", html: `
    <p>Akademik yıla göre sıralı (Eylül → Ağustos), ay bazlı gruplanmış bir idari görev listesi. İçerik boş başlar, kendi yıllık idari takviminle doldurulur.</p>
  ` },
  { id: "personel", title: "Personel İşleri", html: `
    <p><strong>Personel kayıtlarının asıl kaynağı burasıdır.</strong> "Personel" sekmesine eklediğin herkes (öğretmen, müdür yardımcısı, memur, hizmetli) sunucuda okul bazlı tutulur; Nöbet Programı, Ders Dağıtım, Ek Ders, Ders Denetimi, Planlama, Talep ve LGS aynı listeyi kullanır. Personel türü "Öğretmen" ya da "Yönetici" olanlar nöbet/ders listelerinde görünür; memur ve hizmetliler yalnızca personel, talep ve kurul üyeliği ekranlarında.</p>
    <p>Daha önce bu tarayıcıda tutulan personel listesi ilk açılışta otomatik olarak sunucuya taşınır; aynı ada sahip kayıtlar çoğaltılmaz, birleştirilir. Nöbet kotası, muafiyetler, yasaklı alanlar ve öğretmen davet kodu Nöbet Programı → Öğretmenler'de; ders yükü Ders Dağıtım'da düzenlenir.</p>
    <p>🔒 Maaş/terfi ve devam (rapor, izin) kayıtları hassas olduğu için yalnızca bu tarayıcıda saklanır; başka bilgisayardan girince o iki sekmeyi boş görürsün, personel listesi ise her yerde aynıdır.</p>
  ` },
  { id: "mevzuat", title: "Mevzuata Sor", html: `
    <p>Teftişe Hazırlık ve Aylık Yönetim Akışı'na <strong>senin girdiğin</strong> doğrulanmış maddeler arasında arama yapar. Yapay zekâ değildir, internetten cevap üretmez, hiçbir şey uydurmaz — sadece kendi girdiğin veriyi arar. Bir konuda sonuç çıkmıyorsa, önce ilgili maddeyi Teftişe Hazırlık'a eklemen gerekir.</p>
  ` },
  { id: "ders", title: "Ders Dağıtım Programı", html: `
    <p><strong>Ayarlar</strong>: dersler, şubeler ve ders saatlerini tanımla. <strong>Atamalar</strong>: hangi öğretmenin hangi sınıfa haftada kaç saat gireceğini gir. <strong>Program</strong>: çakışmasız, dengeli bir haftalık ders programı otomatik üretilir.</p>
  ` },
  { id: "kelebek", title: "Sınav Kelebek", html: `
    <p>🔒 Sadece bu cihazda saklanır. Sınıf/şube gruplarını (öğrenci listeleriyle) gir, oturma planını oluştur — aynı gruptan öğrenciler yan yana, art arda ya da çapraz komşu olmayacak şekilde otomatik dağıtılır.</p>
  ` },
  { id: "talep", title: "Talep Takibi", html: `
    <p>Öğretmenlerden gelen talep/bildirimleri (malzeme, bakım-tamirat, izin, diğer) kaydet, durumunu (bekliyor / işlemde / tamamlandı / reddedildi) güncelle. Talep eden, öğretmen listesinden seçilebilir ya da öğretmen olmayan biri için elle yazılabilir.</p>
  ` },
  { id: "planlama", title: "Planlama İşleri", html: `
    <p>Kurul, komisyon ya da kulüp oluştur; üyelerini öğretmen listesinden seç ya da (veli, öğrenci temsilcisi gibi öğretmen olmayanlar için) elle yaz. Her kurul için ayrı toplantı/faaliyet kaydı (tarih, gündem, kararlar) tutulur.</p>
  ` },
  { id: "ogretmen-araclari", title: "Öğretmen Araçları", html: `
    <p>Öğretmen hesaplarının kendi panelinden, idarecilerin ana ekrandan açtığı dört araç. Öğrenci adları ve puanları <strong>yalnızca tarayıcıda</strong>, hesap+okul bazında saklanır; sunucuya gönderilmez (Kelebek ve Personel İşleri ile aynı ilke).</p>
    <ol>
      <li><strong>Sınav Analizi</strong>: e-Okul'dan kopyaladığın "Ad Soyad – puan" listesini yapıştır (başta okul numarası olabilir; soru bazlı "Ad | 10 | 8 | …" girişi de olur). Ortalama, medyan, standart sapma, en yüksek/düşük, başarı oranı (eşik varsayılan 50; Türkçe için 70 — Yönetmelik md.21/1), puan dağılımı (0–49,99 / 50–69,99 / 70–84,99 teşekkür / 85+ takdir — md.53/1) ve soru bazında başarı yüzdesi; %50 altındaki sorular "Geliştirilmeli" işaretlenir. Değerlendirme notunla birlikte resmî başlıklı analiz raporu yazdırılır.</li>
      <li><strong>Değerlendirme Ölçeği</strong>: proje, performans ya da ders etkinliklerine katılım için hazır ölçüt şablonları (düzenlenebilir, puanlar toplamı görünür), öğrenci listesi ve puan tablosu; "Dereceli Puanlama Anahtarı ve Puan Çizelgesi" olarak yazdır (md.22/2 proje, md.22/3 katılım puanı notlarıyla).</li>
      <li><strong>Sınıf Oturma Planı</strong>: liste, satır×sütun, ikili/tekli sıra, alfabetik/rastgele düzen; öne alınacaklar (görme/işitme vb.) ve yan yana oturmayacak çiftler kuralı; tahta üstte olacak şekilde basılı plan.</li>
      <li><strong>Belgelerim</strong>: ders kesim raporu, sınav kâğıtları teslim tutanağı, proje seçim formu ve dönem sonu kontrol listesi — Evrak Deposu'ndaki şablonların öğretmen sürümü.</li>
    </ol>
  ` },
  { id: "denetim", title: "Ders Denetimi", html: `
    <p>Okul müdürünün öğretmen ders denetimi için kayıt ve form modülü. Dayanak: <strong>MEB Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği md.39/3</strong> (RG-17/1/2025-32785 ile eklendi: okul müdürü eğitim ve öğretim programlarının uygulanmasını denetler). Formun ölçütleri mevzuatta yazılı değildir; varsayılan 22 ölçüt (Planlama, Dersin İşlenişi, Sınıf Yönetimi, Ölçme-Değerlendirme, Kayıt ve Mesleki Sorumluluklar) okul uygulamasıdır ve "Ölçütler" sekmesinden değiştirilebilir.</p>
    <ol>
      <li><strong>Yeni Denetim</strong>: öğretmeni Personel listesinden seç — branş, kıdem (işe başlama tarihinden), yöneticilik görevi ve haftalık ders saati (Ders Dağıtım'dan) otomatik dolar. Tarih, saat, ders, sınıf, kazanım gir; her ölçütü Geliştirilmeli / İyi / Çok iyi işaretle (gözlenmeyeni boş bırak). Güçlü yönleri ve önerileri yaz. Geri bildirim tarihi denetim tarihinden bir ay sonrasına kurulur.</li>
      <li><strong>Form</strong>: resmî yazı başlıklı basılı form (kimlik/görev bilgileri, denetim bilgileri, ölçüt tablosu ve toplamlar, notlar, "Geliştirilmeli maddeler için … tarihine kadar bilgi veriniz" ricası, öğretmen tebellüğ ve denetleyen imzası). Yazdır ya da Word'e al; öğretmene imzalatıp dosyala.</li>
      <li><strong>Takip</strong>: geri bildirim tarihi geçen ve "alındı" işaretlenmeyen denetimler kayıt listesinde kırmızı görünür, ana ekranda rozet olur. Öğretmen bilgi verince "Geri bildirim alındı" de, notu yaz.</li>
      <li><strong>Öğretmen Özeti</strong>: kim kaç kez denetlendi, son denetimde kaç "Geliştirilmeli", geri bildirim bekleyenler; okul genelinde en çok "Geliştirilmeli" alan ölçütler (zümre veya seminer konusu için).</li>
    </ol>
    <p style="color:var(--muted)">Denetim kayıtları öğretmen kişisel verisidir; yalnızca idareci hesapları görür. Denetimi tehdit aracı değil gelişim aracı olarak kullan: güçlü yönleri de mutlaka yaz.</p>
  ` },
  { id: "ekders", title: "Ek Ders Onay Çizelgesi", html: `
    <p>Yönetici ve öğretmenlerin haftalık <strong>aylık karşılığı ders, ek ders ve ek ders görevinden sayılan</strong> saatlerini tek çizelgede toplar; 2006/11350 sayılı Karar, 8. Dönem Toplu Sözleşme ve 657/176'ya göre sınırları denetler; yatay A4 çizelge ve olur yazısı üretir. Sayıların tamamı birincil kaynaktan doğrulanmıştır; memur aylık katsayısı ise panelde tutulmaz, her dönem Hazine ve Maliye Bakanlığı genelgesinden sen girersin.</p>
    <ol>
      <li><strong>Çizelge oluştur</strong>: başlık, dönem aralığı, katsayı (isteğe bağlı), kurum kategorisi (md.10/1-c: ortaokul/ilkokul/genel lise "diğer"; anadolu/fen/mesleki/özel eğitim/okul öncesi ayrı) ve olur makamı.</li>
      <li><strong>Personelden doldur</strong>: Personel İşleri'ndeki herkes eklenir; haftalık ders yükü Ders Dağıtım'dan, nöbet Nöbet Programı'ndan (son 45 günde nöbeti olanlara 3 saat) gelir. Görev tahmini branştan yapılır (rehber, sınıf, okul öncesi, müdür yardımcısı); gerekirse düzelt.</li>
      <li><strong>Otomatik hesap</strong>: aylık karşılığı (md.5: yönetici 6, sınıf/okul öncesi 18, branş 15, atölye 20), ek ders (kalan saat; md.6 üst sınırı aşarsa uyarı), hazırlık-planlama (md.11: her 10 saate 1, en çok 3; yönetici ve rehber öğretmene yok), ders niteliğinde yönetim görevi (md.10: ortaokulda müdür 20, müdür yrd. 18, rehber öğretmen 18).</li>
      <li><strong>Elle girilenler</strong>: sosyal ve kişilik hizmetleri (2 saat), egzersiz (≤6), DYK gündüz/gece, sınav görevi (her görev 5 saat), mesleki çalışma (15), diğer gündüz/gece; lisansüstü (YL %7, doktora %20 — yalnızca ek ders ve yönetim görevine uygulanır).</li>
      <li><strong>Belgeler</strong>: "Çizelge (yatay A4)" tüm sütunlar + toplamlar + imza/OLUR bloğu; "Olur yazısı" 657/176 birim ücretlerini katsayıyla hesaplayıp (140, 150, %25 → 175, DYK 280/300, YL 149,8, doktora 168) resmî yazı formatında verir. Yazdır veya Word'e al.</li>
    </ol>
    <p style="color:var(--muted)">Tahmini tutar, haftalık plan × birim ücrettir; kesin aylık ödeme MEBBİS Ek Ders Modülünde fiilen yapılan gün/saat üzerinden hesaplanır (md.25: ek ders fiilen yapılmadan ödenmez, düzenleyen ve onaylayan müteselsilen sorumludur).</p>
  ` },
  { id: "disiplin", title: "Öğrenci Disiplin Dosyası", html: `
    <p>Okul türüne göre iki ayrı rejim: <strong>Ortaokul</strong> — MEB Okul Öncesi Eğitim ve İlköğretim Kurumları Yönetmeliği Madde 54–65 (Öğrenci Davranışlarını Değerlendirme Kurulu; uyarma/kınama/okul değiştirme). <strong>Lise</strong> — MEB Ortaöğretim Kurumları Yönetmeliği md.163–176 ve 185–198 (Okul Öğrenci Ödül ve Disiplin Kurulu; kınama / 1–5 gün kısa süreli uzaklaştırma / okul değiştirme / örgün eğitim dışına çıkarma; davranış puanı 10/20/40/80; tedbir kararı md.175; rehberlik raporu md.192; savunma md.194; itiraz md.169/3 ve kesin karar md.169/4). Akış aynı sekiz aşamadan geçer: Olay &amp; Tutanak → Uyarma Süreci / Rehberlik Raporu &amp; Sevk → İfadeler (&amp; Savunma) → Kurul &amp; Karar → Onay → Veliye Tebliğ → İtiraz → e-Okul &amp; Kapanış. Aşama çubuğundaki her adımın üzerine gelince ilgili hüküm görünür.</p>
    <ol>
      <li><strong>Dosya aç</strong>: öğrenci, olay tarihi/yeri, kısa konu; istersen Madde 55'teki davranış türünü seç (bilgi amaçlı — nihai takdir kurulun, Madde 56/1).</li>
      <li><strong>Belge ekle</strong>: olay tutanağı, öğrenci/tanık ifadesi, ifade vermeme tutanağı, rehberlik görüşü, veli görüşme tutanağı, kurula sevk, kurul kararı, müdür onayı, veliye tebliğ + tebellüğ, ilçe üst yazısı. Alanlar dosya bilgisiyle dolu gelir; Planlama İşleri'nde adında "Davranış" geçen bir kurul varsa üyeler de otomatik dolar. Her belge kaydedilir, sonradan yeniden açılıp yazdırılır/Word'e alınır.</li>
      <li><strong>Süre Takibi</strong>: kurulun 5 iş günü inceleme süresi (Madde 59/3), okul değiştirmede dosyanın ilçeye 5 iş günü içinde gönderilmesi (Madde 61/1), velinin tebliğden itibaren 5 iş günlük itiraz süresi (Madde 56/11) otomatik hesaplanır; süresi geçen dosya sayısı ana ekranda rozet olur. İş günü hesabı hafta sonunu atlar, resmî tatilleri bilmez.</li>
      <li><strong>Dizi Pusulası</strong>: dosyadaki belgelerden otomatik üretilir — ilçeye gönderirken ya da teftişte dosyanın içindekiler listesi.</li>
    </ol>
    <p>Kurul kararı belgesi Madde 60/3'ün zorunlu unsurlarını (gerekçe, takdirde esas alınan hususlar, dayanılan maddeler, oy durumu, imzalar) içerir; resmî karar defterine <strong>EK-10</strong> formatında yazılması gerektiğini belgede hatırlatır. Sistem, okul değiştirme yaptırımına "müdür onayı" girilmesini engeller (onay ilçe kurulundan gelir, Madde 56/6).</p>
    <p style="color:var(--muted)">Lisede ek olarak: tedbir kararı (md.175: en çok 10 iş günü, 3 iş günü içinde işlem başlar), savunma çağrı yazısı ve savunma tutanağı (md.194), kısa süreli uzaklaştırmada gün sayısı (1–5), onay mercii cezaya göre (kınama/kısa süreli → müdür; okul değiştirme → ilçe; örgün eğitim dışı → il), itirazın 5 iş günü içinde yetkili kurula gönderilmesi ve davranış puanı indirimi (md.170). Okul öncesi ve ilkokulda yaptırım yoktur; modül yalnızca kayıt için kullanılır.</p>
  ` },
  { id: "bakim", title: "Periyodik Bakım Takibi", html: `
    <p>Okulun periyodik bakım/kontrol kalemlerini (asansör, yangın tüpü, su deposu, doğalgaz, paratoner, jeneratör…) tek yerden takip eder: <strong>son yapılma tarihi + periyot → sonraki tarih</strong>, kalan gün ve durum (Gecikti / Yaklaşıyor / Uygun) otomatik hesaplanır. "Yaklaşıyor" eşiği 30 gündür; aylık kalemlerde periyodun yarısı (15 gün) alınır ki yeni yapılmış bir bakım hemen uyarı vermesin. Gecikmiş kalem sayısı ana ekrandaki kartta rozet olarak görünür.</p>
    <ol>
      <li>İlk açılışta "Örnek kalemleri ekle" ile sık rastlanan kalemleri yükle, sonra düzenle/sil. <strong>Periyotlar öneridir</strong> — asansör, yangın tesisatı, doğalgaz, elektrik/topraklama gibi kalemlerde yürürlükteki mevzuatın ve yetkili kuruluşun belirlediği süreyi esas al, gerekirse periyodu değiştir.</li>
      <li>Bir bakım yapıldığında ilgili satırda <strong>"✓ Yapıldı"</strong> de, tarih/yapan/not/maliyet gir — hem sonraki tarih otomatik ilerler hem de kayıt <strong>Bakım Geçmişi</strong>'ne kalıcı olarak düşer (teftişte "ne zaman yapıldı, kim yaptı" sorusunun cevabı).</li>
      <li><strong>Yıllık Plan</strong> sekmesi sonraki 12 ayda hangi bakımın hangi aya düştüğünü gösterir — bütçe ve firma randevusu planlaması için.</li>
    </ol>
    <p>"Yazdır" ile hem çizelgeyi hem geçmişi kâğıda dökebilirsin.</p>
  ` },
  { id: "pano", title: "Okul Panosu", html: `
    <p><strong>Ekran PIN'i (kişisel veri koruması):</strong> Görüntüleme linkini oluşturduktan sonra "Ekran PIN'i" kartından 4–8 rakamlı bir PIN belirle. Koridordaki ekranda link ilk açıldığında PIN bir kez girilir ve o cihazda kalır; bağlantıyı ele geçiren başka biri içeriği göremez (15 dakikada 10 hatalı deneme ekranı kilitler). Dayanak: MEB Bilgi İşlem Genel Müdürlüğü'nün 29.06.2026 tarihli genelgesi md.5 — çevrim içi platformlarda öğrenci/personel bilgisi kamuya açık yayımlanamaz. Panelin canlı önizlemesi PIN'i kendiliğinden kullanır. PIN'i değiştirince koridor ekranı yeni PIN'i ister; ekrandaki 🔒 düğmesi PIN'i cihazdan siler.</p>
    <p>Koridora asılacak ikinci bir ekran için duyuru, medya (fotoğraf/video yükleme ya da YouTube-Vimeo linki) ve pekiştireç (ayın öğrencisi vb.) yönetimi.</p>
    <ol>
      <li>"Görüntüleme Linki Oluştur"a bas, çıkan bağlantıyı koridordaki ekranın tarayıcısına <strong>bir kere</strong> yapıştır ve açık bırak — giriş gerekmez.</li>
      <li>İçerik eklerken tür seç (duyuru/medya/pekiştireç), kaydet — bu, <strong>taslak</strong> olarak kalır, ekranda görünmez.</li>
      <li>Listeden "Yayınla" demeden hiçbir şey koridorda çıkmaz.</li>
    </ol>

async function renderKilavuzModule(profile, school, activeId = "giris") {
  app.innerHTML = `
    <div class="wrap wide">
      <button class="navlink" id="back-dash">← Panele dön</button>
      <div class="eyebrow">Kullanma Kılavuzu</div>
      <h1>${esc(school.name)}</h1>
      <div class="subtitle">Her modülün ne işe yaradığı ve nasıl kullanılacağı.</div>
      <div class="subtabs" style="flex-wrap:wrap">
        ${KILAVUZ_SECTIONS.map(s => `<div class="subtab ${activeId === s.id ? "active" : ""}" data-kilavuz-section="${s.id}">${s.title}</div>`).join("")}
      </div>
      <div class="card guide-content" id="kilavuz-content"></div>
      <button class="secondary" id="kilavuz-print" style="margin-top:14px">Yazdır</button>
    </div>
  `;
  document.getElementById("back-dash").onclick = () => renderDashboard(profile, school);
  const section = KILAVUZ_SECTIONS.find(s => s.id === activeId) || KILAVUZ_SECTIONS[0];
  document.getElementById("kilavuz-content").innerHTML = `<h4>${esc(section.title)}</h4>${section.html}`;
  document.querySelectorAll("[data-kilavuz-section]").forEach(el => el.onclick = () => renderKilavuzModule(profile, school, el.dataset.kilavuzSection));
  document.getElementById("kilavuz-print").onclick = () => window.print();
}

  { cat: "Disiplin Dosyası", q: "Yaptırım sonradan kaldırılabilir mi?", a: `Evet. Madde 62/3: davranışı tekrarlamayan ve olumlu davranışları gözlenen öğrencinin yaptırımı, kurulun dönem sonu toplantısında alacağı kararla kaldırılabilir; karar 5 iş günü içinde e-Okul'daki dosyadan çıkarılır. Dosyada "Yaptırımın kaldırılma tarihi" alanına işle.` },
  { cat: "Periyodik Bakım", q: "Örnek kalemlerdeki periyotlar yasal zorunluluk mu?", a: `Hayır. Örnek periyotlar sahadan gelen yaygın uygulamayı yansıtır, yasal süre değildir. Asansör, yangın tesisatı, doğalgaz, elektrik/topraklama gibi kalemlerde yürürlükteki mevzuatın ve yetkili muayene kuruluşunun belirlediği süre esastır — farklıysa "Düzenle" ile periyodu değiştir.` },
  { cat: "Periyodik Bakım", q: "Eski tarihli bir bakımı sonradan girersem sonraki tarih geriye kayar mı?", a: `Hayır. "✓ Yapıldı" ile girilen tarih, kalemin mevcut son yapılma tarihinden eskiyse sadece Bakım Geçmişi'ne kaydedilir; sonraki bakım tarihi her zaman en güncel yapılma tarihinden hesaplanır.` },
  { cat: "Genel", q: "Bir öğrenciyi/dersi/denemeyi silme yetkisi kimde?", a: `Kalıcı/idari işlemler (ekleme, silme, ders/deneme tanımlama) sadece idareciye açıktır. Öğretmen kendi öğrencisinin bazı bilgilerini güncelleyebilir ama silemez, yeni öğrenci ekleyemez.` },
  { cat: "Genel", q: "Girdiğim veriler nerede saklanıyor, güvenli mi?", a: `Akademik/idari veriler (öğrenci, deneme, nöbet, evrak vb.) Supabase üzerinde, okul bazlı izole (başka bir okulun verisi hiçbir şekilde görünmez) şekilde saklanır. Hassas kabul edilen Personel İşleri ve Sınav Kelebek ise hiç sunucuya gitmez, sadece kullandığın cihazda kalır.` },
];

async function renderSSSModule(profile, school, filterText = "") {
  app.innerHTML = `
    <div class="wrap wide">
      <button class="navlink" id="back-dash">← Panele dön</button>
      <div class="eyebrow">Sıkça Sorulan Sorular</div>
      <h1>${esc(school.name)}</h1>
      <div class="subtitle">Aramak istediğin kelimeyi yaz, ya da aşağıdan gezin.</div>
      <input id="sss-search" placeholder="örn. davet kodu, personel, önizleme…" value="${esc(filterText)}" style="margin-bottom:18px">
      <div id="sss-list"></div>
    </div>
  `;
  document.getElementById("back-dash").onclick = () => renderDashboard(profile, school);

  function renderList(filter) {
    const needle = filter.trim().toLocaleLowerCase("tr-TR");
    const filtered = SSS_ITEMS.filter(item => !needle || (item.q + " " + item.a).toLocaleLowerCase("tr-TR").includes(needle));
    const byCat = {};
    filtered.forEach(item => (byCat[item.cat] ??= []).push(item));
    const listEl = document.getElementById("sss-list");
    listEl.innerHTML = Object.keys(byCat).length ? Object.entries(byCat).map(([cat, items]) => `
      <div class="faq-cat">${esc(cat)}</div>
      ${items.map(item => `
        <details class="faq-item">
          <summary>${esc(item.q)}</summary>
          <div class="faq-answer">${item.a}</div>
        </details>
      `).join("")}
    `).join("") : `<p style="color:var(--muted)">Bu aramayla eşleşen soru bulunamadı.</p>`;
  }
  renderList(filterText);
  document.getElementById("sss-search").oninput = (ev) => renderList(ev.target.value);
}

/* ============ PLATFORM YÖNETİMİ ============ */

function schoolInviteUrl(code) {
  return `${location.origin}${location.pathname}?okul=${encodeURIComponent(code)}`;
}

function idareciInviteUrl(code) {
  return `${location.origin}${location.pathname}?idareci=${encodeURIComponent(code)}`;
}

async function renderPlatformAdmin(profile, formMsg = "") {
  app.innerHTML = `
    <div class="wrap wide">
      <button class="navlink" id="back-dash">← Panele dön</button>
      <div class="eyebrow">Platform Yönetimi</div>
      <h1>Okullar</h1>
      <div class="subtitle">Her okulun hangi modülleri görebileceğini buradan yönet. Bir okulda hiçbir modül işaretsiz bırakılmazsa (tümü açıksa) okul her zaman tüm modülleri görür.</div>
      <div class="card" style="margin-bottom:20px">
        <h3 style="margin-top:0">Yeni Okul Ekle</h3>
        <p style="color:var(--muted);font-size:12.5px;margin-top:-6px">Okulu burada oluştur, çıkan davet kodu/linki müdüre gönder — müdür linke tıklayıp hesap oluşturunca otomatik olarak bu okula bağlanır. Kendi okul kurulum ekranındaki bilgilerin aynısı (Rolün hariç, her zaman Müdür olarak atanır).</p>
        <label>Okul adı</label>
        <input id="pa-name" placeholder="örn. Zübeyde Hanım TOBB Anaokulu">
        <label>İl</label>
        <input id="pa-il" placeholder="Balıkesir">
        <label>İlçe</label>
        <input id="pa-ilce" placeholder="Merkez">
        <label>Müdür adı <span style="color:var(--muted);font-weight:400">(opsiyonel, biliyorsan gir)</span></label>
        <input id="pa-mudur" placeholder="Ad Soyad">
        <label>Okul türü</label>
        <select id="pa-turu">
          <option value="okul_oncesi">Okul Öncesi / Anaokulu</option>
          <option value="ilkokul">İlkokul</option>
          <option value="ortaokul">Ortaokul</option>
          <option value="lise">Lise</option>
        </select>
        <button class="primary" id="pa-create">Okul Oluştur ve Davet Kodu Al</button>
        <div id="pa-create-msg">${formMsg}</div>
      </div>
      <div id="pa-list"><p style="color:var(--muted)">Yükleniyor…</p></div>
    </div>
  `;
  document.getElementById("back-dash").onclick = () => boot();

  document.getElementById("pa-create").onclick = async () => {
    const name = document.getElementById("pa-name").value.trim();
    const il = document.getElementById("pa-il").value.trim();
    const ilce = document.getElementById("pa-ilce").value.trim();
    const mudur_adi = document.getElementById("pa-mudur").value.trim();
    const okul_turu = document.getElementById("pa-turu").value;
    const btn = document.getElementById("pa-create");
    const msg = document.getElementById("pa-create-msg");
    if (!name || !il || !ilce) {
      msg.innerHTML = `<div class="msg err">Okul adı, il ve ilçe zorunlu.</div>`;
      return;
    }
    btn.disabled = true;
    const invite_code = randomInviteCode();
    const { error } = await sb.from("schools").insert({ name, il, ilce, mudur_adi: mudur_adi || null, okul_turu, created_by: profile.id, invite_code, enabled_modules: defaultEnabledModulesFor(okul_turu) });
    btn.disabled = false;
    if (error) {
      msg.innerHTML = `<div class="msg err">${esc(error.message)}</div>`;
      return;
    }
    await renderPlatformAdmin(profile, `<div class="msg ok">"${esc(name)}" oluşturuldu. Davet kodu: <strong style="font-family:ui-monospace,monospace">${esc(invite_code)}</strong> — aşağıdaki listede linkini bulup müdüre gönderebilirsin.</div>`);
  };

  const listEl = document.getElementById("pa-list");
  const { data: schools, error } = await sb.from("schools").select("*").order("created_at", { ascending: false });
  if (error) {
    listEl.innerHTML = `<div class="msg err">${esc(error.message)}</div>`;
    return;
  }
  if (!schools || !schools.length) {
    listEl.innerHTML = `<p style="color:var(--muted)">Henüz kayıtlı okul yok.</p>`;
    return;
  }

  listEl.innerHTML = schools.map(s => {
    const restricted = !!(s.enabled_modules && s.enabled_modules.length);
    const loc = [s.il, s.ilce].filter(Boolean).join("/");
    const pending = !!s.invite_code;
    return `
      <div class="card" data-school="${s.id}" style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">
          <div>
            <strong>${esc(s.name)}</strong>
            <div style="font-size:12.5px;color:var(--muted)">${esc(loc)}${loc && s.mudur_adi ? " · " : ""}${esc(s.mudur_adi || "")}${s.created_at ? ` · ${new Date(s.created_at).toLocaleDateString("tr-TR")}` : ""}</div>
          </div>
          <span class="pill" style="${restricted ? "" : "background:var(--good-soft);color:var(--good)"}">${restricted ? "Kısıtlı" : "Tüm modüller açık"}</span>
        </div>
        <div style="margin-top:10px;font-size:12px">
          ${pending
            ? `<div style="background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px">
                 ⏳ Müdür henüz hesap oluşturmadı. Davet kodu: <strong style="font-family:ui-monospace,monospace">${esc(s.invite_code)}</strong>
                 <input readonly value="${esc(schoolInviteUrl(s.invite_code))}" style="font-size:10.5px;padding:4px;margin-top:4px" onclick="this.select()">
                 <button data-regen-school="${s.id}" style="margin-top:4px">Yeni kod</button>
               </div>`
            : `<span style="color:var(--good)">✅ Müdür hesabı bağlı</span>`}
        </div>
        <div class="chips" style="margin-top:12px">
          ${MODULES.map(m => `<span class="chip ${!restricted || s.enabled_modules.includes(m.name) ? "on" : ""}" data-mod-name="${esc(m.name)}">${esc(m.name)}</span>`).join("")}
        </div>
        <div style="margin-top:12px;display:flex;gap:10px;align-items:center">
          <button class="secondary" data-save="${s.id}">Kaydet</button>
          <span id="pa-msg-${s.id}"></span>
        </div>
      </div>
    `;
  }).join("");

  listEl.querySelectorAll(".chip").forEach(chip => {
    chip.onclick = () => chip.classList.toggle("on");
  });

  listEl.querySelectorAll("[data-regen-school]").forEach(btn => {
    btn.onclick = async () => {
      btn.disabled = true;
      await sb.from("schools").update({ invite_code: randomInviteCode() }).eq("id", btn.dataset.regenSchool);
      await renderPlatformAdmin(profile);
    };
  });

  listEl.querySelectorAll("[data-save]").forEach(btn => {
    btn.onclick = async () => {
      const schoolId = btn.dataset.save;
      const card = listEl.querySelector(`[data-school="${schoolId}"]`);
      const selected = Array.from(card.querySelectorAll(".chip.on")).map(c => c.dataset.modName);
      const allOn = selected.length === MODULES.length;
      const msgEl = document.getElementById(`pa-msg-${schoolId}`);
      btn.disabled = true;
      const { error: saveErr } = await sb.from("schools").update({ enabled_modules: allOn ? null : selected }).eq("id", schoolId);
      btn.disabled = false;
      if (saveErr) {
        msgEl.innerHTML = `<span style="color:var(--crit)">${esc(saveErr.message)}</span>`;
        return;
      }
      msgEl.innerHTML = `<span style="color:var(--good)">Kaydedildi ✓</span>`;
      const pill = card.querySelector(".pill");
      const nowRestricted = !allOn;
      pill.textContent = nowRestricted ? "Kısıtlı" : "Tüm modüller açık";
      pill.style.cssText = nowRestricted ? "" : "background:var(--good-soft);color:var(--good)";
      setTimeout(() => { if (document.body.contains(msgEl)) msgEl.innerHTML = ""; }, 2500);
    };
  });
}

async function boot() {
  app.innerHTML = "";
  const { data: { user } } = await sb.auth.getUser();
  if (!user) {
    renderAuth("login");
    return;
  }
  const { data: profile } = await sb
    .from("profiles")
    .select("*, schools(*)")
    .eq("id", user.id)
    .maybeSingle();

  if (!profile || !profile.school_id) {
    const pendingSchoolCode = localStorage.getItem("pendingSchoolCode");
    if (pendingSchoolCode) {
      const { error } = await sb.rpc("claim_school_as_mudur", { p_code: pendingSchoolCode });
      if (!error) {
        localStorage.removeItem("pendingSchoolCode");
        return boot();
      }
      renderJoinError(error.message);
      return;
    }
    const pendingIdareciCode = localStorage.getItem("pendingIdareciCode");
    if (pendingIdareciCode) {
      const pendingIdareciName = localStorage.getItem("pendingIdareciName") || "";
      const { error } = await sb.rpc("claim_idareci_invite", { p_code: pendingIdareciCode, p_full_name: pendingIdareciName });
      if (!error) {
        localStorage.removeItem("pendingIdareciCode");
        localStorage.removeItem("pendingIdareciName");
        return boot();
      }
      renderJoinError(error.message);
      return;
    }
    const pendingCode = localStorage.getItem("pendingJoinCode");
    if (pendingCode) {
      const { error } = await sb.rpc("join_school_as_teacher", { p_code: pendingCode });
      if (!error) {
        localStorage.removeItem("pendingJoinCode");
        return boot();
      }
      renderJoinError(error.message);
      return;
    }
    renderSchoolSetup(user);
    return;
  }
  profile.email = user.email;
  if (profile.role === "ogretmen") {
    renderTeacherDashboard(profile, profile.schools);
    return;
  }
  renderDashboard(profile, profile.schools);
}

boot();
</script>
